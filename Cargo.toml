[package]
name = "emery"
description = "A tool for specifying and running code generation workflows"
categories = ["command-line-utilities", "development-tools"]
keywords = ["emery", "cli", "spec", "workflow", "automation"]
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "emery"
path = "src/main.rs"

[dependencies]
cfg-if.workspace = true
emery-source.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-cursor.workspace = true
omnia-filesystem.workspace = true
omnia-wasi-blobstore.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
emery-engine.workspace = true
omnia-guest.workspace = true
wasip3.workspace = true

[build-dependencies]
omnia.workspace = true

# The SDK and prose registry serve `examples/adapter` only; the shipped
# guest and runtime link the contract crate alone.
[dev-dependencies]
emery-adapter.workspace = true
emery-prose.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
emery-engine.workspace = true
omnia-guest.workspace = true
omnia-test = { workspace = true, features = ["guest"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "adapter"
path = "examples/adapter/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "runtime"
path = "examples/runtime.rs"

[lints]
workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/emery"
rust-version = "1.98"
version = "0.38.0"

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
all = { level = "warn", priority = -1 }      # correctness, suspicious, style, complexity, perf
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html

# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Recommended-but-skipped restriction lints with rationale:
# - `tests_outside_test_module`: fires on every integration test in `tests/*.rs`
# - `str_to_string`: opinionated against `.to_string()` on `&str`;
# - `field_scoped_visibility_modifiers`

[workspace.dependencies]
anyhow = "1.0.104"
cfg-if = "1.0.4"
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6"
schemars = "1.2.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt"] }
toml = "1.1.4"
wasip3 = "0.8.0"
wasmtime = { version = "48.0.1", default-features = false, features = ["anyhow", "component-model-bytes"] }
wit-bindgen = { version = "0.61.1", features = ["async-spawn"] }

emery-adapter = { path = "crates/adapter" }
emery-engine = { path = "crates/engine" }
emery-prose = { path = "crates/prose" }
emery-source = { path = "crates/source" }

omnia = { version = "0.36.0", default-features = false, features = ["jit"] }
omnia-core = { version = "0.36.0" }
omnia-guest = "0.36.0"
omnia-guest-macros = "0.36.0"
omnia-host-macros = "0.36.0"
omnia-plugin = "0.36.0"
omnia-test = { version = "0.36.0", default-features = false }
omnia-wasi-blobstore = "0.36.0"
omnia-wasi-keyvalue = "0.36.0"
omnia-wasi-model = "0.36.0"
omnia-wasi-otel = "0.36.0"

omnia-cursor = "0.29.0"
omnia-filesystem = "0.29.0"

[patch.crates-io]
# Pinned to omnia `main` until omnia-test's first publish (3.7); every omnia
# crate rides one git source so the workspace sees one revision.
omnia = { git = "https://github.com/augentic/omnia" }
omnia-core = { git = "https://github.com/augentic/omnia" }
omnia-guest = { git = "https://github.com/augentic/omnia" }
omnia-guest-macros = { git = "https://github.com/augentic/omnia" }
omnia-host-macros = { git = "https://github.com/augentic/omnia" }
omnia-plugin = { git = "https://github.com/augentic/omnia" }
omnia-test = { git = "https://github.com/augentic/omnia" }
omnia-wasi-blobstore = { git = "https://github.com/augentic/omnia" }
omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
# omnia = { path = "../omnia/crates/omnia" }
# omnia-core = { path = "../omnia/crates/omnia-core" }
# omnia-guest = { path = "../omnia/crates/omnia-guest" }
# omnia-guest-macros = { path = "../omnia/crates/guest-macros" }
# omnia-host-macros = { path = "../omnia/crates/host-macros" }
# omnia-plugin = { path = "../omnia/crates/omnia-plugin" }
# omnia-test = { path = "../omnia/crates/omnia-test" }
# omnia-wasi-blobstore = { path = "../omnia/crates/wasi-blobstore" }
# omnia-wasi-keyvalue = { path = "../omnia/crates/wasi-keyvalue" }
# omnia-wasi-model = { path = "../omnia/crates/wasi-model" }
# omnia-wasi-otel = { path = "../omnia/crates/wasi-otel" }

omnia-cursor = { git = "https://github.com/augentic/omnia-backends" }
omnia-filesystem = { git = "https://github.com/augentic/omnia-backends" }
# omnia-cursor = { path = "../omnia-backends/crates/cursor" }
# omnia-filesystem = { path = "../omnia-backends/crates/filesystem" }

# `wrpc-wasmtime` 0.1.0 is unpublished on crates.io.
wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc" }

[profile.release]
lto = true
opt-level = 2
strip = true

# Optimise WASI debug builds because Cranelift JIT-compiles at run time.
# Dependencies keep line tables only (workspace crates are unaffected): wasmtime
# and Cranelift with full debuginfo dominate `target/`.
[profile.dev.package]
"*" = { debug = "line-tables-only" }
cranelift-assembler-x64 = { opt-level = 2 }
cranelift-bforest = { opt-level = 2 }
cranelift-bitset = { opt-level = 2 }
cranelift-codegen = { opt-level = 2 }
cranelift-control = { opt-level = 2 }
cranelift-entity = { opt-level = 2 }
cranelift-frontend = { opt-level = 2 }
cranelift-native = { opt-level = 2 }
regalloc2 = { opt-level = 2 }
wasmparser = { opt-level = 2 }
wasmtime-environ = { opt-level = 2 }
wasmtime-internal-cranelift = { opt-level = 2 }
