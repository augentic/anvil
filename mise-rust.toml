# Shared Rust workspace tasks. 

# `mise install` and `mise run` install anything missing
[tools]
cargo-binstall = "latest"
mdbook = "latest"
"cargo:cargo-nextest" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-deny" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-vet" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-audit" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-outdated" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-dylint" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:dylint-link" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-llvm-cov" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:mdbook-linkcheck2" = { version = "latest", depends = ["cargo-binstall"] }

# -------------------------------------
# CI Checks (emery composition)
# -------------------------------------

[check]
description = "Pre-commit subset: fmt, lint, test, test-docs, doc"
depends = ["fmt", "lint", "test", "test-docs", "doc"]

[ci]
description = "Full local gate: check + links + vet + deny"
depends = ["check", "vet", "deny"]

[fmt]
description = "nightly rustfmt --all (writes)"
run = "cargo +nightly fmt --all"

[lint]
description = "clippy --workspace under -D warnings"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[doc]
description = "cargo doc --no-deps under -Dwarnings"
env = { RUSTDOCFLAGS = "-Dwarnings" }
run = "cargo doc --no-deps --workspace --all-features --locked"

[test]
description = "nextest workspace run under -Dwarnings"
env = { RUSTFLAGS = "-Dwarnings" }
run = "cargo nextest run --workspace --all-features --no-tests=pass"

[test-docs]
description = "cargo test --doc --workspace"
run = "cargo test --doc --workspace --all-features"

[vet]
description = "Verify cargo-vet inputs"
run = "cargo vet --locked"

[miri]
description = "nightly miri nextest (advisory; not part of ci)"
run = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --workspace --no-tests=pass
'''

# -------------------------------------
# Advisory Checks (omnia composition)
# -------------------------------------

[audit]
description = "cargo audit (advisory; not part of ci)"
run = "cargo audit"

[deny]
description = "cargo deny --workspace check"
run = "cargo deny --workspace check"

[outdated]
description = "cargo outdated (advisory; not part of ci)"
run = "cargo outdated --depth 1"

# -------------------------------------
# Helpers
# -------------------------------------

[vetgen]
description = "Regenerate cargo-vet inputs"
run = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
'''
