# Repo-local checks as a lightweight package: architecture boundary and
# docs/plugin link integrity. Hosted here (not as root-package tests) so
# the Wasmtime-heavy runtime graph stays out of the ordinary test build.
# `fs_git.rs` and `fixtures/` sit alongside but are not test targets
# (`autotests = false`; other crates pull them in via `#[path]` / relative paths).
[package]
name = "checks"
description = "Repo architecture boundary and docs link integrity checks"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false
autobenches = false
autoexamples = false

[[test]]
name = "boundaries"
path = "boundaries.rs"

[[test]]
name = "links"
path = "links.rs"

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
