# The framework-quality gate as its own lightweight package: the
# prose/manifest predicates need only text-processing dependencies, so
# hosting them here (rather than as a root-package test target) keeps
# the Wasmtime-heavy runtime graph out of the ordinary test build.
[package]
name = "framework"
description = "Framework-quality checks over the prose and manifest surfaces"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[test]]
name = "framework"
path = "main.rs"

[dev-dependencies]
regex.workspace = true
schema.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
