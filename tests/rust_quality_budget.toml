# Per-crate src unit-test high-water marks for the ratchet gate enforced
# by `unit_test_budget_holds` in tests/rust_quality.rs.
#
# Keys are crate directory names under crates/ (the root binary's src/ is
# keyed "specify"). The committed number must EQUAL the live count of
# `#[test]` / `#[tokio::test]` declarations under that crate's src/ tree:
#
#   - Above budget fails the gate: do not add src unit tests. Exercise the
#     behavior through the public surface in tests/ instead. Raise a number
#     here only with an explicit review justification.
#   - Below budget fails the gate: a reduction landed; lower the number to
#     lock it in. The ratchet only moves down.
#
# Crates absent from this table have an implicit budget of 0. See
# docs/standards/testing.md and unit-test-reduction.md.
[crate]
standards = 55
workflow = 60
registry = 39
extension = 13
schema = 10
dispatch = 1
specify = 3
model = 1
