source: identity-design-notes
adapter: documentation
authority: documentation
lead: user-registration
claims:
  - kind: requirement
    claim-id: users.register.email-validation
    path: user-registration.md#L3
    statement: "The registration endpoint accepts an email address that is RFC-5322 valid and rejects all others with a 400 response."
  - kind: criterion
    claim-id: users.register.email-validation
    path: user-registration.md#L6
    criterion: "An invalid email returns 400 with the body { \"error\": \"invalid-email\" }."
  - kind: decision
    path: user-registration.md#L8
    decision: "Use the existing identity-store table for persistence; do not introduce a new user store."
