# Expected `composition.yaml` regenerated by `targets/vectis/briefs/build.md`
# from `input/spec.md` + `input/design.md`. The shell writers (iOS, Android)
# consume this file plus operator-curated `tokens.yaml` / `assets.yaml` to
# emit per-platform code.
#
# Status: documentation fixture only. The end-to-end harness that produces this
# file from `input/` does not exist until W3.4 (`/spec:build` skill body) lands.

version: 1

provenance:
  sources:
    - kind: screenshots

screens:
  task-list:
    name: Task List
    maps_to: "ViewModel::TaskList(TaskListView)"

    header:
      title:
        bind: title
      trailing:
        - group:
            direction: row
            gap: sm
            items:
              - icon-button:
                  icon: settings
                  label: Open settings
                  event: Navigate(Settings)

    body:
      list:
        each: tasks
        item:
          - group:
              direction: row
              gap: md
              padding: md
              align: center
              component: task-row
              items:
                - checkbox:
                    bind: completed
                    label: Mark task complete
                    event: ToggleTask(id)
                - group:
                    direction: column
                    gap: xs
                    size:
                      width: fill
                    items:
                      - text:
                          bind: title
                          role: heading
                          style: body
                          strikethrough-when: completed
                      - text:
                          bind: subtitle
                          style: caption
                          color: on-surface-variant
                - icon:
                    icon: chevron-right
                    color: on-surface-variant

    fab:
      icon: plus
      label: Add task
      event: Navigate(AddTask)

    states:
      empty:
        when: "is_empty is true"
        body:
          - group:
              direction: column
              gap: md
              padding: lg
              align: center
              justify: center
              items:
                - image:
                    asset: empty-tasks-hero
                - text:
                    bind: empty_title
                    style: title
                - text:
                    bind: empty_subtitle
                    style: body
                    color: on-surface-variant

    overlays:
      delete-confirm:
        kind: dialog
        trigger: RequestDelete
        title: "Delete task?"
        content:
          - text:
              bind: pending_delete_title
              style: body
          - text:
              content: This task will be removed permanently.
          - group:
              direction: row
              gap: sm
              justify: end
              items:
                - button:
                    label: Cancel
                    style: text
                    event: CancelDelete
                - button:
                    label: Delete
                    style: text
                    color: error
                    event: ConfirmDelete

    platforms:
      ios:
        body:
          list:
            each: tasks
            item:
              - group:
                  direction: row
                  gap: md
                  padding: md
                  align: center
                  component: task-row
                  swipe_actions:
                    - label: Delete
                      style: destructive
                      event: RequestDelete(id)
                  items:
                    - checkbox:
                        bind: completed
                        label: Mark task complete
                        event: ToggleTask(id)
                    - group:
                        direction: column
                        gap: xs
                        size:
                          width: fill
                        items:
                          - text:
                              bind: title
                              role: heading
                              style: body
                              strikethrough-when: completed
                          - text:
                              bind: subtitle
                              style: caption
                              color: on-surface-variant
                    - icon:
                        icon: chevron-right
                        color: on-surface-variant
      android:
        fab:
          icon: plus
          label: Add task
          event: Navigate(AddTask)
          edge_to_edge_inset: system_bars

  add-task:
    name: Add Task
    maps_to: "ViewModel::AddTask(AddTaskView)"

    header:
      title: Add task
      leading:
        - icon-button:
            icon: chevron-left
            label: Back
            event: Navigate(TaskList)
      trailing:
        - button:
            label: Save
            style: text
            event: SaveNewTask
            disabled-when: "can_save is false"

    body:
      form:
        - field:
            label: Title
            bind: title
            event: AddTaskTitleChanged(value)
            error: title_error
        - field:
            label: Subtitle (optional)
            bind: subtitle
            event: AddTaskSubtitleChanged(value)

  settings:
    name: Settings
    maps_to: "ViewModel::Settings"

    header:
      title: Settings
      leading:
        - icon-button:
            icon: chevron-left
            label: Back
            event: Navigate(TaskList)

    body:
      # GAP: settings content is owned by a future feature slice; placeholder body.
      - text:
          content: Settings coming soon.
          style: body
          color: on-surface-variant
