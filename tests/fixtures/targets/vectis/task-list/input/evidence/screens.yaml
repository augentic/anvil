# Hand-authored stand-in for what `sources/screenshots/extract` would emit on
# the matching source-side fixture
# (`tests/fixtures/sources/screenshots/task-list-two-screen/`). The shape
# mirrors `tests/fixtures/sources/screenshots/task-list-two-screen/expected/evidence/`.
# Replace with the live extractor output once W2.4 + W2.6 land together
# (W5.3 acceptance sweep).

source: screens
adapter: screenshots
authority: documentation
lead: task-list

claims:
  - kind: region
    id: task-list.header
    path: task-list-two-screen.png
    screen: task-list
    region: header
    title: Today

  - kind: region
    id: task-list.body
    path: task-list-two-screen.png
    screen: task-list
    region: body

  - kind: region
    id: task-list.fab
    path: task-list-two-screen.png
    screen: task-list
    region: fab

  - kind: region
    id: task-list.states.empty
    path: task-list-two-screen.png
    screen: task-list
    region: states.empty
    state_when: tasks.is_empty
    state_replaces: body

  - kind: region
    id: task-list.overlays.delete-confirm
    path: task-list-two-screen.png
    screen: task-list
    region: overlays.delete-confirm
    overlay_kind: dialog
    title: Delete task?

  - kind: container
    id: task-list.header.trailing
    path: task-list-two-screen.png
    screen: task-list
    region: header
    parent: task-list.header
    container: group
    direction: row

  - kind: container
    id: task-list.body.tasks
    path: task-list-two-screen.png
    screen: task-list
    region: body
    parent: task-list.body
    container: list
    each: tasks
    style: plain

  - kind: container
    id: task-list.body.tasks.task-row
    path: task-list-two-screen.png
    screen: task-list
    region: body
    parent: task-list.body.tasks
    container: group
    component: task-row
    direction: row
    gap: md
    padding: md
    align: center

  - kind: container
    id: task-list.body.tasks.task-row.title-stack
    path: task-list-two-screen.png
    screen: task-list
    region: body
    parent: task-list.body.tasks.task-row
    container: group
    direction: column
    gap: xs
    size:
      width: fill

  - kind: container
    id: task-list.states.empty.hero
    path: task-list-two-screen.png
    screen: task-list
    region: states.empty
    parent: task-list.states.empty
    container: group
    direction: column
    gap: md
    padding: lg
    align: center
    justify: center

  - kind: container
    id: task-list.overlays.delete-confirm.actions
    path: task-list-two-screen.png
    screen: task-list
    region: overlays.delete-confirm
    parent: task-list.overlays.delete-confirm
    container: group
    direction: row
    gap: sm
    justify: end

  - kind: leaf
    id: task-list.header.trailing.settings
    path: task-list-two-screen.png
    screen: task-list
    region: header
    parent: task-list.header.trailing
    leaf: icon-button
    name: settings
    label: Open settings

  - kind: leaf
    id: task-list.body.tasks.task-row.checkbox
    path: task-list-two-screen.png
    screen: task-list
    region: body
    parent: task-list.body.tasks.task-row
    leaf: checkbox
    label: Mark task complete

  - kind: leaf
    id: task-list.body.tasks.task-row.title-stack.title
    path: task-list-two-screen.png
    screen: task-list
    region: body
    parent: task-list.body.tasks.task-row.title-stack
    leaf: text
    role: heading
    style: body

  - kind: leaf
    id: task-list.body.tasks.task-row.title-stack.subtitle
    path: task-list-two-screen.png
    screen: task-list
    region: body
    parent: task-list.body.tasks.task-row.title-stack
    leaf: text
    style: caption
    color: on-surface-variant

  - kind: leaf
    id: task-list.body.tasks.task-row.chevron
    path: task-list-two-screen.png
    screen: task-list
    region: body
    parent: task-list.body.tasks.task-row
    leaf: icon
    name: chevron-right
    color: on-surface-variant

  - kind: leaf
    id: task-list.fab.action
    path: task-list-two-screen.png
    screen: task-list
    region: fab
    parent: task-list.fab
    leaf: icon
    name: plus

  - kind: leaf
    id: task-list.fab.action.label
    path: task-list-two-screen.png
    screen: task-list
    region: fab
    parent: task-list.fab
    leaf: text
    content: Add task

  - kind: leaf
    id: task-list.states.empty.hero.illustration
    path: task-list-two-screen.png
    screen: task-list
    region: states.empty
    parent: task-list.states.empty.hero
    leaf: image
    name: empty-tasks-hero

  - kind: leaf
    id: task-list.states.empty.hero.title
    path: task-list-two-screen.png
    screen: task-list
    region: states.empty
    parent: task-list.states.empty.hero
    leaf: text
    content: No tasks yet
    style: title

  - kind: leaf
    id: task-list.states.empty.hero.subtitle
    path: task-list-two-screen.png
    screen: task-list
    region: states.empty
    parent: task-list.states.empty.hero
    leaf: text
    content: Tap the + button to add your first task.
    style: body
    color: on-surface-variant

  - kind: leaf
    id: task-list.overlays.delete-confirm.message
    path: task-list-two-screen.png
    screen: task-list
    region: overlays.delete-confirm
    parent: task-list.overlays.delete-confirm
    leaf: text
    content: This task will be removed permanently.

  - kind: leaf
    id: task-list.overlays.delete-confirm.actions.cancel
    path: task-list-two-screen.png
    screen: task-list
    region: overlays.delete-confirm
    parent: task-list.overlays.delete-confirm.actions
    leaf: button
    label: Cancel
    style: text

  - kind: leaf
    id: task-list.overlays.delete-confirm.actions.delete
    path: task-list-two-screen.png
    screen: task-list
    region: overlays.delete-confirm
    parent: task-list.overlays.delete-confirm.actions
    leaf: button
    label: Delete
    style: text
    color: error
