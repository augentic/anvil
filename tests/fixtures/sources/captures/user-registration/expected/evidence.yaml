source: runtime
adapter: captures
authority: behaviour
candidate: user-registration
claims:
  - kind: example
    claim-id: user-registration.error
    path: tests/data/replays/user-registration/error.json
    replay-digest: sha256:e41111212ca71f67922818b7270b02ed3f8a7d7975eed77a69358812a3d12fab
    statement: "POST /users with a password shorter than 12 characters returns 400 with `{ code: weak-password }`; no message published."
    input:
      method: POST
      route: /users
      body: { email: carol@example.com, password: abc }
    output:
      status: 400
      body: { code: weak-password, description: "Password must be at least 12 characters." }
  - kind: example
    claim-id: user-registration.happy
    path: tests/data/replays/user-registration/happy.json
    replay-digest: sha256:c7a7d9b3868097506f66e4cbfc6c3abe40b775dab5a89def0709eb362d07f56b
    statement: "POST /users with a fresh email returns 201 and publishes `user.created` with the new user-id."
    input:
      method: POST
      route: /users
      body: { email: alice@example.com, password: "Sup3r-Sekret-Pass!" }
    output:
      status: 201
      body: { id: u_001, email: alice@example.com }
      side-effects:
        - kind: message-pub
          topic: user.created
          payload-shape: { user-id: string, email: string }
