# Inputs the CLI hands the `intent` source adapter for the degenerate N=1 path.
# `survey` receives `source` + `slice-name`; `extract` receives `source` +
# `lead` (which equals `slice-name` under the bare-string shorthand for
# `Slice.sources`).
slice-name: add-search-filter
source: intent
source:
  adapter: intent
  value: "Add a search filter to the user list."
lead: add-search-filter
