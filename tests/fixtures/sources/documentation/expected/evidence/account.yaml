authority: documentation
lead: account
claims:
  - kind: requirement
    id: account.storage
    path: account.md#L3
    statement: "The account service stores per-user identity, credential, and notification preferences."
  - kind: criterion
    id: account.email-uniqueness
    path: account.md#L6
    criterion: "Email is the unique handle; case-insensitive comparisons."
  - kind: criterion
    id: account.password-storage
    path: account.md#L7
    criterion: "Passwords are stored hashed (Argon2id) and never logged."
  - kind: decision
    path: account.md#L9
    decision: "Account records are soft-deleted; hard-delete is a separate operator workflow."
