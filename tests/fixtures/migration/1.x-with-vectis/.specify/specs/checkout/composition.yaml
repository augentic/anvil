# 1.x Vectis composition artifact with a stale `$id` URL pointing at the
# retired `adapters/vectis/` schema location. The 2.0 migration script
# rewrites it to `targets/vectis/schemas/composition.schema.json`.
$schema: https://github.com/augentic/specify/adapters/vectis/composition.schema.json
$id: https://github.com/augentic/specify/adapters/vectis/composition.schema.json
screens:
  - id: cart
    composes: [header, line-items, totals, footer]
  - id: payment
    composes: [header, payment-form, totals, footer]
