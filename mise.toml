# Install: https://mise.jdx.dev
# Run: `mise run <task>` (the root Makefile forwards `make <task>` here)
#
# Shared leaf tasks live in `mise/rust.toml` (local include). After that
# file moves to `augentic/.github`, replace the path below with
# `git::https://github.com/augentic/.github.git//mise/rust.toml?ref=<tag>`.

[task_config]
includes = ["mise-rust.toml"]
# includes = ["git::https://github.com/augentic/.github.git//mise/rust.toml?ref=v0.1.0"]

# -------------------------------------
# Emery-only / policy overrides
# -------------------------------------

[tasks.links]
description = "mdbook build docs (linkcheck)"
run = "mdbook build docs"

[tasks.cov]
description = "llvm-cov nextest summary for $CRATE"
run = "cargo llvm-cov nextest -p ${CRATE} --summary-only"

# The journey-test seam fixture (remediation Phase 2): the mock source
# adapter built as a wasm component, `target/wasm32-wasip2/release/
# examples/source.wasm`.
[tasks.source]
description = "Build the mock source component (wasm32-wasip2, release)"
run = "cargo build --locked --example source --target wasm32-wasip2 --release"

# The journey host (ADR-0009 §5): the shipped runtime shape with a
# scripted `WasiModel` backend, embedding the engine guest built from
# the same sources. `EMERY_EMBED_DIR` stages the built mock component
# into the embedded first-party registry (ADR-0002 §2) so the journey
# exercises embedded resolution as a permanent rung.
[tasks.runtime]
description = "Build the scripted-model host"
depends = ["source"]
run = '''
export EMERY_EMBED_DIR="${CARGO_TARGET_DIR:-$PWD/target}/wasm32-wasip2/release/examples"
cargo build --locked --example runtime
'''

# The walking-skeleton journey test (target-architecture §8) over the
# built seam fixture and the journey host — the Phase 3 exit
# criterion, green and required in CI in its own job, never inside
# `test` (excluded there by the nextest default-filter).
[tasks.journey]
description = "Walking-skeleton rung over the component seam"
depends = ["runtime"]
env = { RUSTFLAGS = "-Dwarnings" }
run = "cargo nextest run -p emery -E 'binary(=journey)' --ignore-default-filter"
