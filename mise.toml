# Install: https://mise.jdx.dev
# Run: `mise run <task>` (the root Makefile forwards `make <task>` here)

# # `mise install` and `mise run` install anything missing
# [tools]
# cargo-binstall = "latest"
# mdbook = "latest"
# "cargo:cargo-nextest" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:cargo-deny" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:cargo-vet" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:cargo-audit" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:cargo-outdated" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:cargo-dylint" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:dylint-link" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:cargo-llvm-cov" = { version = "latest", depends = ["cargo-binstall"] }
# "cargo:mdbook-linkcheck2" = { version = "latest", depends = ["cargo-binstall"] }

[task_config]
includes = ["mise-rust.toml"]
# includes = ["git::https://github.com/augentic/.github.git//mise/rust.toml?ref=v0.1.0"]

# -------------------------------------
# Emery overrides
# -------------------------------------

[tasks.lint]
depends = ["lint-custom"]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.lint-custom]
run = "cargo dylint --all --workspace -- --all-targets"

[tasks.links]
description = "mdbook build docs (linkcheck)"
run = "mdbook build docs"

[tasks.cov]
description = "llvm-cov nextest summary for $CRATE"
run = "cargo llvm-cov nextest -p ${CRATE} --summary-only"

# Skeleton guest
[tasks.source]
description = "Build the mock source component (wasm32-wasip2, release)"
run = "cargo build --example source --target wasm32-wasip2 --release"

# Skeleton runtime
[tasks.runtime]
description = "Build the scripted-model runtime"
depends = ["source"]
run = "cargo build --example runtime"

# Walking-skeleton test
[tasks.journey]
description = "Walking-skeleton rung over the component seam"
depends = ["runtime"]
env = { RUSTFLAGS = "-Dwarnings" }
run = "cargo nextest run -p emery -E 'binary(=journey)' --ignore-default-filter"
