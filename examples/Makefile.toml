[env]
RUST_LOG = "info,opentelemetry_sdk=off,omnia_wasi_http=debug"
SPECIFY_HOME = "${PWD}/sandbox/wasm"
# SPECIFY_HOME = "${CARGO_MAKE_WORKING_DIRECTORY}/sandbox/wasm"

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

# Build the engine guest first, then install the binary with the guest
# embedded (SPECIFY_ENGINE_WASM): the first launch seeds the store
# entry from the embedded bytes, so the example performs no manual
# engine store seeding.
[tasks.wasm-build]
script = '''
cargo build -p specify --lib --examples --target wasm32-wasip2
SPECIFY_ENGINE_WASM=target/wasm32-wasip2/debug/specify.wasm cargo install --path .
'''

[tasks.wasm-run]
dependencies = ["wasm-clean", "wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail

mkdir -p "$SPECIFY_HOME/workspace"

# Use target adapter as an operator-supplied component
cp target/wasm32-wasip2/debug/examples/mock_target.wasm "$SPECIFY_HOME/workspace/mock.wasm"

# Initialise workspace
specify init "$SPECIFY_HOME/workspace/mock.wasm" --name change
specify adapter add target/wasm32-wasip2/debug/examples/mock_source.wasm

# Author, transition, and execute a plan
specify plan author change --source main="mock-source:value:The greeting service."
specify plan transition change approved
specify plan execute
'''
