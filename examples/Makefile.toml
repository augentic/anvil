# Manual entry points for the examples surfaces. Run from inside
# examples/ (`cargo make <task>`); nothing here is wired into the root
# workspace's CI tasks except the root `wasm` compile check, which
# invokes this file's `wasm` task for the adapter guest.

[config]
default_to_workspace = false
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# Check the adapter guest for wasm32-wasip2 (WIT + shim compile).
[tasks.wasm]
script_runner = "bash"
script = '''
set -euo pipefail
root="$(cd "${CARGO_MAKE_WORKING_DIRECTORY}/.." && pwd)"
(cd "${root}" && RUSTFLAGS="-Dwarnings" cargo check --locked -p examples --example greeting-wasm --target wasm32-wasip2)
'''

# Build guests — the workflow core plus the example's adapter component.
[tasks.guests]
script_runner = "bash"
script = '''
set -euo pipefail
root="$(cd "${CARGO_MAKE_WORKING_DIRECTORY}/.." && pwd)"
(cd "${root}" && cargo build --locked --lib -p specify --target wasm32-wasip2)
(cd "${root}" && cargo build --locked -p examples --example greeting-wasm --target wasm32-wasip2)
'''

