[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

# Build the engine guest, the example adapter components, and the
# native binary — wasm32 first, so the native build embeds the
# freshly-built engine bytes (build.rs resolves SPECIFY_WASM).
[tasks.wasm-build]
script = '''
cargo build -p specify --lib --examples --target wasm32-wasip2
cargo build -p specify --bin specify
'''

[tasks.wasm-run]
dependencies = ["wasm-clean", "wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail
export RUST_LOG="info,opentelemetry_sdk=off,omnia_wasi_http=debug"
export SPECIFY_HOME="$PWD/sandbox/wasm"

# Extend the Omnia runtime's default guest timeout to 1 hour.
export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"

# Execute commands in the project directory, not the repository root.
TARGET="$PWD/target"
run() { (cd "$SPECIFY_HOME/project" && "$TARGET/debug/specify" "$@"); }

mkdir -p "$SPECIFY_HOME/project"

# Dynamically add adapters and initialize
run adapter add "$TARGET/wasm32-wasip2/debug/examples/target.wasm"
run adapter add "$TARGET/wasm32-wasip2/debug/examples/source.wasm"
run init target --name change

# Author, transition, and execute a plan
run plan author change --source main="source:value:The greeting service."
run plan transition change approved
run plan execute
'''
