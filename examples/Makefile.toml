# -------------------------------------
# Native examples
# -------------------------------------

# Native mock-catalog lab shim (command passthrough; not the shipped CLI).
# Pair with `eval` for case runs: `cargo make lab -- --project-dir <dir> …`.
[tasks.lab]
command = "cargo"
args = ["run", "-q", "-p", "emery", "--example", "eval", "--", "${@}"]

# One live eval case (`cargo make eval auth --restart [--until plan]`);
# bare `cargo make eval` lists the cases. Case data lives in
# `eval/cases/<id>/case.toml`; the retained sandbox in
# `eval/sandbox/<id>/`.
[tasks.eval]
env_files = [".env"]
script = '''
  export CURSOR_TIMEOUT_SECS="${CURSOR_TIMEOUT_SECS:-300}"
  export RUST_LOG="${RUST_LOG:-info,opentelemetry=off,opentelemetry_sdk=off}"
  cargo run -p emery --example eval -- eval "$@"
'''

# -------------------------------------
# Wasm example
# -------------------------------------

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

[tasks.wasm-build]
script = '''
cargo build -p emery --lib --examples --target wasm32-wasip2
cargo build -p emery --bin emery
'''

[tasks.wasm-run]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail

export EMERY_HOME="$PWD/sandbox/wasm"
export RUST_LOG="${RUST_LOG:-info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia::telemetry=off,omnia_wasi_http=debug}"

# Fresh sandbox each run; cargo artifacts under target/ stay incremental.
rm -rf "$EMERY_HOME"
mkdir -p "$EMERY_HOME/project"
# The sandbox sits inside this repo's checkout: give the project its own
# git root so cursor-agent anchors the workspace (and .cursor/mcp.json
# discovery — the adapter MCP reference grants) at the project, not here.
git init -q "$EMERY_HOME/project"

TARGET="$PWD/target"
# Execute commands in the project directory, not the repository root.
emery() { (cd "$EMERY_HOME/project" && "$TARGET/debug/emery" "$@"); }

# Add source adapter to cache
emery adapter add "$TARGET/wasm32-wasip2/debug/examples/source.wasm"
emery adapter add "$TARGET/wasm32-wasip2/debug/examples/target.wasm"
emery init target --name change

emery plan author change --source main="source:value:The greeting service."
emery plan execute
'''
