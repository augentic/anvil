
[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

[tasks.wasm-build]
script = '''
cargo build -p specify --lib --examples --target wasm32-wasip2
'''

[tasks.wasm-run]
dependencies = ["wasm-clean", "wasm-build"]
env_files = [".env"]
script = '''
export RUST_LOG="info,opentelemetry_sdk=off,omnia_wasi_http=debug"

mkdir -p sandbox/wasm/{workspace,cache,store}
cp target/wasm32-wasip2/debug/examples/mock_target.wasm sandbox/wasm/workspace/mock.wasm

run() {
  cargo run -p specify -- run --config examples/wasm/omnia.toml -- "$@"
}

# Initialize workspace
run init ./mock.wasm --name change

# Author, transition, and execute a plan
run plan author change --source main="mock:value:The greeting service."
run plan transition change approved
run plan execute
'''
