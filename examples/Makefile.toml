# -------------------------------------
# Native examples
# -------------------------------------

[tasks.specify]
command = "cargo"
args = ["run", "-q", "-p", "specify", "--example", "eval", "--", "${@}"]

[tasks.eval]
env_files = [".env"]
script = '''
  export EVAL_TIMEOUT_SECS="${EVAL_TIMEOUT_SECS:-300}"
  cargo run -p specify --example eval -- eval \
  --change "auth" \
  --source "docs=mock-docs:value:The docs source." \
  --source "code=mock-code:value:The code source." \
  --target "mock" \
  "$@"
'''

# -------------------------------------
# Wasm example
# -------------------------------------

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

# Build the engine guest, the example adapter components, and the
# native binary — wasm32 first, so the native build embeds the
# freshly-built engine bytes (build.rs resolves SPECIFY_WASM).
[tasks.wasm-build]
script = '''
cargo build -p specify --lib --examples --target wasm32-wasip2
cargo build -p specify --bin specify
'''

[tasks.wasm-run]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail
export SPECIFY_HOME="$PWD/sandbox/wasm"
# Omnia's default guest timeout (30s) is too short for a live model.
export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"

# Fresh sandbox each run; cargo artifacts under target/ stay incremental.
rm -rf "$SPECIFY_HOME"
mkdir -p "$SPECIFY_HOME/project"

TARGET="$PWD/target"
# SPECIFY="$TARGET/debug/specify"
# PROJECT="$SPECIFY_HOME/project"
# EXAMPLES="$TARGET/wasm32-wasip2/debug/examples"

run() { "$TARGET/debug/specify" --project-dir ""$TARGET/debug/specify"" "$@"; }

# Source must be cache-seeded (plan --source accepts bare names only).
# Target is admitted as a local component at init.
run adapter add "$TARGET/wasm32-wasip2/debug/examples/source.wasm"
run init "$TARGET/wasm32-wasip2/debug/examples/target.wasm" --name change

run plan author change --source main="source:value:The greeting service."
run plan transition change approved
run plan execute
'''
