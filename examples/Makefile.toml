# root="$(cd "${CARGO_MAKE_WORKING_DIRECTORY}/.." && pwd)"
# (cd "${root}" && RUSTFLAGS="-Dwarnings" cargo check --locked -p examples --example change-wasm --target wasm32-wasip2)
# '''

[tasks.change-build]
script = '''
cargo build --example change-wasm --target wasm32-wasip2
cargo build --target wasm32-wasip2
# cargo build --lib -p specify --target wasm32-wasip2
'''

[tasks.change-clean]
script = '''
rm -rf examples/change/workspace examples/change/cache examples/change/store
'''

[tasks.change-run]
dependencies = ["change-clean", "change-build"]
env_files = ["examples/.env"]
script = '''
set -euo pipefail
export RUST_LOG="info,opentelemetry_sdk=off,omnia_wasi_http=debug"

mkdir -p examples/change/{workspace,cache,store}
cp target/wasm32-wasip2/debug/examples/change_wasm.wasm \
  examples/change/workspace/fixture.wasm

run() {
  cargo run --example change -- \
    run --config examples/change/omnia.toml -- "$@"
}

# Initialize the workspace
run init ./fixture.wasm --name change

# Author, transition, and execute the plan
run plan author change --source main="fixture:value:The greeting service."
run plan transition change approved
run plan execute
'''

[tasks.prompt-eval]
script_runner = "bash"
script = '''
set -euo pipefail
root="$(cd "${CARGO_MAKE_WORKING_DIRECTORY}/.." && pwd)"
(cd "${root}" && cargo run --locked -p examples --example prompt-eval)
'''

[tasks.lint]
script_runner = "bash"
script = '''
set -euo pipefail
root="$(cd "${CARGO_MAKE_WORKING_DIRECTORY}/.." && pwd)"
(cd "${root}" && cargo clippy -p examples --all-targets -- -D warnings)
'''
