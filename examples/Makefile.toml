# -------------------------------------
# Native examples
# -------------------------------------

# The one lab entry, shaped like the emery CLI plus the case runner:
# bare `cargo make eval` lists the cases, `cargo make eval <id>` runs
# one (an existing sandbox resumes; `--restart` reruns from fresh
# state), any emery verb passes through (`cargo make eval <id> plan
# status` binds the case's retained sandbox). Case data lives in
# `eval/cases/<id>/case.toml`; the retained sandbox in
# `eval/sandbox/<id>/`. The probe client owns the log presets
# (flagless invocations default to `info`, `--debug` adds the backend
# dumps); cargo-make needs `--` only when the first token is a
# cargo-make flag.
[tasks.eval]
env_files = [".env"]
script = '''
  export CURSOR_TIMEOUT_SECS="${CURSOR_TIMEOUT_SECS:-300}"
  cargo run -p emery --example eval -- "$@"
'''

# -------------------------------------
# Wasm example
# -------------------------------------

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

[tasks.wasm-build]
script = '''
cargo build -p emery --lib --examples --target wasm32-wasip2
cargo build -p emery --bin emery
'''

[tasks.wasm-run]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail

export EMERY_HOME="$PWD/sandbox/wasm"
# Env-driven host filter (no `--debug`/`--quiet` flag, so `RUST_LOG` applies):
# the host's direct-command presets already mute the OTel targets and
# `omnia::telemetry` on every invocation, env-driven included;
# `omnia_wasi_http=debug` is this example's seam-debugging choice.
export RUST_LOG="${RUST_LOG:-info,omnia_wasi_http=debug}"

# Fresh sandbox each run; cargo artifacts under target/ stay incremental.
rm -rf "$EMERY_HOME"
mkdir -p "$EMERY_HOME/project"
# The sandbox sits inside this repo's checkout: give the project its own
# git root so cursor-agent anchors the workspace (and .cursor/mcp.json
# discovery — the adapter MCP reference grants) at the project, not here.
git init -q -b main "$EMERY_HOME/project"

TARGET="$PWD/target"
# Execute commands in the project directory, not the repository root.
emery() { (cd "$EMERY_HOME/project" && "$TARGET/debug/emery" "$@"); }

# Adapters into the cache; target admitted at init.
emery adapter add "$TARGET/wasm32-wasip2/debug/examples/source.wasm"
emery adapter add "$TARGET/wasm32-wasip2/debug/examples/target.wasm"
emery init target --name change

# A local Git origin standing in for the product repository: the
# initialized project tree is the parent revision the delivery binding
# pins (`plan author` validates `.emery/project.yaml` on the fetched
# tree). The locator must be Git-shaped (`<url>@<revision>`) so the
# bind fetch routes host-side through `emery:vcs` — a bare path locator
# is read in-guest, where host paths do not exist. The directory must
# not end in `.git` (the canonical Git-URL form strips that suffix).
git init -q --bare -b main "$EMERY_HOME/origin"
(cd "$EMERY_HOME/project" \
  && echo "# demo" > README.md \
  && git add README.md .emery/project.yaml \
  && git -c user.name=operator -c user.email=operator@example.com \
       commit -qm "seed" \
  && git remote add origin "$EMERY_HOME/origin" \
  && git push -q origin main)

# Reviewed definition home with the delivery target bound to the origin
# — `plan author` takes `--from`/`--wave` only; there is no ad-hoc
# source flag.
cargo run -q -p emery --example definition -- \
  "$EMERY_HOME/definition" "$EMERY_HOME/origin@main"

emery plan author change --from "$EMERY_HOME/definition" --wave deliver
# Refinement is its own stage: execute never refines
# (`plan-refinement-required`).
emery plan refine
emery plan execute
emery plan status
'''

# RFC-95 publication scenario (operator-invoked; script only, never
# CI-gated): the delivery target binds to a local Git origin, the
# execute drain materializes the publication worktree over real Git,
# and the operator Git loop commits and pushes `change/<plan>` with
# both `Emery-Change` trailers. Archive verification needs a
# GitHub-hosted member (GitHub is the only v1 forge), so the scenario
# ends at the pushed branch and the `plan status` publication
# milestone.
[tasks.wasm-publication]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail

export EMERY_HOME="$PWD/sandbox/wasm"
export RUST_LOG="${RUST_LOG:-info,omnia_wasi_http=debug}"

rm -rf "$EMERY_HOME"
mkdir -p "$EMERY_HOME/project"
git init -q -b main "$EMERY_HOME/project"

TARGET="$PWD/target"
emery() { (cd "$EMERY_HOME/project" && "$TARGET/debug/emery" "$@"); }

# Adapters into the cache; target admitted at init.
emery adapter add "$TARGET/wasm32-wasip2/debug/examples/source.wasm"
emery adapter add "$TARGET/wasm32-wasip2/debug/examples/target.wasm"
emery init target --name change

# A local Git origin standing in for the product repository: the
# initialized project tree is the parent revision the publication
# branch starts at. Git-shaped locator, no `.git` suffix — see wasm-run.
git init -q --bare -b main "$EMERY_HOME/origin"
(cd "$EMERY_HOME/project" \
  && echo "# demo" > README.md \
  && git add README.md .emery/project.yaml \
  && git -c user.name=operator -c user.email=operator@example.com \
       commit -qm "seed" \
  && git remote add origin "$EMERY_HOME/origin" \
  && git push -q origin main)

# Reviewed definition home with the delivery target bound to the origin.
cargo run -q -p emery --example definition -- \
  "$EMERY_HOME/definition" "$EMERY_HOME/origin@main"

emery plan author change --from "$EMERY_HOME/definition" --wave deliver
emery plan refine
# The drain's last merge satisfies the D11 predicate and materializes
# the publication worktree (single member, engine-side facts).
emery plan execute
emery plan status

# Operator Git loop: commit the exported tree onto `change/change`
# with both trailers, then push to the origin.
WORKTREE="$EMERY_HOME/publication/change/app"
DIGEST=$(grep -h '"plan.publication.materialized"' \
    "$EMERY_HOME/project/.emery/change/events/"*.jsonl \
  | sed -n 's/.*"plan-digest":"\([^"]*\)".*/\1/p' | head -1)
(cd "$WORKTREE" \
  && git -c user.name=operator -c user.email=operator@example.com \
       commit -qam "Deliver the reviewed greeting" \
       -m "Emery-Change: change" \
       -m "Emery-Change-Digest: $DIGEST" \
  && git push -q origin "change/change")

echo "publication branch pushed; archive verification needs a GitHub-hosted member"
emery plan status
'''
