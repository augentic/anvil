
[tasks.change-build]
script = '''
cargo build -p specify --lib --example change --target wasm32-wasip2
'''

[tasks.change-clean]
script = '''
rm -rf examples/change/workspace examples/change/cache examples/change/store
'''

[tasks.change-run]
dependencies = ["change-clean", "change-build"]
env_files = [".env"]
script = '''
set -euo pipefail
export RUST_LOG="info,opentelemetry_sdk=off,omnia_wasi_http=debug"

mkdir -p examples/change/{workspace,cache,store}
cp target/wasm32-wasip2/debug/examples/change.wasm \
  examples/change/workspace/fixture.wasm

run() {
  cargo run -p specify -- run --config examples/change/omnia.toml -- "$@"
}

# Initialize the workspace
run init ./fixture.wasm --name change

# Author, transition, and execute the plan
run plan author change --source main="fixture:value:The greeting service."
run plan transition change approved
run plan execute
'''
