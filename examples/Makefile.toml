# Prompt evaluation harness — operator-invoked native trial over the
# adversarial fixture lead set. Needs cursor-agent credentials; never CI.
[tasks.prompt-eval]
script_runner = "bash"
script = '''
set -euo pipefail
root="$(cd "${CARGO_MAKE_WORKING_DIRECTORY}/.." && pwd)"
(cd "${root}" && cargo run --locked -p examples --example prompt-eval)
'''

# Lint — a focused clippy leg over the examples package (the root
# workspace-wide `cargo make lint` also compiles it; this scoped run
# gives faster feedback when iterating here).
[tasks.lint]
script_runner = "bash"
script = '''
set -euo pipefail
root="$(cd "${CARGO_MAKE_WORKING_DIRECTORY}/.." && pwd)"
(cd "${root}" && cargo clippy -p examples --all-targets -- -D warnings)
'''
