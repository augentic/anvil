[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

# Build the engine guest and the example adapter components, then the
# binary with the guest embedded (SPECIFY_ENGINE_WASM): the first
# launch seeds the store entry from the embedded bytes, so the example
# performs no manual engine store seeding.
[tasks.wasm-build]
script = '''
cargo build -p specify --lib --examples --target wasm32-wasip2
SPECIFY_ENGINE_WASM=target/wasm32-wasip2/debug/specify.wasm cargo build -p specify --bin specify
'''

[tasks.wasm-run]
dependencies = ["wasm-clean", "wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail
export RUST_LOG="info,opentelemetry_sdk=off,omnia_wasi_http=debug"
export SPECIFY_HOME="$PWD/sandbox/wasm"

run() { target/debug/specify "$@"; }

mkdir -p "$SPECIFY_HOME/workspace"

# Use the target adapter as an operator-supplied component
cp target/wasm32-wasip2/debug/examples/mock_target.wasm "$SPECIFY_HOME/workspace/mock.wasm"

# Initialise the project and seed the source adapter
run init "$SPECIFY_HOME/workspace/mock.wasm" --name change
run adapter add target/wasm32-wasip2/debug/examples/mock_source.wasm

# Author, transition, and execute a plan
run plan author change --source main="mock-source:value:The greeting service."
run plan transition change approved
run plan execute
'''
