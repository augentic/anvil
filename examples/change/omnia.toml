# Specify's hosted change example.

[[guest]]
id = "specify"
source.path = "../../target/wasm32-wasip2/debug/specify.wasm"
link = ["specify:adapter/source@0.1.0", "specify:adapter/target@0.1.0"]

[[guest]]
id = "source:fixture"
source.path = "../../target/wasm32-wasip2/debug/examples/change.wasm"

[[guest]]
id = "target:fixture"
source.path = "../../target/wasm32-wasip2/debug/examples/change.wasm"

# One route suffices: both dispatch ids are served by the same
# component, whose MCP references server is identical on either axis.
[[route.http]]
prefix = "/"
guest = "source:fixture"

[[mount]]
name = "."
path = "../../sandbox/change/workspace"
writable = true

[[mount]]
name = "/specify-cache"
path = "../../sandbox/change/cache"
writable = true
[[mount]]
name = "/specify-store"
path = "../../sandbox/change/store"
writable = true
