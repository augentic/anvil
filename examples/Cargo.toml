[package]
name = "examples"
description = "Specify examples — live-model trial, WASM adapter guest, and boundary smoke"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

# Host runners (wasm-smoke, live-model) need Omnia/Wasmtime. Keep them
# behind the `host` feature so the default wasm32 build carries only
# the guest graph.
[features]
host = [
    "dep:anyhow",
    "dep:artifacts",
    "dep:change",
    "dep:omnia",
    "dep:omnia-cursor",
    "dep:omnia-guest",
    "dep:omnia-testkit",
    "dep:omnia-wasi-http",
    "dep:omnia-wasi-model",
    "dep:omnia-wasi-otel",
    "dep:project",
    "dep:serde",
    "dep:serde_json",
    "dep:serde-saphyr",
    "dep:tempfile",
    "dep:testkit",
    "dep:tokio",
    "dep:toml",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true, optional = true }
artifacts = { workspace = true, optional = true }
change = { workspace = true, optional = true }
omnia = { workspace = true, optional = true }
omnia-cursor = { workspace = true, optional = true }
omnia-guest = { workspace = true, optional = true }
omnia-testkit = { workspace = true, optional = true }
omnia-wasi-http = { workspace = true, optional = true }
omnia-wasi-model = { workspace = true, optional = true }
omnia-wasi-otel = { workspace = true, optional = true }
project = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
testkit = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true, optional = true }

# The wasm32 guest maps `testkit::adapter` — the dependency-free
# fixture adapter core is all testkit compiles to on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
serde_json.workspace = true
testkit.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true

[[example]]
name = "adapter-wasm"
path = "wasm/adapter.rs"
crate-type = ["cdylib"]

[[example]]
name = "wasm-smoke"
path = "wasm/smoke.rs"
required-features = ["host"]

[[example]]
name = "live-model"
path = "native/live.rs"
required-features = ["host"]