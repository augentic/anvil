omnia.workspace = true
omnia-cursor.workspace = true
omnia-guest.workspace = true
omnia-testkit.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
serde_json.workspace = true
testkit.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true

[[example]]
name = "adapter-wasm"
path = "wasm/adapter.rs"
crate-type = ["cdylib"]

[[example]]
name = "wasm-smoke"
