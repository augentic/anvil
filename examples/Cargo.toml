[package]
name = "examples"
description = "Example WASI guest components for the Specify Omnia runtime"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Guest-only: the echo components compile solely for wasm32, so their
# dependencies live under the same target gate omnia's guests use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
serde_json.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true

# The echo adapter guests: skeleton wasm32-wasip2 components loaded by
# the composed runtime tests in crates/runtime/tests/ (`cargo make
# build-guests` builds them, and the tests self-build on first use).
# Underscore names keep the artifact filenames deterministic
# (target/wasm32-wasip2/debug/examples/echo_{source,target}.wasm).
[[example]]
name = "echo_source"
path = "echo/source.rs"
crate-type = ["cdylib"]

[[example]]
name = "echo_target"
path = "echo/target.rs"
crate-type = ["cdylib"]
