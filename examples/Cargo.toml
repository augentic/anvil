[package]
name = "examples"
description = "Specify examples — native adapter lib, live-model trial, WASM adapter guest, and boundary smoke"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

# [lib]
# name = "adapter"
# path = "native/adapter.rs"

# Host runners (wasm-smoke, live-model) need Omnia/Wasmtime. Keep them
# behind the `host` feature so ordinary consumers of the adapter lib —
# notably `change` integration tests — never pull that graph.
[features]
host = [
    "dep:anyhow",
    "dep:artifacts",
    "dep:change",
    "dep:diagnostics",
    "dep:error",
    "dep:omnia",
    "dep:omnia-cursor",
    "dep:omnia-guest",
    "dep:omnia-testkit",
    "dep:omnia-wasi-http",
    "dep:omnia-wasi-model",
    "dep:omnia-wasi-otel",
    "dep:project",
    "dep:serde",
    "dep:serde_json",
    "dep:serde-saphyr",
    "dep:slice",
    "dep:tempfile",
    "dep:tokio",
    "dep:toml",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true, optional = true }
artifacts = { workspace = true, optional = true }
change = { workspace = true, optional = true }
diagnostics = { workspace = true, optional = true }
error = { workspace = true, optional = true }
omnia = { workspace = true, optional = true }
omnia-cursor = { workspace = true, optional = true }
omnia-guest = { workspace = true, optional = true }
omnia-testkit = { workspace = true, optional = true }
omnia-wasi-http = { workspace = true, optional = true }
omnia-wasi-model = { workspace = true, optional = true }
omnia-wasi-otel = { workspace = true, optional = true }
project = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
slice = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
serde_json.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true

[[example]]
name = "adapter-wasm"
path = "wasm/adapter.rs"
crate-type = ["cdylib"]

[[example]]
name = "wasm-smoke"
path = "wasm/smoke.rs"
required-features = ["host"]

[[example]]
name = "live-model"
path = "native/live.rs"
required-features = ["host"]

[[example]]
name = "adapter-native"
path = "native/adapter.rs"