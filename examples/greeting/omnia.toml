# Specify's hosted greeting example.

[[guest]]
id = "specify"
source.path = "../../target/wasm32-wasip2/debug/specify.wasm"
link = ["specify:adapter/source@0.1.0", "specify:adapter/target@0.1.0"]

[[guest]]
id = "source:fixture"
source.path = "../../target/wasm32-wasip2/debug/examples/greeting_wasm.wasm"

[[guest]]
id = "target:fixture"
source.path = "../../target/wasm32-wasip2/debug/examples/greeting_wasm.wasm"

[[route.http]]
prefix = "/"
guest = "source:fixture"

[[route.http]]
prefix = "/"
guest = "target:fixture"

[[mount]]
name = "."
path = "workspace"
writable = true

[[mount]]
name = "/specify-cache"
path = "cache"
writable = true
[[mount]]
name = "/specify-store"
path = "store"
writable = true