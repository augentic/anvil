# cross-rs configuration for the aarch64-linux release leg.
#
# The release pipeline builds the wasm32 engine guest on the host and
# embeds it into the platform binary via SPECIFY_ENGINE_WASM (see
# docs/release.md); the variable must reach the build container. The
# relative path resolves inside the container because cross mounts the
# project root as the working directory.

[build.env]
passthrough = ["SPECIFY_ENGINE_WASM"]
