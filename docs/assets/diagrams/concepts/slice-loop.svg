<svg viewBox="0 0 920 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Per-slice refine build merge loop">
  <title>Per-slice loop</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <text x="20" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">PER-SLICE LOOP (inside plan execute)</text>
  <rect x="20" y="40" width="150" height="52" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="32" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">/emery:refine</text>
  <text x="32" y="80" font-family="ui-monospace, monospace" font-size="11" fill="#555">extract + synthesize</text>
  <path d="M170 66 L210 66" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="218" y="70" font-family="ui-monospace, monospace" font-size="10" fill="#888">artifacts</text>
  <rect x="250" y="40" width="150" height="52" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="262" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">/emery:build</text>
  <text x="262" y="80" font-family="ui-monospace, monospace" font-size="11" fill="#555">implement tasks</text>
  <path d="M400 66 L440 66" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="448" y="70" font-family="ui-monospace, monospace" font-size="10" fill="#888">complete</text>
  <rect x="480" y="40" width="150" height="52" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="492" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">/emery:merge</text>
  <text x="492" y="80" font-family="ui-monospace, monospace" font-size="11" fill="#555">fold into baseline</text>
  <path d="M630 66 L670 66" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <ellipse cx="760" cy="66" rx="70" ry="32" fill="#e6d9f0" stroke="#a489d8"/>
  <text x="710" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">Baseline</text>
  <text x="698" y="78" font-family="ui-monospace, monospace" font-size="10" fill="#555">.emery/specs/</text>
</svg>
