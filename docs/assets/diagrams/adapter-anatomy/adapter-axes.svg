<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Source adapters survey and extract; target adapters shape build and merge">
  <title>Source and target adapter axes</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <text x="40" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">SOURCE ADAPTERS (input)</text>
  <text x="480" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">TARGET ADAPTERS (output)</text>
  <rect x="40" y="44" width="380" height="56" rx="8" fill="#ede9d0" stroke="#c9b766"/>
  <text x="52" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">survey</text>
  <text x="52" y="86" font-family="ui-monospace, monospace" font-size="11" fill="#555">/spec:plan &#8594; discovery.md leads</text>
  <path d="M230 100 L230 120" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="40" y="120" width="380" height="56" rx="8" fill="#ede9d0" stroke="#c9b766"/>
  <text x="52" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">extract</text>
  <text x="52" y="162" font-family="ui-monospace, monospace" font-size="11" fill="#555">/spec:refine &#8594; evidence/*.yaml</text>
  <path d="M420 148 L460 148" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="460" y="100" width="400" height="72" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="472" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">core synthesis</text>
  <text x="472" y="142" font-family="ui-monospace, monospace" font-size="11" fill="#555">proposal &#8594; spec &#8594; design &#8594; tasks</text>
  <text x="472" y="158" font-family="ui-monospace, monospace" font-size="11" fill="#555">reads target shape brief</text>
  <path d="M660 172 L660 192" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="480" y="192" width="120" height="48" rx="8" fill="#e6d9f0" stroke="#a489d8"/>
  <text x="492" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">shape</text>
  <rect x="610" y="192" width="120" height="48" rx="8" fill="#e6d9f0" stroke="#a489d8"/>
  <text x="622" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">build</text>
  <rect x="740" y="192" width="120" height="48" rx="8" fill="#e6d9f0" stroke="#a489d8"/>
  <text x="752" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">merge</text>
  <text x="480" y="268" font-family="ui-monospace, monospace" font-size="11" fill="#555">specify:&lt;name&gt;@&lt;semver&gt; (source component)</text>
  <text x="480" y="286" font-family="ui-monospace, monospace" font-size="11" fill="#555">specify:&lt;name&gt;@&lt;semver&gt; (target component)</text>
  <text x="40" y="268" font-family="ui-monospace, monospace" font-size="11" fill="#555">&lt;store-root&gt;/&lt;name&gt;@&lt;version&gt;.wasm (global store)</text>
  <text x="40" y="286" font-family="ui-monospace, monospace" font-size="11" fill="#555">&lt;project-cache&gt;/components/&lt;name&gt;.wasm (out-of-tree)</text>
</svg>
