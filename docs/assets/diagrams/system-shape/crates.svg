<svg viewBox="0 0 920 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crate stack from the emery binary down through transport, change and slice, project, and the leaf crates; adapters live in a sibling repository">
  <title>How the code is stacked</title>
  <defs>
    <marker id="cr-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="40" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">HOW THE CODE IS STACKED</text>
  <text x="40" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#888">Higher crates invoke lower crates. Adapters are not in this workspace.</text>

  <rect x="40" y="60" width="840" height="52" rx="8" fill="#e6d9f0" stroke="#a489d8"/>
  <text x="56" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">emery binary</text>
  <text x="56" y="100" font-family="ui-monospace, monospace" font-size="11" fill="#555">one omnia::runtime! &#183; embedded engine &#183; guest &#183; native &#183; launcher</text>
  <path d="M460 112 L460 128" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#cr-arr)"/>

  <rect x="40" y="128" width="840" height="52" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="56" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">transport</text>
  <text x="56" y="168" font-family="ui-monospace, monospace" font-size="11" fill="#555">typed CLI and HTTP routers &#183; clap grammar &#183; exit contract</text>
  <path d="M460 180 L460 196" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#cr-arr)"/>

  <rect x="40" y="196" width="408" height="52" rx="8" fill="#f2f1ec" stroke="#c9c6bc"/>
  <text x="56" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">change</text>
  <text x="56" y="236" font-family="ui-monospace, monospace" font-size="11" fill="#555">plan author &#183; refine drain &#183; execute</text>
  <rect x="472" y="196" width="408" height="52" rx="8" fill="#f2f1ec" stroke="#c9c6bc"/>
  <text x="488" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">slice</text>
  <text x="488" y="236" font-family="ui-monospace, monospace" font-size="11" fill="#555">extract &#183; synthesize &#183; build &#183; merge</text>
  <path d="M460 248 L460 264" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#cr-arr)"/>

  <rect x="40" y="264" width="840" height="52" rx="8" fill="#f2f1ec" stroke="#c9c6bc"/>
  <text x="56" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">project</text>
  <text x="56" y="304" font-family="ui-monospace, monospace" font-size="11" fill="#555">plan model &#183; journal &#183; workspaces &#183; adapter resolver &#183; init</text>
  <path d="M460 316 L460 332" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#cr-arr)"/>

  <rect x="40" y="332" width="840" height="52" rx="8" fill="#ede9d0" stroke="#c9b766"/>
  <text x="56" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">leaves</text>
  <text x="56" y="372" font-family="ui-monospace, monospace" font-size="11" fill="#555">artifacts &#183; adapter SDK &#183; diagnostics &#183; error</text>
  <text x="40" y="394" font-family="ui-monospace, monospace" font-size="11" fill="#888">source and target adapters ship in augentic/emery-adapters, not this workspace</text>
</svg>
