<svg viewBox="0 0 920 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan surveys sources into a topology; refine extracts evidence and synthesizes specs; execute builds in a private workspace and merges under engine-owned gates">
  <title>What flows through a change</title>
  <defs>
    <marker id="flow-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="40" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">WHAT FLOWS THROUGH A CHANGE</text>
  <text x="40" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#888">Engine owns order, budgets, and gates. Adapters own specialist operations.</text>

  <text x="246" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">SOURCE</text>
  <text x="506" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">ENGINE</text>
  <text x="766" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">TARGET</text>

  <text x="28" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">PLAN</text>
  <rect x="128" y="84" width="236" height="80" rx="8" fill="#ede9d0" stroke="#c9b766"/>
  <text x="246" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">survey</text>
  <text x="246" y="136" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">leads into discovery.md</text>
  <path d="M364 124 L388 124" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#flow-arr)"/>
  <rect x="388" y="84" width="236" height="80" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="506" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">reconcile</text>
  <text x="506" y="136" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">plan.yaml &#183; review</text>
  <rect x="648" y="84" width="236" height="80" rx="8" fill="#f2f1ec" stroke="#c9c6bc" stroke-dasharray="5 4"/>
  <text x="766" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#888">not this stage</text>

  <text x="28" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">REFINE</text>
  <rect x="128" y="184" width="236" height="80" rx="8" fill="#ede9d0" stroke="#c9b766"/>
  <text x="246" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">extract</text>
  <text x="246" y="236" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">evidence/&lt;source&gt;.yaml</text>
  <path d="M364 224 L388 224" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#flow-arr)"/>
  <rect x="388" y="184" width="236" height="80" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="506" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">synthesize</text>
  <text x="506" y="236" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">spec.md &#183; model.yaml</text>
  <path d="M648 224 L624 224" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#flow-arr)"/>
  <rect x="648" y="184" width="236" height="80" rx="8" fill="#e6d9f0" stroke="#a489d8"/>
  <text x="766" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">guidance</text>
  <text x="766" y="236" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">idiom brief for synthesis</text>

  <text x="20" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#888" letter-spacing="0.06em">EXECUTE</text>
  <rect x="128" y="284" width="236" height="96" rx="8" fill="#f2f1ec" stroke="#c9c6bc" stroke-dasharray="5 4"/>
  <text x="246" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#888">not this stage</text>
  <rect x="388" y="284" width="236" height="96" rx="8" fill="#d9e7f1" stroke="#6ea8d8"/>
  <text x="506" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">workspace &#183; gates</text>
  <text x="506" y="336" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">private tree &#183; facts</text>
  <text x="506" y="354" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">budgets &#183; archive</text>
  <path d="M624 332 L648 332" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#flow-arr)"/>
  <rect x="648" y="284" width="236" height="96" rx="8" fill="#e6d9f0" stroke="#a489d8"/>
  <text x="766" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">build loop &#183; merge</text>
  <text x="766" y="336" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">build &#8594; verify &#8644; repair</text>
  <text x="766" y="354" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555">review &#8644; repair &#183; merge</text>

  <text x="128" y="408" font-family="ui-monospace, monospace" font-size="11" fill="#888">plan refine drains the middle row; plan execute drives the bottom row. Two review pauses sit between the rows.</text>
</svg>
