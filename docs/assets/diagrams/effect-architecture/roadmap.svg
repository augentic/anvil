<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Staged path S0 through S4 toward the effect-oriented harness, each stage mapped to an RFC, with a coherent stopping point after S3">
  <title>Staged path to the effect-oriented harness</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="40" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1c1c">Staged path to the effect-oriented harness</text>
  <text x="40" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#888">Each stage is independently valuable and forward-compatible on one typed contract.</text>

  <!-- S0 -->
  <rect x="40" y="72" width="168" height="150" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="56" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1c1c">S0 &#183; Typed records</text>
  <text x="56" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">kill schema drift;</text>
  <text x="56" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">typed envelopes both</text>
  <text x="56" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">axes</text>
  <text x="56" y="210" font-family="ui-monospace, monospace" font-size="10.5" fill="#9a8a3a">RFC-51</text>

  <!-- S1 -->
  <rect x="218" y="72" width="168" height="150" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="234" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1c1c">S1 &#183; Typed exports</text>
  <text x="234" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">tool ops callable</text>
  <text x="234" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">via generated</text>
  <text x="234" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">bindings</text>
  <text x="234" y="210" font-family="ui-monospace, monospace" font-size="10.5" fill="#9a8a3a">RFC-51</text>

  <!-- S2 -->
  <rect x="396" y="72" width="168" height="150" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="412" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1c1c">S2 &#183; Name effects</text>
  <text x="412" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">infer/data/refs/</text>
  <text x="412" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">lifecycle as WIT</text>
  <text x="412" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">imports; unlock replay</text>
  <text x="412" y="210" font-family="ui-monospace, monospace" font-size="10.5" fill="#3f7bab">RFC-52</text>

  <!-- S3 -->
  <rect x="574" y="72" width="168" height="150" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="590" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1c1c">S3 &#183; Orchestration</text>
  <text x="590" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">adapters orchestrate</text>
  <text x="590" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">(B &#8594; A); infer effect</text>
  <text x="590" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">calls the brief</text>
  <text x="590" y="210" font-family="ui-monospace, monospace" font-size="10.5" fill="#7a5aa6">RFC-53</text>

  <!-- S4 -->
  <rect x="752" y="72" width="168" height="150" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="768" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1c1c">S4 &#183; Workflow</text>
  <text x="768" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">harness = thin</text>
  <text x="768" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">interpreter</text>
  <text x="768" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#3c7a52">(deferred / optional)</text>
  <text x="768" y="210" font-family="ui-monospace, monospace" font-size="10.5" fill="#3c7a52">RFC-54</text>

  <!-- arrows -->
  <path d="M208 147 L216 147" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <path d="M386 147 L394 147" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <path d="M564 147 L572 147" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <path d="M742 147 L750 147" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- coherent stop -->
  <line x1="747" y1="64" x2="747" y2="232" stroke="#3c7a52" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="747" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#3c7a52">coherent stop</text>

  <!-- foundation -->
  <rect x="40" y="286" width="880" height="44" rx="10" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1.5"/>
  <text x="480" y="313" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">Foundation: one typed WIT contract (stratum-1 records), run on Wasmtime (WASI p2) &#8212; the currency under every stage</text>
</svg>
