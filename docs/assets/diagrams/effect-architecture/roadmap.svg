<svg viewBox="0 0 980 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Staged path S0 through S4 toward Specify on Omnia, each stage mapped to an RFC and independently valuable on one typed contract: S0-S1 typed contract (RFC-51), S2 name the deterministic effects and stand up the ModelClient boundary (RFC-52), S3 guests orchestrate with deterministic tool dispatch (RFC-54), S4 the runtime move plus the working-tree backend (RFC-56, RFC-55) as the destination, with workflow and development as guests (RFC-57); the judgment spine — the native tool-use loop, the augentic:tools surface, verify and the ModelClient boundary (RFC-53) — threads through S2 and S3 with no eval effect, and the model fleet (RFC-58) is a parallel track needing only the ModelClient boundary; the foundation under every stage is one typed WIT contract run on Omnia">
  <title>Staged path to Specify on Omnia</title>
  <defs>
    <marker id="rm-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="40" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1c1c">Staged path to Specify on Omnia</text>
  <text x="40" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#888">Each stage is independently valuable and forward-compatible on one typed contract; judgment is native throughout.</text>

  <!-- S0-S1 -->
  <rect x="40" y="66" width="200" height="120" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="56" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">S0&#8211;S1 &#183; Typed contract</text>
  <text x="56" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">augentic:specify WIT package:</text>
  <text x="56" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">records &#183; per-axis interfaces</text>
  <text x="56" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">&#183; worlds &#8212; one source of truth</text>
  <text x="56" y="178" font-family="ui-monospace, monospace" font-size="10.5" fill="#9a8a3a">RFC-51</text>

  <!-- S2 -->
  <rect x="262" y="66" width="200" height="120" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="278" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">S2 &#183; Name the effects</text>
  <text x="278" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">deterministic effects as WIT:</text>
  <text x="278" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">fs &#183; references &#183; kv &#183; lifecycle</text>
  <text x="278" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">ModelClient boundary &#8594; replay</text>
  <text x="278" y="178" font-family="ui-monospace, monospace" font-size="10.5" fill="#3f7bab">RFC-52</text>

  <!-- S3 -->
  <rect x="484" y="66" width="200" height="120" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="500" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">S3 &#183; Guests orchestrate</text>
  <text x="500" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">tool ops callable via bindings;</text>
  <text x="500" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">judgment = native tool loop</text>
  <text x="500" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">over brief + references shelf</text>
  <text x="500" y="178" font-family="ui-monospace, monospace" font-size="10.5" fill="#7a5aa6">RFC-54</text>

  <!-- S4 (destination) -->
  <rect x="706" y="66" width="200" height="120" rx="10" fill="#dceede" stroke="#3c9a63" stroke-width="2"/>
  <text x="722" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">S4 &#183; Runtime move</text>
  <text x="722" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">generic Omnia binary retires</text>
  <text x="722" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">the bespoke host; real backends</text>
  <text x="722" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#3c7a52">+ working tree &#183; RFC-55</text>
  <text x="722" y="178" font-family="ui-monospace, monospace" font-size="10.5" fill="#2f7a4e">RFC-56</text>
  <text x="806" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#2f7a4e">destination</text>

  <!-- spine arrows -->
  <path d="M240 126 L260 126" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#rm-arr)"/>
  <path d="M462 126 L482 126" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#rm-arr)"/>
  <path d="M684 126 L704 126" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#rm-arr)"/>

  <!-- judgment spine band (threads S2-S3) -->
  <line x1="362" y1="186" x2="362" y2="206" stroke="#d8a06e" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="584" y1="186" x2="584" y2="206" stroke="#d8a06e" stroke-width="1.1" stroke-dasharray="3 3"/>
  <rect x="262" y="206" width="422" height="44" rx="9" fill="#f0e0d6" stroke="#d8a06e" stroke-width="1.5"/>
  <text x="278" y="224" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1c1c1c">Judgment spine &#183; native tool-use loop</text>
  <text x="278" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#a05a3c">augentic:tools &#183; verify &#183; ModelClient &#183; threads S2&#8211;S3 &#183; no eval effect</text>
  <text x="668" y="224" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5" fill="#a05a3c">RFC-53</text>

  <!-- S4 workflow-as-guests satellite -->
  <line x1="806" y1="186" x2="806" y2="206" stroke="#7bbf8f" stroke-width="1.1" stroke-dasharray="3 3"/>
  <rect x="706" y="206" width="200" height="44" rx="9" fill="#e8f2ea" stroke="#7bbf8f" stroke-width="1.3"/>
  <text x="722" y="224" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1c1c1c">S4 &#183; Workflow &amp; dev guests</text>
  <text x="722" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#3c7a52">compile vs model-driven &#183; RFC-57</text>

  <!-- parallel model fleet track -->
  <rect x="40" y="266" width="866" height="44" rx="9" fill="#f7eee6" stroke="#d8a06e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="56" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1c1c1c">Parallel &#183; Model fleet <tspan font-weight="400" fill="#a05a3c">&#8212; router + ModelClient strategies: frontier (genai) &#183; spawned agent &#183; hosted SLM &#183; Replay (brings RFC-18)</tspan></text>
  <text x="56" y="301" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#a05a3c">parallel track &#8212; needs only the ModelClient boundary, independent of the runtime move</text>
  <text x="890" y="286" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5" fill="#a05a3c">RFC-58</text>

  <!-- foundation -->
  <rect x="40" y="326" width="866" height="44" rx="10" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1.5"/>
  <text x="473" y="353" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">Foundation: one typed WIT contract (augentic:specify), run on Omnia (Wasmtime &#183; WASI p2) &#8212; the currency under every stage</text>
</svg>
