<svg viewBox="0 0 960 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The shape of the system: the workflow, development, and adapter guests are peers on Omnia, a generic wasm runtime invoked as omnia guest.wasm with forwarded arguments; Omnia instantiates a fresh guest per call and satisfies a fixed vocabulary of deterministic effects, knowing nothing of adapters, workflow, or models. Judgment is native and beside the runtime in the same binary: a native orchestration layer runs the tool-use loop behind a ModelClient boundary, runs verify, and owns slice-to-revision resolution, change-set extraction, and forge push; it drives the model and the guests' typed tool surface. It reaches the model fleet — a frontier LLM, a local SLM, or a deterministic replay strategy — through the ModelClient, not through a runtime effect, so the model id never reaches Omnia (law 2)">
  <title>The shape of the system</title>
  <defs>
    <marker id="ss-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="ss-arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c08040"/>
    </marker>
  </defs>

  <text x="40" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.06em">THE SHAPE OF THE SYSTEM</text>
  <text x="40" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#888">A generic runtime, the guests that run on it, and a native judgment loop beside it. Handles cross, never corpora.</text>

  <!-- guests -->
  <text x="40" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="0.04em">GUESTS &#8212; the workflow, development, and every adapter; peers on the runtime</text>

  <rect x="40" y="80" width="200" height="70" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="140" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">workflow</text>
  <text x="140" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#7c6aa0">wasm guest</text>
  <text x="140" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">plan &#183; execute &#183; slice loop</text>

  <rect x="266" y="80" width="200" height="70" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="366" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">development</text>
  <text x="366" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#7c6aa0">wasm guest</text>
  <text x="366" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">authoring &#183; standards &#183; lint</text>

  <rect x="492" y="80" width="200" height="70" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="592" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">typescript</text>
  <text x="592" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#9a8a3a">source guest</text>
  <text x="592" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">survey &#183; extract</text>

  <rect x="718" y="80" width="200" height="70" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="818" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">omnia</text>
  <text x="818" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#9a8a3a">target guest</text>
  <text x="818" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">shape &#183; build &#183; merge</text>

  <!-- guests <-> omnia arrows -->
  <path d="M140 178 L140 152" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <path d="M366 178 L366 152" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <path d="M592 178 L592 152" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <path d="M818 178 L818 152" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <text x="479" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#7a7a7a">Omnia instantiates guests &amp; calls their exports &#8593;   &#183;   guests call deterministic effects &#8595;</text>

  <!-- the specify binary container -->
  <rect x="32" y="180" width="894" height="178" rx="14" fill="none" stroke="#cbb89a" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="914" y="196" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#a89070">the Specify binary &#8212; Omnia + native orchestration</text>

  <!-- runtime -->
  <rect x="44" y="204" width="872" height="74" rx="12" fill="#eef4f9" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="60" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1c1c">Omnia<tspan font-size="12" font-weight="400" fill="#3f6f93">  &#183;  wasm runtime &#183; the foundation</tspan></text>
  <text x="60" y="251" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#555">generic Wasmtime-based runtime &#183; knows deterministic effects, not adapters / workflow / models</text>
  <text x="60" y="270" font-family="ui-monospace, monospace" font-size="10.5" fill="#555">omnia &lt;guest&gt;.wasm &lt;args&#8230;&gt;   &#183;   fresh instance per call   &#183;   satisfies a fixed effect vocabulary</text>

  <!-- native orchestration -->
  <rect x="44" y="284" width="872" height="66" rx="12" fill="#f0e0d6" stroke="#d8a06e" stroke-width="1.6"/>
  <text x="60" y="306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1c1c">Native orchestration<tspan font-size="10.5" font-weight="400" fill="#a05a3c">  &#183;  beside the runtime, same binary &#8212; judgment is NOT a runtime effect (law 2)</tspan></text>
  <text x="60" y="325" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#555">the tool-use loop &#183; ModelClient boundary &#183; verify &#8212; drives the model + the guests&#8217; typed tool surface</text>
  <text x="60" y="343" font-family="ui-monospace, monospace" font-size="10" fill="#555">slice &#8594; revision &#183; change-set extraction &#183; forge push</text>

  <!-- native orchestration -> model fleet -->
  <path d="M479 350 L479 392" stroke="#c08040" stroke-width="1.5" fill="none" marker-end="url(#ss-arrO)"/>
  <text x="489" y="374" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">ModelClient (native) &#8212; not a runtime effect</text>

  <!-- model fleet -->
  <text x="40" y="388" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="0.04em">MODEL FLEET &#8212; reached by the native ModelClient, routed per call by difficulty &amp; cost</text>

  <rect x="40" y="396" width="280" height="62" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="180" y="421" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">frontier LLM</text>
  <text x="180" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3c7a52">hosted API or spawned agent &#183; hard synthesis &amp; review</text>

  <rect x="344" y="396" width="280" height="62" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="484" y="421" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">local SLM</text>
  <text x="484" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3c7a52">OpenAI-compatible &#183; cheap high-volume transforms</text>

  <rect x="648" y="396" width="270" height="62" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="783" y="421" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">Replay</text>
  <text x="783" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3c7a52">deterministic &#183; CI &amp; evals</text>

  <text x="40" y="480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#3c7a52">Bind the Replay strategy &#8594; the whole run replays. The same binary &amp; guests run desktop &#8594; cloud; only the deterministic backends swap.</text>
</svg>
