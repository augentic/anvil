<svg viewBox="0 0 960 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The shape of the system: workflow, development, and adapter guests run on Omnia, a generic wasm runtime invoked as omnia guest.wasm with forwarded arguments; Omnia instantiates a fresh guest per call, satisfies a fixed effect vocabulary, and dispatches the infer effect down to a pluggable model fleet of a frontier LLM, a local SLM, or a deterministic replay stub">
  <title>The shape of the system</title>
  <defs>
    <marker id="ss-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="ss-arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c08040"/>
    </marker>
  </defs>

  <text x="40" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.06em">THE SHAPE OF THE SYSTEM</text>
  <text x="40" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#888">Two roles over one contract &#8212; a generic runtime, and the guests that run on it. Handles cross, never corpora.</text>

  <!-- guests -->
  <text x="40" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="0.04em">GUESTS &#8212; the workflow, development, and every adapter; peers on the runtime</text>

  <rect x="40" y="82" width="200" height="72" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="140" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">workflow</text>
  <text x="140" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#7c6aa0">wasm guest</text>
  <text x="140" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">plan &#183; execute &#183; slice loop</text>

  <rect x="266" y="82" width="200" height="72" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="366" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">development</text>
  <text x="366" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#7c6aa0">wasm guest</text>
  <text x="366" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">authoring &#183; standards &#183; lint</text>

  <rect x="492" y="82" width="200" height="72" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="592" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">typescript</text>
  <text x="592" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#9a8a3a">source guest</text>
  <text x="592" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">survey &#183; extract</text>

  <rect x="718" y="82" width="200" height="72" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="818" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">omnia</text>
  <text x="818" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#9a8a3a">target guest</text>
  <text x="818" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">shape &#183; build &#183; merge</text>

  <!-- runtime -> guest arrows -->
  <path d="M140 204 L140 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <path d="M366 204 L366 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <path d="M592 204 L592 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <path d="M818 204 L818 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ss-arr)"/>
  <text x="479" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#7a7a7a">Omnia instantiates guests &amp; calls their exports &#8593;   &#183;   guests call effects &#8595;</text>

  <!-- runtime -->
  <rect x="40" y="206" width="878" height="92" rx="12" fill="#eef4f9" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="58" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1c1c1c">Omnia<tspan font-size="12" font-weight="400" fill="#3f6f93">  &#183;  wasm runtime &#183; the foundation</tspan></text>
  <text x="58" y="263" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#555">generic Wasmtime-based runtime &#183; knows effects, not adapters / workflow / brains</text>
  <text x="58" y="285" font-family="ui-monospace, monospace" font-size="10.5" fill="#555">omnia &lt;guest&gt;.wasm &lt;args&#8230;&gt;   &#183;   fresh instance per call   &#183;   satisfies a fixed effect vocabulary</text>

  <!-- runtime -> fleet arrows (infer) -->
  <path d="M175 300 L175 354" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#ss-arrO)"/>
  <path d="M479 300 L479 354" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#ss-arrO)"/>
  <path d="M783 300 L783 354" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#ss-arrO)"/>
  <text x="495" y="324" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">infer &#8595; &#183; dispatched to a pluggable backend</text>

  <!-- model fleet -->
  <text x="40" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="0.04em">MODEL FLEET &#8212; the infer backend, routed per call by difficulty &amp; cost</text>

  <rect x="40" y="356" width="270" height="68" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="175" y="382" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">LLM</text>
  <text x="175" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#3c7a52">frontier &#183; hosted</text>
  <text x="175" y="416" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">hard synthesis &amp; review</text>

  <rect x="344" y="356" width="270" height="68" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="479" y="382" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">SLM</text>
  <text x="479" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#3c7a52">local &#183; OpenAI-compatible</text>
  <text x="479" y="416" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">cheap high-volume transforms</text>

  <rect x="648" y="356" width="270" height="68" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="783" y="382" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">deterministic</text>
  <text x="783" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-style="italic" fill="#3c7a52">record / replay stub</text>
  <text x="783" y="416" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#555">CI &amp; evals</text>

  <text x="40" y="450" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3c7a52">Deterministic modulo infer &#8594; mock the backend and the whole run replays.</text>
  <text x="40" y="468" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#999">the omnia target guest emits code for the Omnia runtime &#8212; same name, different layers.</text>
</svg>
