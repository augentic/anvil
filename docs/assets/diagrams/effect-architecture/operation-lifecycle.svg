<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lifecycle of one operation: the workflow calls down into an adapter, which orchestrates deterministic steps and calls up into the interpreter for the infer effect, which runs the brief on the LLM in the agent's context and returns a typed result">
  <title>Lifecycle of one operation</title>
  <defs>
    <marker id="ol-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="ol-arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c08040"/>
    </marker>
  </defs>

  <text x="40" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.06em">LIFECYCLE OF ONE OPERATION (a build)</text>

  <!-- lifelines -->
  <line x1="140" y1="96" x2="140" y2="432" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="378" y1="96" x2="378" y2="432" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="612" y1="96" x2="612" y2="432" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="842" y1="96" x2="842" y2="432" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- headers -->
  <rect x="65" y="48" width="150" height="48" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="140" y="69" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">Workflow</text>
  <text x="140" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">program (agent)</text>

  <rect x="303" y="48" width="150" height="48" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="378" y="69" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">Adapter</text>
  <text x="378" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">wasm component</text>

  <rect x="537" y="48" width="150" height="48" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="612" y="69" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">Interpreter</text>
  <text x="612" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">specify CLI &#183; Wasmtime</text>

  <rect x="777" y="48" width="130" height="48" rx="10" fill="#f0e0d6" stroke="#d8a06e" stroke-width="1.5"/>
  <text x="842" y="69" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">LLM</text>
  <text x="842" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">(oracle)</text>

  <!-- 1: workflow -> adapter -->
  <text x="259" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">1 &#183; build(build-request)</text>
  <path d="M140 126 L376 126" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#ol-arr)"/>

  <!-- 2: adapter deterministic step -->
  <text x="390" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#7a7a7a">2 &#183; deterministic step (code)</text>

  <!-- 3: adapter -> interpreter (infer) -->
  <text x="495" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">3 &#183; infer(brief-ref, request)</text>
  <path d="M378 190 L610 190" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#ol-arrO)"/>

  <!-- 4: interpreter -> llm -->
  <text x="727" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">4 &#183; run brief in agent context</text>
  <path d="M612 220 L840 220" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#ol-arr)"/>

  <!-- 5: llm -> interpreter (return) -->
  <text x="727" y="244" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#555">5 &#183; output</text>
  <path d="M842 250 L614 250" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ol-arr)"/>

  <!-- 6: interpreter -> adapter (typed result) -->
  <text x="495" y="278" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">6 &#183; typed result &#8594; steers next step</text>
  <path d="M610 284 L380 284" stroke="#c08040" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ol-arrO)"/>

  <!-- 7: adapter loop note -->
  <text x="390" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#7a7a7a">7 &#183; validate &#183; loop &#183; maybe more infer / load-reference</text>

  <!-- 8: adapter -> workflow (report) -->
  <text x="259" y="346" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">8 &#183; build-report (typed)</text>
  <path d="M378 352 L142 352" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ol-arr)"/>

  <text x="40" y="452" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3c7a52">Calls go down into wasm; effects go up into the interpreter &#8212; so judgment runs where the agent already lives.</text>
  <text x="40" y="470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3c7a52">Every arrow carries a typed value or a handle &#8212; never a corpus.</text>
</svg>
