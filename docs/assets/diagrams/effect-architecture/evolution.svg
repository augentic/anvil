<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolution from today's three-layer agent-over-CLI stack to the north-star effect interpreter">
  <title>Today to north star</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrbig" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1c1c1c"/>
    </marker>
  </defs>

  <text x="40" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.08em">TODAY</text>
  <text x="540" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.08em">NORTH STAR</text>

  <!-- TODAY column -->
  <rect x="40" y="50" width="420" height="68" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="58" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">Agent / LLM &#8212; orchestrator</text>
  <text x="58" y="100" font-family="ui-monospace, monospace" font-size="11" fill="#555">runs /spec:* skill prose &#183; drives the loop</text>
  <path d="M250 118 L250 140" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="262" y="134" font-family="ui-monospace, monospace" font-size="10" fill="#888">shells out &#183; non-blocking</text>

  <rect x="40" y="140" width="420" height="68" rx="10" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1.5"/>
  <text x="58" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">specify CLI = wasmtime host</text>
  <text x="58" y="190" font-family="ui-monospace, monospace" font-size="11" fill="#555">deterministic &#183; LLM-free &#183; prepare/finalize handoff</text>
  <path d="M250 208 L250 230" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="230" width="420" height="68" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="58" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">Adapter &#8212; wasm + prose</text>
  <text x="58" y="280" font-family="ui-monospace, monospace" font-size="11" fill="#555">tool ops called; agent ops hand the brief back up</text>

  <text x="40" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#a05a3c">Orchestration lives in prose.</text>
  <text x="40" y="356" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#a05a3c">Boundaries are argv + JSON, largely untyped.</text>

  <!-- evolve arrow -->
  <path d="M468 188 L512 188" stroke="#1c1c1c" stroke-width="2" fill="none" marker-end="url(#arrbig)"/>
  <text x="470" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#1c1c1c">evolve</text>

  <!-- NORTH STAR column -->
  <rect x="540" y="50" width="420" height="68" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="558" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">Harness = effect interpreter &#183; Rust + Wasmtime</text>
  <text x="558" y="100" font-family="ui-monospace, monospace" font-size="11" fill="#555">instantiates orchestration components &#183; handles effects</text>

  <!-- effect pills -->
  <rect x="540" y="140" width="100" height="40" rx="8" fill="#f0e0d6" stroke="#d8a06e"/>
  <text x="590" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1c1c1c">infer</text>
  <rect x="646" y="140" width="100" height="40" rx="8" fill="#dceede" stroke="#7bbf8f"/>
  <text x="696" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1c1c1c">data</text>
  <rect x="752" y="140" width="100" height="40" rx="8" fill="#dceede" stroke="#7bbf8f"/>
  <text x="802" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1c1c1c">refs</text>
  <rect x="858" y="140" width="102" height="40" rx="8" fill="#f2f1ec" stroke="#c9c6bc"/>
  <text x="909" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1c1c1c">lifecycle</text>
  <text x="540" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888">a small, fixed vocabulary of typed effects (WIT imports)</text>

  <path d="M750 206 L750 228" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <rect x="540" y="228" width="420" height="64" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="558" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">Orchestration components (wasm)</text>
  <text x="558" y="276" font-family="ui-monospace, monospace" font-size="11" fill="#555">typed control flow &#183; call effects &#183; return typed steps</text>
  <path d="M750 292 L750 312" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <rect x="540" y="312" width="420" height="56" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="558" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1c">Adapter &#8212; wasm exports + prose (infer bodies)</text>

  <text x="540" y="400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#3c7a52">Structure = code &#183; judgment = the infer effect.</text>
  <text x="540" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#3c7a52">Typed boundaries &#183; handles, never corpora &#183; record/replay.</text>
</svg>
