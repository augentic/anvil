<svg viewBox="0 0 960 462" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The model fleet and deployment modes: the native tool-use loop routes each self-contained run through the ModelClient boundary by difficulty and cost to a ModelClient strategy — a frontier LLM (genai API or spawned agent), a hosted or local SLM, or the deterministic Replay strategy; three deployment modes decide which strategy binds — interactive editor runs bind a frontier API or spawned agent, headless fleet runs bind a hosted API or local SLM, and CI binds the Replay strategy that serves recorded brief-plus-transcript answers; the same native binary runs desktop to cloud, the model id never reaches Omnia core (law 2), and a pure-wasi host uses the optional Mode-B tool-server guest">
  <title>The model fleet and deployment modes</title>
  <defs>
    <marker id="mf-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="mf-arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c08040"/>
    </marker>
  </defs>

  <text x="40" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.06em">THE MODEL FLEET &amp; DEPLOYMENT MODES</text>

  <!-- native tool-use loop pill -->
  <rect x="40" y="100" width="138" height="56" rx="9" fill="#f0e0d6" stroke="#d8a06e" stroke-width="1.5"/>
  <text x="109" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">native</text>
  <text x="109" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">tool-use loop</text>
  <text x="109" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#a05a3c">drives the model</text>
  <path d="M178 128 L222 128" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#mf-arrO)"/>

  <!-- ModelClient boundary / router -->
  <rect x="226" y="92" width="248" height="76" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="242" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1c">ModelClient boundary</text>
  <text x="242" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">routes each self-contained run</text>
  <text x="242" y="149" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">by difficulty &amp; cost &#183; no shared convo</text>
  <text x="242" y="163" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-style="italic" fill="#3f7bab">where the model id &amp; record/replay live</text>

  <!-- router -> strategies -->
  <path d="M474 130 L516 93" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#mf-arr)"/>
  <path d="M474 130 L516 141" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#mf-arr)"/>
  <path d="M474 130 L516 189" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#mf-arr)"/>

  <text x="520" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#888" letter-spacing="0.03em">ModelClient strategies &#8212; the swappable brain, chosen per call</text>

  <!-- strategies -->
  <rect x="520" y="73" width="400" height="40" rx="8" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="534" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">frontier LLM &#183; genai</text>
  <text x="534" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">hosted API or spawned agent session &#183; hard synthesis &amp; review</text>

  <rect x="520" y="123" width="400" height="40" rx="8" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="534" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">SLM &#183; hosted or local</text>
  <text x="534" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">Ollama / vLLM &#183; OpenAI-compatible &#183; constrained decoding</text>

  <rect x="520" y="173" width="400" height="40" rx="8" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="534" y="190" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">Replay &#183; deterministic</text>
  <text x="534" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">recorded (brief + tool transcript) &#8594; answer &#183; CI &amp; evals</text>

  <!-- divider -->
  <line x1="40" y1="250" x2="920" y2="250" stroke="#e2e2e2" stroke-width="1.2"/>
  <text x="40" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="0.04em">DEPLOYMENT MODES &#8212; which strategy binds; the same native binary runs desktop &#8594; cloud</text>

  <!-- interactive -->
  <rect x="40" y="284" width="280" height="126" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="56" y="310" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">Interactive</text>
  <text x="56" y="332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">editor-triggered</text>
  <text x="56" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">binds: frontier API or spawned agent</text>
  <text x="56" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">against concrete artifacts, not chat</text>
  <text x="56" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#3c7a52">complex synthesis &amp; review</text>

  <!-- headless -->
  <rect x="340" y="284" width="280" height="126" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="356" y="310" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">Headless</text>
  <text x="356" y="332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">fleet-scale &#183; narrow transforms</text>
  <text x="356" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">binds: hosted API or local SLM</text>
  <text x="356" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">no editor &#183; constrained decoding</text>
  <text x="356" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#3f7bab">valid typed reports</text>

  <!-- ci -->
  <rect x="640" y="284" width="280" height="126" rx="10" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="656" y="310" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">CI / Testing</text>
  <text x="656" y="332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">no model egress required</text>
  <text x="656" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">binds: the Replay ModelClient</text>
  <text x="656" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">recorded fixtures &#8594; deterministic</text>
  <text x="656" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#7a7a7a">AI evals become regression tests</text>

  <text x="40" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3c7a52">Each run is self-contained (one whole brief) &#8212; the strategy is a per-call choice behind the ModelClient boundary, and the model id never reaches Omnia core (law 2).</text>
  <text x="40" y="454" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#999">Progressive optimisation: migrate frontier &#8594; SLM &#8594; deterministic by changing the bound strategy. A pure-wasi host with no native binary uses the optional Mode-B tool-server guest (RFC-53).</text>
</svg>
