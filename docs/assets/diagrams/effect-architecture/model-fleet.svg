<svg viewBox="0 0 960 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The model fleet and deployment topologies: the eval effect reaches a single model service &#8212; one eval backend that fans out &#8212; routing each self-contained call by difficulty and cost to a frontier LLM, a local SLM, or a deterministic replay stub; three deployment topologies decide whether eval can reach a backend &#8212; headless or CI works anywhere, a spawned agent session is the interactive path and runs context-free, and the embedded live-editor session is deliberately not required because it would re-couple judgment to the editor transcript">
  <title>The model fleet and deployment topologies</title>
  <defs>
    <marker id="mf-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="mf-arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c08040"/>
    </marker>
  </defs>

  <text x="40" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.06em">THE MODEL FLEET &amp; DEPLOYMENT TOPOLOGIES</text>

  <!-- eval pill -->
  <rect x="40" y="110" width="110" height="44" rx="8" fill="#f0e0d6" stroke="#d8a06e" stroke-width="1.5"/>
  <text x="95" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1c1c1c">eval</text>
  <text x="95" y="147" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#a05a3c">(the effect)</text>
  <path d="M150 132 L196 132" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#mf-arrO)"/>

  <!-- router -->
  <rect x="200" y="96" width="232" height="72" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="216" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">model service</text>
  <text x="216" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">one eval backend &#183; fans out to a fleet</text>
  <text x="216" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">routes per call &#183; no shared conversation</text>

  <!-- router -> backends -->
  <path d="M432 132 L516 96" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#mf-arr)"/>
  <path d="M432 132 L516 146" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#mf-arr)"/>
  <path d="M432 132 L516 196" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#mf-arr)"/>

  <!-- backends -->
  <rect x="520" y="76" width="400" height="40" rx="8" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="534" y="93" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">LLM &#183; frontier, hosted</text>
  <text x="534" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">inference API or spawned agent session &#183; hard synthesis &amp; review</text>

  <rect x="520" y="126" width="400" height="40" rx="8" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="534" y="143" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">SLM &#183; local</text>
  <text x="534" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">Ollama / vLLM &#183; OpenAI-compatible &#183; constrained decoding</text>

  <rect x="520" y="176" width="400" height="40" rx="8" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="534" y="193" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1c">deterministic &#183; record / replay</text>
  <text x="534" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">zero-config &#183; CI &amp; evals</text>

  <!-- divider -->
  <line x1="40" y1="240" x2="920" y2="240" stroke="#e2e2e2" stroke-width="1.2"/>
  <text x="40" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="0.04em">DEPLOYMENT TOPOLOGIES &#8212; can eval reach a backend?</text>

  <!-- headless -->
  <rect x="40" y="274" width="280" height="124" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="56" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">Headless / CI</text>
  <text x="56" y="322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">Omnia is the top-level process</text>
  <text x="56" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">backend = API &#183; local SLM &#183; replay</text>
  <text x="56" y="378" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#3c7a52">&#10003; works anywhere</text>

  <!-- spawned -->
  <rect x="340" y="274" width="280" height="124" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="356" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">Spawned agent</text>
  <text x="356" y="322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">Omnia spawns a fresh agent</text>
  <text x="356" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">CLI / SDK session &#183; the interactive path</text>
  <text x="356" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">a separate convo, not the editor transcript</text>
  <text x="356" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#3f7bab">&#10003; works &#8212; context-independent</text>

  <!-- embedded -->
  <rect x="640" y="274" width="280" height="124" rx="10" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="656" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1c">Embedded</text>
  <text x="656" y="322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">Omnia runs inside an agent host</text>
  <text x="656" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">live editor session = eval backend</text>
  <text x="656" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">would re-couple to the editor transcript</text>
  <text x="656" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#7a7a7a">&#9675; optional &#8212; not required by design</text>

  <text x="40" y="428" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3c7a52">Each eval call is self-contained &#8212; so the model is a per-call choice inside one backend, and replay makes the whole run deterministic.</text>
</svg>
