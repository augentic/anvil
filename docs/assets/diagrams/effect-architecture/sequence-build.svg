<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logical sequence for a build: the operator invokes the build, which the binary's native orchestration runs. The native loop materializes the working tree and opens a session, runs any deterministic setup export on the target adapter, then hands the model the build brief plus a typed tool surface behind the ModelClient boundary. In a loop over the model's tool calls the model emits resolve, which the loop forwards to the target adapter's references for lazy bytes; read, list, and write, which the loop applies against the host-materialized working tree; and verify, which the loop runs as a vetted sandboxed profile, returning a severity-tiered report the model repairs against and re-verifies. The model returns a validated answer; the loop validates it against the typed report, commits, extracts a content-addressed change-set as a git diff against the base, requests the host-owned transition, and returns done. Judgment is native, not an adapter eval; handles cross, never corpora.">
  <title>Logical sequence: build</title>
  <defs>
    <marker id="sb-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="sb-arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c08040"/>
    </marker>
  </defs>

  <text x="20" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.05em">LOGICAL SEQUENCE &#183; BUILD (a target adapter)</text>

  <!-- participant headers -->
  <rect x="15" y="30" width="150" height="52" rx="9" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1.5"/>
  <text x="90" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1c">operator</text>
  <text x="90" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#7a7a7a">cli &#183; waits</text>

  <rect x="240" y="30" width="200" height="52" rx="9" fill="#f0e0d6" stroke="#d8a06e" stroke-width="1.5"/>
  <text x="340" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1c">native orchestration</text>
  <text x="340" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#a05a3c">the tool-use loop &#183; the binary</text>

  <rect x="540" y="30" width="160" height="52" rx="9" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="620" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1c">model</text>
  <text x="620" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-style="italic" fill="#3f7bab">via ModelClient</text>

  <rect x="790" y="30" width="180" height="52" rx="9" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="880" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1c">target adapter</text>
  <text x="880" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-style="italic" fill="#9a8a3a">guest &#183; references</text>

  <!-- lifelines -->
  <line x1="90" y1="82" x2="90" y2="556" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="340" y1="82" x2="340" y2="556" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="620" y1="82" x2="620" y2="556" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="880" y1="82" x2="880" y2="556" stroke="#d6d6d6" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- activation bars -->
  <rect x="85" y="98" width="10" height="442" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <rect x="335" y="108" width="10" height="426" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <rect x="615" y="214" width="10" height="262" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <rect x="875" y="176" width="10" height="20" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <rect x="875" y="290" width="10" height="28" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>

  <!-- m1 operator -> native orch -->
  <text x="214" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">build (execute)</text>
  <path d="M95 108 L333 108" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#sb-arr)"/>

  <!-- m2 native orch self: materialize tree -->
  <path d="M345 130 H392 V146 H347" stroke="#555" stroke-width="1.1" fill="none" marker-end="url(#sb-arr)"/>
  <text x="398" y="142" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#7a7a7a">materialize working tree (host) &#183; open session</text>

  <!-- m3 native orch -> adapter setup -->
  <text x="609" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">tool setup (deterministic export)</text>
  <path d="M345 182 L873 182" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#sb-arr)"/>
  <path d="M873 196 L347 196" stroke="#555" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#sb-arr)"/>

  <!-- m4 native orch -> model -->
  <text x="479" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">build brief + tool surface</text>
  <path d="M345 222 L613 222" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#sb-arrO)"/>

  <!-- loop fragment -->
  <rect x="304" y="240" width="666" height="208" rx="4" fill="none" stroke="#b0b0b0" stroke-width="1.2"/>
  <path d="M304 240 h232 v12 l-10 8 h-222 z" fill="#ededed" stroke="#b0b0b0" stroke-width="1"/>
  <text x="313" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#666">loop [the model&#8217;s tool calls &#8212; until the answer is ready]</text>

  <!-- m5 model -> loop resolve -->
  <text x="480" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">resolve(id)</text>
  <path d="M613 286 L347 286" stroke="#c08040" stroke-width="1.3" fill="none" marker-end="url(#sb-arrO)"/>
  <!-- m6 loop -> adapter resolve -->
  <text x="609" y="304" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">resolve &#183; references</text>
  <path d="M345 310 L873 310" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#sb-arr)"/>
  <!-- m7 adapter -> loop bytes -->
  <text x="640" y="338" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">bytes (lazy)</text>
  <path d="M873 326 L347 326" stroke="#555" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#sb-arr)"/>

  <!-- m8 model -> loop read/write -->
  <text x="476" y="362" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">read / list / write</text>
  <path d="M613 368 L347 368" stroke="#c08040" stroke-width="1.3" fill="none" marker-end="url(#sb-arrO)"/>
  <text x="634" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#7a7a7a">&#8594; the working tree (host-materialized)</text>

  <!-- m9 model -> loop verify -->
  <text x="478" y="396" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">verify(check)</text>
  <path d="M613 402 L347 402" stroke="#c08040" stroke-width="1.3" fill="none" marker-end="url(#sb-arrO)"/>
  <text x="634" y="402" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#7a7a7a">loop runs the vetted sandboxed profile</text>
  <!-- m10 loop -> model report -->
  <text x="478" y="424" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">report (severity-tiered)</text>
  <path d="M345 430 L613 430" stroke="#c08040" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#sb-arrO)"/>
  <text x="634" y="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#7a7a7a">repair the errors &amp; re-verify</text>

  <!-- m11 model -> loop answer -->
  <text x="480" y="466" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a05a3c">answer (validated)</text>
  <path d="M613 472 L347 472" stroke="#c08040" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#sb-arrO)"/>

  <!-- m12 native orch self: validate / commit / change-set -->
  <path d="M345 488 H372 V520 H347" stroke="#555" stroke-width="1.1" fill="none" marker-end="url(#sb-arr)"/>
  <text x="380" y="498" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#7a7a7a">validate vs typed report &#183; commit session</text>
  <text x="380" y="514" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#7a7a7a">change-set = git diff vs base &#183; transition (host-owned)</text>

  <!-- m13 native orch -> operator done -->
  <text x="214" y="538" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">done</text>
  <path d="M335 544 L97 544" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#sb-arr)"/>

  <!-- footnotes -->
  <text x="20" y="582" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3c7a52">Judgment is the native tool-use loop, not an adapter eval: the loop drives the model and dispatches its tool calls.</text>
  <text x="20" y="602" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#888">The adapter contributes the brief, the references, and deterministic exports. What crosses out: a typed report + a content-addressed change-set. Handles cross, never corpora.</text>
</svg>
