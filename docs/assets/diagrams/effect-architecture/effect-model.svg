<svg viewBox="0 0 960 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The effect model: a guest requests typed deterministic effects from Omnia, the interpreter, which performs host data reads, key-value memoization, and lifecycle journal/transition through its host services — it knows effects, not adapters and not models; judgment is held outside this effect system as a native tool-use loop that hands the model one whole brief plus a typed tool surface, drives the model behind the ModelClient boundary (frontier, SLM, or replay), and dispatches the model's tool calls — resolve to the adapter's references shelf served by a fresh guest instance, read/list/write to the working tree, and verify to sandboxed checks — running the verify-repair cycle and returning a validated typed answer">
  <title>The effect model</title>
  <defs>
    <marker id="em-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="em-arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c08040"/>
    </marker>
  </defs>

  <text x="40" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#888" letter-spacing="0.06em">THE EFFECT MODEL</text>

  <!-- zone A label -->
  <text x="40" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="0.04em">THE EFFECT SYSTEM</text>

  <!-- guest -->
  <rect x="36" y="64" width="252" height="122" rx="10" fill="#e6d9f0" stroke="#a489d8" stroke-width="1.5"/>
  <text x="52" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">Guest program (wasm)</text>
  <text x="52" y="116" font-family="ui-monospace, monospace" font-size="10.5" fill="#555">deterministic control flow</text>
  <text x="52" y="136" font-family="ui-monospace, monospace" font-size="10.5" fill="#555">calls effects &#8594; typed results</text>
  <text x="52" y="156" font-family="ui-monospace, monospace" font-size="10.5" fill="#555">back, steering the next step</text>

  <!-- boundary -->
  <line x1="320" y1="58" x2="320" y2="196" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="320" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#888">typed WIT boundary</text>

  <!-- request / result arrows -->
  <path d="M288 104 L356 104" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#em-arr)"/>
  <text x="318" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1c1c1c">effect request</text>
  <path d="M356 150 L288 150" stroke="#555" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#em-arr)"/>
  <text x="318" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1c1c1c">typed result</text>

  <!-- interpreter -->
  <rect x="360" y="64" width="564" height="122" rx="12" fill="#eef4f9" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="376" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1c1c">Effect interpreter &#183; Omnia (Wasmtime runtime) &#8212; deterministic effects only</text>

  <rect x="376" y="94" width="532" height="26" rx="7" fill="#dceede" stroke="#7bbf8f"/>
  <text x="390" y="111" font-family="ui-monospace, monospace" font-size="10.5" fill="#1c1c1c">read(id) &#8594; bytes &#183; host data (wasi:filesystem)</text>

  <rect x="376" y="124" width="532" height="26" rx="7" fill="#dceede" stroke="#7bbf8f"/>
  <text x="390" y="141" font-family="ui-monospace, monospace" font-size="10.5" fill="#1c1c1c">kv get/set &#8594; memoize expensive resources &#183; fs &#183; Redis &#183; NATS</text>

  <rect x="376" y="154" width="532" height="26" rx="7" fill="#f2f1ec" stroke="#c9c6bc"/>
  <text x="390" y="171" font-family="ui-monospace, monospace" font-size="10.5" fill="#1c1c1c">journal / transition &#8594; lifecycle (host-owned)</text>

  <text x="376" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">Omnia knows effects, not adapters and not models.</text>

  <!-- zone divider -->
  <line x1="36" y1="218" x2="924" y2="218" stroke="#e2e2e2" stroke-width="1.2"/>
  <text x="40" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a05a3c" letter-spacing="0.04em">JUDGMENT &#8212; native, held OUTSIDE the effect system (not an effect a guest requests)</text>

  <!-- native tool-use loop -->
  <rect x="36" y="250" width="268" height="146" rx="10" fill="#f0e0d6" stroke="#d8a06e" stroke-width="1.6"/>
  <text x="52" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">Native tool-use loop</text>
  <text x="52" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#a05a3c">the judgment mechanism</text>
  <text x="52" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">hands the model one whole brief</text>
  <text x="52" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">+ a typed tool surface</text>
  <text x="52" y="356" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">runs the verify-repair cycle</text>
  <text x="52" y="374" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">returns a validated, typed answer</text>

  <!-- model (ModelClient) -->
  <rect x="324" y="250" width="172" height="146" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="410" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1c">model</text>
  <text x="410" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">via ModelClient</text>
  <text x="410" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#555">frontier &#183; SLM &#183; replay</text>
  <text x="410" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#3f7bab">model id lives here</text>
  <text x="410" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#3f7bab">(law 2: never in Omnia)</text>

  <!-- loop <-> model -->
  <path d="M304 300 L322 300" stroke="#c08040" stroke-width="1.4" fill="none" marker-end="url(#em-arrO)"/>
  <text x="246" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#a05a3c">brief + tools</text>
  <path d="M322 340 L304 340" stroke="#c08040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#em-arrO)"/>
  <text x="232" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#a05a3c">tool calls / answer</text>

  <!-- tool surface -->
  <rect x="524" y="250" width="400" height="146" rx="10" fill="#dceede" stroke="#7bbf8f" stroke-width="1.5"/>
  <text x="540" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1c1c">tool surface &#183; augentic:tools</text>
  <text x="540" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-style="italic" fill="#3c7a52">the typed callbacks the model pulls &#8212; the loop dispatches each</text>
  <text x="540" y="314" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">resolve(id) &#8594; bytes <tspan fill="#3c7a52">&#183; references shelf (fresh instance)</tspan></text>
  <text x="540" y="338" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">read / list / write <tspan fill="#3c7a52">&#183; the working tree</tspan></text>
  <text x="540" y="362" font-family="ui-monospace, monospace" font-size="10" fill="#1c1c1c">verify(check) &#8594; report <tspan fill="#3c7a52">&#183; sandboxed checks</tspan></text>

  <!-- model -> tool surface (loop dispatches) -->
  <path d="M496 320 L522 320" stroke="#7bbf8f" stroke-width="1.4" fill="none" marker-end="url(#em-arr)"/>

  <text x="40" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3c7a52">Deterministic modulo the model: bind the Replay ModelClient &#8658; the whole run replays. resolve serves the adapter's reference shelf from a fresh, instance-per-call guest.</text>
</svg>
