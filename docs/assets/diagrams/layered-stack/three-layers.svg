<svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Specify three-layer stack from configuration through slice execution to change planning">
  <title>Three-layer stack</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="440" height="88" rx="10" fill="#d9e7f1" stroke="#6ea8d8" stroke-width="1.5"/>
  <text x="56" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#888">LAYER 2 &#8212; Planning + driving a change</text>
  <text x="56" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">/spec:plan &#8594; Gate 1 &#8594; plan execute &#8594; /spec:finalize</text>
  <text x="56" y="88" font-family="ui-monospace, monospace" font-size="11" fill="#555">plan.yaml &#8594; change.md &#8594; discovery.md</text>
  <path d="M260 108 L260 128" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="40" y="128" width="440" height="88" rx="10" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1.5"/>
  <text x="56" y="152" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#888">LAYER 1 &#8212; Executing one slice</text>
  <text x="56" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1c1c">/spec:refine &#8594; /spec:build &#8594; /spec:merge (+ /spec:drop)</text>
  <text x="56" y="196" font-family="ui-monospace, monospace" font-size="11" fill="#555">.specify/slices/&lt;name&gt;/</text>
  <path d="M260 216 L260 236" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="40" y="236" width="440" height="110" rx="10" fill="#ede9d0" stroke="#c9b766" stroke-width="1.5"/>
  <text x="56" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#888">LAYER 0 &#8212; Configuration + adapters</text>
  <text x="56" y="284" font-family="ui-monospace, monospace" font-size="11" fill="#555">project.yaml &#8594; adapters/sources/* &#8594; adapters/targets/*</text>
  <text x="56" y="304" font-family="ui-monospace, monospace" font-size="11" fill="#555">specify init &#8594; specify source/target resolve</text>
  <text x="56" y="324" font-family="ui-monospace, monospace" font-size="11" fill="#555">schemas/ &#8594; AGENTS.md Specify block</text>
  <text x="40" y="368" font-family="ui-monospace, monospace" font-size="11" fill="#888">Higher layers invoke lower layers; lower layers are unaware of what sits above.</text>
</svg>
