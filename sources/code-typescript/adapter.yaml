# yaml-language-server: $schema=https://github.com/augentic/specify-cli/raw/main/schemas/source.schema.json
name: code-typescript
version: 1
axis: source
operations: [enumerate, extract]
briefs:
  enumerate: briefs/enumerate.md
  extract: briefs/extract.md
description: >-
  TypeScript / JavaScript legacy-code source adapter. Walks a read-only source
  tree under `$SOURCE_DIR`, enumerates framework-rooted call sites (Express,
  Fastify, NestJS, BullMQ, Next.js, node-cron, plain `ws`, yargs/commander,
  `fetch` / `axios` / typed SDK call-outs) as slice-sized candidates, and
  extracts behavioural Evidence as `excerpt`, `type`, and `call` claims.
  Authority emitted is `behaviour`; enumeration grammar is adapter-internal
  (no `surfaces.json` sibling artifact).
