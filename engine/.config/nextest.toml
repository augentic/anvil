# Nextest behavior for the workspace.

[profile.default]
# Bound total fan-out so the subprocess-heavy integration suites (each
# forks a `specify` child per case, ~2x process amplification) cannot
# oversubscribe CPU / file descriptors on macOS. A flat `4` keeps local
# runs safe regardless of core count (the suite now lives in-tree, so an
# unbounded `cargo make ci` would otherwise choke macOS); override ad hoc
# with `--test-threads N`. CI opts into full parallelism via the `ci`
# profile below.
test-threads = 4
# Flag hangs instead of letting a test sit forever. The period is
# generous because a cold-cache WASI component compile is legitimate
# work; four periods without progress terminates the test.
slow-timeout = { period = "60s", terminate-after = 4 }
# Tests are deterministic; a flake is a bug, never retry it away.
retries = 0

# Serialize the integration tests that JIT-compile the vectis WASI
# component. The wasmtime disk cache only dedupes *completed* compiles,
# so running these concurrently would make every first-wave test pay
# the full Cranelift compile instead of exactly one.
[test-groups]
wasm-compile = { max-threads = 1 }
# Cap the subprocess-heavy integration binaries so the `specify` child
# processes they spawn cannot starve the rest of the run. `max-threads`
# accepts a positive integer or "num-cpus" only (no percentage string).
host-subprocess = { max-threads = 4 }

# Integration tests now compile to one `it` binary per crate, so the overrides
# select by module-qualified test path instead of per-area binary names. Only
# the root `specify::it` binary forks `specify` children and JIT-compiles the
# vectis WASI component; the crate-level `it` binaries (workflow/standards/schema)
# are in-process, so `binary_id(specify::it)` pins the groups to the one binary
# that needs them. First matching override wins: the vectis-compiling cases stay
# pinned to the single-threaded wasm-compile group even though they also match
# the host-subprocess override below.
[[profile.default.overrides]]
filter = 'binary_id(specify::it) and (test(catalog_infer::) or test(plan::end_to_end) or test(schema_vectis))'
test-group = 'wasm-compile'

[[profile.default.overrides]]
filter = 'binary_id(specify::it) and (test(plan::) or test(slice::) or test(source::) or test(init::) or test(registry::) or test(journal::) or test(workspace::) or test(rules::) or test(lint::) or test(e2e::) or test(bootstrap::) or test(extension::))'
test-group = 'host-subprocess'

[profile.ci]
# CI runs on Linux, where subprocess fan-out is cheap, so use every core.
# The default profile's test-group caps (wasm-compile = 1, host-subprocess
# = 4) and its overrides still apply here via nextest's override-resolution
# fallback to `profile.default.overrides`, so wasm serialization is kept.
test-threads = "num-cpus"
failure-output = "immediate-final"
fail-fast = false
