[package]
name = "specify-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Specify workflow crate: slice, change, adapter, registry, config, merge, init lifecycle authority"
categories = ["development-tools"]
keywords = ["specify", "workflow", "lifecycle"]
readme = "../../README.md"
# Integration tests compile to the single `it` binary (one binary per crate);
# the per-area hubs are pulled in via tests/it.rs `#[path]` includes.
autotests = false

[lints]
workspace = true

[dependencies]
glob.workspace = true
jiff.workspace = true
jsonschema.workspace = true
petgraph.workspace = true
regex.workspace = true
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
specify-diagnostics.workspace = true
specify-error.workspace = true
specify-model.workspace = true
specify-schema.workspace = true
specify-extension.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
proptest = { workspace = true }
regex.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
