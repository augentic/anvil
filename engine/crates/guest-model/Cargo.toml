[package]
name = "specify-guest-model"
description = "Local Model capability trait for the Specify workflow guest: WASI-backed on wasm32, mockable off it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Stand-in for the upstream `omnia-guest::capabilities` Model trait
# (RFC-61); deleted when that lands (an import change plus a
# request-construction change at each call site — `lend_workspace` will
# not map 1:1 onto the upstream descriptor lend). Its wasm32 leg pins
# the unpublished omnia-wasi-model bindings, so the crate never
# publishes. Canonical source: specify-adapters crates/guest-kit.
publish = false

[dependencies]
thiserror.workspace = true

# The WASI-backed default body of `Model::create` compiles only for the
# wasm32 guest target, mirroring omnia-guest's capability traits.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-wasi-model.workspace = true
wasip3.workspace = true

[lints]
workspace = true
