# Snapshot of .specify/changes/checkout-api/.metadata.yaml after
# /spec:build stamps outcome: failure via `specify change phase-outcome
# checkout-api build failure --summary "..." --context "..."`. The
# driver reads `.outcome.outcome` (== failure) and enters the drop path
# (step 11):
#   1. run `/spec:drop checkout-api --reason "<outcome.summary>"`
#   2. run `specify initiative transition checkout-api failed --reason "<outcome.summary>"`
# The `--reason` argument is byte-identical to `outcome.summary` below;
# drift between this field and `plan.yaml.after:status-reason` is a
# regression. `outcome.context` is preserved on disk for human triage
# but is NOT copied into the plan entry.

