# Snapshot of `mobile`'s tier-2 workspace clone view of the
# user-api contract: `.specify/workspace/mobile/contracts/http/user-api.yaml`.
# This file is identical to `../../../../contracts/before/http/user-api.yaml`
# in the same fixture — the consumer workspace was last sync'd
# against the v1 baseline, so its view of the contract IS the
# baseline. The execute driver's cross-project check compares
# this file against the producer's just-merged v2 shape.

openapi: "3.1.0"
info:
  title: "User API"
  version: "1.0.0"
  description: "User registration and profile management."
paths:
  /users:
    post:
      operationId: create-user
      summary: "Register a new user."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                display-name:
                  type: string
              required:
                - email
                - password
      responses:
        "201":
          description: "User created."
          content:
            application/json:
              schema:
                $ref: "../schemas/user.yaml"
        "409":
          description: "Email already registered."
          content:
            application/json:
              schema:
                $ref: "../schemas/error-response.yaml"
  /users/{id}:
    get:
      operationId: get-user-by-id
      summary: "Fetch a user by id."
      responses:
        "200":
          description: "User found."
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  display-name:
                    type: string
                  created-at:
                    type: string
                    format: date-time
                required:
                  - id
                  - email
                  - display-name
                  - created-at
        "404":
          description: "User not found."
          content:
            application/json:
              schema:
                $ref: "../schemas/error-response.yaml"
