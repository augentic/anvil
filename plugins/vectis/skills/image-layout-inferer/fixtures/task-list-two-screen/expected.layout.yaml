# Fixture: two-screen task-list flow that exercises the v1 image inferer's
# core paths -- triage across screens, region / container / leaf recovery,
# state replacements, overlays without `trigger`, and the `component: <slug>`
# emission rule from the shared contract: when the same skeleton appears in
# >=2 screens of a single run the directive is committed; here `task-row`
# appears in both `task-list` and `archive` so the directive is emitted on
# both occurrences.
#
# Sibling manifests in this fixture directory back every named reference
# emitted below: `tokens.yaml` defines every `gap` / `padding` / `color`
# token (the contract bars inferers from inventing token names) and
# `assets.yaml` defines every `icon-button` / `icon` / `image` / `fab`
# asset id. The fixture therefore demonstrates the resolved-name path of
# the contract; a future fixture can demonstrate the raw-value-plus-TODO
# path that applies when no manifests are present.
#
# Fixtures are operator-runnable references; v1 does not enforce them in
# `make checks` (RFC-11 §C). The expected YAML below MUST validate cleanly
# under `specify vectis validate layout` (unwired-subset rules) and SHOULD
# additionally validate cleanly under `specify vectis validate composition`
# against the sibling manifests (cross-artifact reference resolution). It
# reuses the unwired subset only -- no `maps_to`, `bind`, `event`, `error`,
# overlay `trigger`, navigation events, or `*-when` keys.

version: 1

provenance:
  sources:
    - kind: screenshots
      captured_at: "2026-05-06T07:55:00Z"

screens:
  task-list:
    name: Task list
    description: Today's open tasks for the signed-in user.
    header:
      title: Today
      trailing:
        - icon-button:
            icon: settings
            label: Open settings
    body:
      list:
        each: tasks
        style: plain
        item:
          - group:
              component: task-row
              direction: row
              gap: md
              padding: md
              align: center
              items:
                - checkbox:
                    label: Mark task complete
                - group:
                    direction: column
                    gap: xs
                    size:
                      width: fill
                    items:
                      - text:
                          role: heading
                          style: body
                      - text:
                          style: caption
                          color: on-surface-variant
                - icon:
                    name: chevron-right
                    color: on-surface-variant
    fab:
      icon: plus
      label: Add task
    states:
      empty:
        when: tasks.is_empty
        replaces: body
        body:
          - group:
              direction: column
              gap: md
              padding: lg
              align: center
              justify: center
              items:
                - image:
                    name: empty-tasks-hero
                - text:
                    content: No tasks yet
                    style: title
                - text:
                    content: Tap the + button to add your first task.
                    style: body
                    color: on-surface-variant
    overlays:
      delete-confirm:
        kind: dialog
        title: Delete task?
        content:
          - text:
              content: This task will be removed permanently.
          - group:
              direction: row
              gap: sm
              justify: end
              items:
                - button:
                    label: Cancel
                    style: text
                - button:
                    label: Delete
                    style: text
                    color: error

  archive:
    name: Archive
    description: Completed tasks the user has archived.
    header:
      title: Archive
      leading:
        - icon-button:
            icon: chevron-left
            label: Back
    body:
      list:
        each: tasks
        style: plain
        item:
          - group:
              component: task-row
              direction: row
              gap: md
              padding: md
              align: center
              items:
                - checkbox:
                    label: Restore task
                - group:
                    direction: column
                    gap: xs
                    size:
                      width: fill
                    items:
                      - text:
                          role: heading
                          style: body
                      - text:
                          style: caption
                          color: on-surface-variant
                - icon:
                    name: chevron-right
                    color: on-surface-variant
    states:
      empty:
        when: tasks.is_empty
        replaces: body
        body:
          - group:
              direction: column
              gap: md
              padding: lg
              align: center
              justify: center
              items:
                - text:
                    content: Nothing archived yet
                    style: title
                - text:
                    content: Completed tasks will appear here.
                    style: body
                    color: on-surface-variant
