# Snapshot of .specify/slices/notification-preferences/.metadata.yaml
# after /spec:define stamps outcome: deferred via `specify change
# phase-outcome notification-preferences define deferred --summary "..."
# --context "..."`. The driver reads `.outcome.outcome` (== deferred)
# and enters the defer path (step 12):
#   1. run `/spec:drop notification-preferences --reason "<outcome.summary>"`
#   2. run `specify plan transition notification-preferences blocked
#          --reason "<outcome.summary>"`
# The `--reason` argument is byte-identical to `outcome.summary` below;
# drift between this field and `plan.yaml.after:status-reason` is a
# regression. `outcome.context` is preserved on disk for human triage
# but is NOT copied into the plan entry.

