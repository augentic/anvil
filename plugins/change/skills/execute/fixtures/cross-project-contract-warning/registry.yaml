# Two-project registry exercising the RFC-9 §3B post-merge check.
# `backend` produces the user-api contract; `mobile` consumes it.
# When `update-user-api-v2` (a backend change) merges, the execute
# driver walks `backend.contracts.produces`, identifies `mobile` via
# `mobile.contracts.consumes`, and runs the cross-project validator.

version: 1
projects:
  - name: backend
    url: git@github.com:org/backend.git
    capability: omnia@v1
    description: >
      User registration, account management, and the authoritative
      implementation of the user-api HTTP contract.
    contracts:
      produces:
        - http/user-api.yaml
        - schemas/user.yaml
        - schemas/user-registration.yaml
        - schemas/error-response.yaml

  - name: mobile
    url: git@github.com:org/mobile.git
    capability: vectis@v1
    description: >
      iOS and Android mobile clients for the platform. Calls the
      user-api endpoints from the registration and profile screens.
    contracts:
      consumes:
        - http/user-api.yaml
        - schemas/user.yaml
        - schemas/user-registration.yaml
        - schemas/error-response.yaml
