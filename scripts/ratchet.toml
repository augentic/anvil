# Committed ratchet baseline (CONSTITUTION.md invariant 4; remediation
# Phase 2). Ceilings are non-blank line counts enforced by
# `tests/ratchet.rs`: growth past a ceiling is a red build, and raising
# a ceiling requires an ADR reference in the same PR (invariant 5).
# Shrinking a ceiling is free — ratchet down, never up.

# Per-tree non-blank `.rs` line ceilings over each `src/` tree
# (integration tests are uncapped). Every workspace crate must carry
# an entry; a deleted crate's entry is removed in the same change.
[rust]
"src" = 46
"crates/adapter" = 912
# Post-T10 (ADR-0009 §4): the fail-closed spec AST, evidence, and the
# atomic writer; the lenient v1 parsers fell at the spine cut.
"crates/artifacts" = 730
"crates/diagnostics" = 884
# New-spine crate (remediation Phase 3, ADR-0009 §6): the loop plus the
# handler/resolver kernels ported at the T9 spine cut. +150 for the
# re-mine diff kernel and its envelope projection (ADR-0010).
"crates/engine" = 2750
"crates/error" = 267
"crates/guest" = 220
