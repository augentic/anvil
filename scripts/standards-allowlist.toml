# Per-predicate per-file violation baselines snapshotted by Skills-1.
#
# Each `[file."<rel-path>"]` table caps the number of violations of each
# predicate for that file. A live count strictly greater than the
# baseline fails CI; missing entries default to 0 (new files start
# clean). Reductions are encouraged (Skills-2 drives every entry to 0);
# raises require justification in the PR.
#
# Predicate definitions live in `scripts/checks/skill_discipline.ts`.
# Loaded by `scripts/checks/_shared.ts::standardsAllowlist`.

# CL-S03 drove every `noRfcCitationsInSkillBody` baseline to 0:
# - inline body citations were relocated to a trailing `## References`
#   block (markdown link form, stripped by the predicate),
# - migration prose was moved to `docs/explanation/decision-log.md`,
# - decorative citations inside fenced specialist prompts were dropped.
# New SKILL.md violations now fail CI without grandfathering.

# `sectionLineCount` baselines (S2). Each entry caps the number of H2
# sections that may exceed the 60-line per-section ceiling enforced by
# `checkSectionLineCount`. The baseline counts whole oversized
# *sections*, not lines, so reducing a section under 60 (or moving its
# depth into `references/`) is the way to drop the entry. New SKILL.md
# files start at 0; grandfathered entries below carry today's audit
# count and are expected to ratchet down with each touch.

