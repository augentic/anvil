# Per-predicate per-file violation baselines snapshotted by Skills-1.
#
# Each `[file."<rel-path>"]` table caps the number of violations of each
# predicate for that file. A live count strictly greater than the
# baseline fails CI; missing entries default to 0 (new files start
# clean). Reductions are encouraged (Skills-2 drives every entry to 0);
# raises require justification in the PR.
#
# Predicate definitions live in `scripts/checks/skill_discipline.ts`.
# Loaded by `scripts/checks/_shared.ts::standardsAllowlist`.

