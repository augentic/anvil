[package]
name = "tooling"
version = "0.1.0"
edition = "2021"
description = "Framework developer tooling for augentic/specify (RFC-5)"
publish = false

[[bin]]
name = "tooling"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
jsonschema = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.6"
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
