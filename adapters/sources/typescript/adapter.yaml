# yaml-language-server: $schema=https://github.com/augentic/specify/raw/main/engine/schemas/source.schema.json
name: typescript
version: "1.0.0"
axis: source
execution: agent
briefs:
  extract: briefs/extract.md
  survey: briefs/survey.md
description: >-
  TypeScript / JavaScript legacy-code source adapter. Walks a read-only source
  tree under `$SOURCE_DIR`, surveys framework-rooted call sites (Express,
  Fastify, NestJS, BullMQ, Next.js, node-cron, plain `ws`, yargs/commander,
  `fetch` / `axios` / typed SDK call-outs) as slice-sized leads, and
  extracts behavioural Evidence as `excerpt`, `type`, and `call` claims.
  Authority emitted is `behaviour`; survey grammar is adapter-internal
  (no `surfaces.json` sibling artifact).
