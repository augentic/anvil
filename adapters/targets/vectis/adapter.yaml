# yaml-language-server: $schema=https://github.com/augentic/specify-cli/raw/main/schemas/target.schema.json
name: vectis
version: 1
axis: target
execution: agent
description: Vectis target adapter — Crux shared core (Rust), SwiftUI iOS shell, and Kotlin/Jetpack Compose Android shell. `shape` carries the Crux idiom guidance core synthesis folds into `spec.md` and `design.md`; `build` regenerates the per-slice `composition.yaml` alongside the implementation code; `merge` lands both and re-runs the host cap matrix against the merged baseline. `tokens.yaml` and `assets.yaml` remain operator-curated build inputs.
briefs:
  shape: briefs/shape.md
  build: briefs/build.md
  merge: briefs/merge.md
tools:
  - name: vectis
    version: "0.3.0"
