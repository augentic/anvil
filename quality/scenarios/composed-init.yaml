version: 1
id: composed-init
owner: workflow-runtime
gate-tier: full
isolation: fresh-project
setup:
  commands: []
  environment: {}
workflow:
  - id: init
    kind: command
    run: specify init ./echo-target.wasm --name composed-smoke --scaffold-only
profiles:
  - id: replay
    runtime: wasm
    model: replay
    grading: hard
    trials: 1
    environment: {}
fixtures: []
hard-assertions:
  - id: composed-init-succeeds
    after: init
    probe:
      kind: exit-code
      step: init
      equals: 0
  - id: project-scaffold-written
    after: init
    probe:
      kind: path-exists
      path: .specify/project.yaml
semantic-rubrics: []
expected-outputs:
  - path: .specify/project.yaml
    kind: file
