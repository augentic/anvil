version: 1
id: workspace-two-projects
owner: scenarios
gate-tier: release-blocker
isolation: fresh-project
setup:
  commands: []
  environment: {}
workflow:
- id: runbook
  kind: prompt
  run: Follow quality/runbooks/workspace-two-projects.md
profiles:
- id: native-replay
  runtime: native
  model: replay
  grading: hard
  trials: 1
  environment: {}
- id: replay
  runtime: wasm
  model: replay
  grading: hard
  trials: 1
  environment: {}
- id: native-live
  runtime: native
  model: live
  grading: semantic
  trials: 3
  environment: {}
- id: wasm-live
  runtime: wasm
  model: live
  grading: semantic
  trials: 3
  environment: {}
fixtures: []
hard-assertions:
- id: plan-exists
  after: runbook
  probe:
    kind: path-exists
    path: plan.yaml
- id: per-slice-project-routing
  after: runbook
  probe:
    kind: registered
- id: slots-materialised
  after: runbook
  probe:
    kind: registered
- id: plan-lock-at-workspace
  after: runbook
  probe:
    kind: registered
- id: execute-loop-all-done
  after: runbook
  probe:
    kind: registered
semantic-rubrics: []
expected-outputs:
- path: plan.yaml
  kind: file
- path: registry.yaml
  kind: file
- path: workspace
  kind: directory
