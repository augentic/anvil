version: 1
id: workspace-fail-resume
owner: scenarios
gate-tier: full
isolation: fresh-project
setup:
  commands: []
  environment: {}
workflow:
- id: runbook
  kind: prompt
  run: Follow quality/runbooks/workspace-fail-resume.md
profiles:
- id: wasm-live
  runtime: wasm
  model: live
  grading: semantic
  trials: 3
  environment: {}
fixtures: []
hard-assertions:
- id: plan-exists
  after: runbook
  probe:
    kind: path-exists
    path: plan.yaml
- id: breakout-routes-to-slot
  after: runbook
  probe:
    kind: registered
- id: active-slice-resolved-across-boundary
  after: runbook
  probe:
    kind: registered
- id: execute-loop-all-done
  after: runbook
  probe:
    kind: registered
semantic-rubrics:
- id: chdir-without-operator-intervention
  after: runbook
  criterion: the correct `chdir` happens without the operator changing directories.
  evidence:
  - plan.yaml
  - workspace
expected-outputs:
- path: plan.yaml
  kind: file
- path: workspace
  kind: directory
