version: 1
id: single-project-plan
owner: scenarios
gate-tier: full
isolation: fresh-project
setup:
  commands: []
  environment: {}
workflow:
- id: runbook
  kind: prompt
  run: Follow evals/scenarios/single-project-plan.md
profiles:
- id: native-replay
  runtime: native
  model: replay
  grading: hard
  trials: 1
  environment: {}
- id: wasm-replay
  runtime: wasm
  model: replay
  grading: hard
  trials: 1
  environment: {}
- id: native-live
  runtime: native
  model: live
  grading: semantic
  trials: 3
  environment: {}
- id: wasm-live
  runtime: wasm
  model: live
  grading: semantic
  trials: 3
  environment: {}
fixtures: []
hard-assertions:
- id: plan-exists
  after: runbook
  probe:
    kind: path-exists
    path: plan.yaml
- id: plan-validates
  after: runbook
  probe:
    kind: registered
- id: no-project-routing-required
  after: runbook
  probe:
    kind: registered
semantic-rubrics:
- id: slices-match-expected-shape
  after: runbook
  criterion: entries are named, scoped, and ordered consistently with the brief.
  evidence:
  - plan.yaml
  - discovery.md
expected-outputs:
- path: plan.yaml
  kind: file
- path: discovery.md
  kind: file
