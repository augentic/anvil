version: 1
id: lead-reconciliation
owner: scenarios
gate-tier: full
isolation: fresh-project
setup:
  commands: []
  environment: {}
workflow:
- id: runbook
  kind: prompt
  run: Follow quality/runbooks/lead-reconciliation.md
profiles:
- id: native-replay
  runtime: native
  model: replay
  grading: hard
  trials: 1
  environment: {}
- id: wasm-replay
  runtime: wasm
  model: replay
  grading: hard
  trials: 1
  environment: {}
- id: native-live
  runtime: native
  model: live
  grading: semantic
  trials: 3
  environment: {}
- id: wasm-live
  runtime: wasm
  model: live
  grading: semantic
  trials: 3
  environment: {}
fixtures: []
hard-assertions:
- id: plan-exists
  after: runbook
  probe:
    kind: path-exists
    path: plan.yaml
- id: plan-validates
  after: runbook
  probe:
    kind: registered
- id: merged-slice-combines-sources
  after: runbook
  probe:
    kind: registered
- id: amend-overrides-merge
  after: runbook
  probe:
    kind: registered
- id: extract-runs-per-contributing-source
  after: runbook
  probe:
    kind: registered
semantic-rubrics:
- id: tentative-merge-surfaced
  after: runbook
  criterion: any uncertain merge appears under `## Tentative merges` in `change.md`.
  evidence:
  - plan.yaml
  - change.md
expected-outputs:
- path: plan.yaml
  kind: file
- path: change.md
  kind: file
