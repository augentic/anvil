version: 1
id: typescript-multi-slice
owner: scenarios
gate-tier: full
isolation: fresh-project
setup:
  commands: []
  environment: {}
workflow:
- id: runbook
  kind: prompt
  run: Follow quality/runbooks/typescript-multi-slice.md
profiles:
- id: wasm-live
  runtime: wasm
  model: live
  grading: semantic
  trials: 3
  environment: {}
fixtures: []
hard-assertions:
- id: plan-exists
  after: runbook
  probe:
    kind: path-exists
    path: plan.yaml
- id: plan-validates
  after: runbook
  probe:
    kind: registered
- id: multiple-slices-from-code
  after: runbook
  probe:
    kind: registered
- id: sources-legacy-only
  after: runbook
  probe:
    kind: registered
semantic-rubrics:
- id: no-under-slicing
  after: runbook
  criterion: distinct legacy behaviors are not collapsed into one slice.
  evidence:
  - plan.yaml
  - discovery.md
expected-outputs:
- path: plan.yaml
  kind: file
- path: discovery.md
  kind: file
