$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:specify:schemas/user"
title: User
description: User entity returned by the API after creation or retrieval.
type: object
required:
  - id
  - email
  - display_name
  - created_at
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier assigned on creation.
  email:
    type: string
    format: email
    description: User's email address.
  display_name:
    type: string
    description: User's display name.
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of account creation.
additionalProperties: false
