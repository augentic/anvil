# yaml-language-server: $schema=../schema.schema.json
name: vectis
version: 2
description: Vectis workflow
domain: |
  Tech stack: Rust (Crux 0.17.0), Swift 6 (SwiftUI, iOS 17+), Kotlin 2.x (Jetpack Compose, Material 3), VectisDesign tokens
  Architecture: Crux App trait with Model, Event, ViewModel, Effect, Command
  Testing: Rust integration tests (cargo test), Xcode build verification (make build), Gradle build verification (./gradlew :app:assembleDebug)

pipeline:
  plan:
    - id: discovery
      brief: briefs/plan/discovery.md
    - id: propose
      brief: briefs/plan/propose.md
  define:
    - id: proposal
      brief: briefs/proposal.md
    - id: specs
      brief: briefs/specs.md
    - id: contracts
      brief: briefs/contracts.md
    - id: composition
      brief: briefs/composition.md
    - id: design
      brief: briefs/design.md
    - id: tasks
      brief: briefs/tasks.md
  build:
    - id: build
      brief: briefs/build.md
  merge:
    - id: merge
      brief: briefs/merge.md
