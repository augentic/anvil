# yaml-language-server: $schema=../../.cursor/schemas/specify-schema.schema.json
name: vectis
version: 2
description: Vectis workflow
domain: |
  Tech stack: Rust (Crux 0.17.0), Swift 6 (SwiftUI, iOS 17+), Kotlin 2.x (Jetpack Compose, Material 3), VectisDesign tokens
  Architecture: Crux App trait with Model, Event, ViewModel, Effect, Command
  Testing: Rust integration tests (cargo test), Xcode build verification (make build), Gradle build verification (./gradlew :app:assembleDebug)

pipeline:
  plan:
    - id: discovery
      brief: briefs/plan/discovery.md
    - id: propose
      brief: briefs/plan/propose.md
  define:
    - id: proposal
      brief: briefs/proposal.md
    - id: specs
      brief: briefs/specs.md
    - id: composition
      brief: briefs/composition.md
    - id: design
      brief: briefs/design.md
    - id: tasks
      brief: briefs/tasks.md
  build:
    - id: build
      brief: briefs/build.md
  merge:
    - id: merge
      brief: briefs/merge.md

# Artifact contract (RFC-11 §H). Documentation-first metadata that names the UI
# input set, define-phase outputs, and the build/merge consumption surface. v1
# ships exactly one automated consumer: the composition.md brief reads
# `artifacts.layout.paths.change_local` then `artifacts.layout.paths.project` to
# discover layout.yaml. Every other field is documentation for v1; promoting
# additional consumers (e.g. build/merge using `consumed_by` for orchestration)
# is a follow-on RFC.
artifacts:
  layout:
    role: input
    paths:
      change_local: .specify/changes/<name>/layout.yaml
      project: design-system/layout.yaml
    schema: composition.schema.json
    validates_with: layout
    consumed_by: [define]
  tokens:
    role: input
    paths:
      change_local: .specify/changes/<name>/tokens.yaml
      project: design-system/tokens.yaml
    schema: tokens.schema.json
    validates_with: tokens
    consumed_by: [define, build]
    merge_strategy: input-delta
  assets:
    role: input
    paths:
      change_local: .specify/changes/<name>/assets.yaml
      project: design-system/assets.yaml
    schema: assets.schema.json
    validates_with: assets
    consumed_by: [define, build]
    merge_strategy: input-delta
  asset-files:
    role: input
    paths:
      change_local: .specify/changes/<name>/assets/**
      project: design-system/assets/**
    consumed_by: [build]
    merge_strategy: input-delta
  composition:
    role: define-output
    paths:
      change_local: .specify/changes/<name>/composition.yaml
      baseline: .specify/specs/composition.yaml
    schema: composition.schema.json
    validates_with: composition
    produced_by: [define]
    consumed_by: [build, merge]
  design:
    role: define-output
    paths: { change_local: .specify/changes/<name>/design.md }
    produced_by: [define]
    consumed_by: [build]
  specs:
    role: define-output
    paths:
      change_local: .specify/changes/<name>/specs/**/*.md
      baseline: .specify/specs/**/*.md
    produced_by: [define]
    consumed_by: [build, merge]
  tasks:
    role: define-output
    paths: { change_local: .specify/changes/<name>/tasks.md }
    produced_by: [define]
    consumed_by: [build]
