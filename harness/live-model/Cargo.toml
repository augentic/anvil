[package]
name = "live-model"
description = "The explicit live-model workflow test over the adversarial fixture lead set"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Tests-only and outside the default members: the cursor backend's
# dependency graph (omnia-cursor → omnia-wasi-model → omnia →
# wasmtime) must never enter the per-commit *test* compile path —
# `cargo make test` selects default members only. Workspace-wide
# clippy (`cargo make lint`) still compiles this package.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
adapter.workspace = true
anyhow.workspace = true
artifacts.workspace = true
change.workspace = true
diagnostics.workspace = true
error.workspace = true
omnia.workspace = true
omnia-cursor.workspace = true
omnia-guest.workspace = true
omnia-testkit.workspace = true
omnia-wasi-model.workspace = true
project.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
slice.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
