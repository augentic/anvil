[package]
name = "fixtures"
description = "Fixture adapter — one deterministic native core supplying both specify:adapter axes for engine tests"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Guest-only: the wasm32 shim's dependencies live under the same
# target gate omnia's guests use; the native core library stays
# dependency-free.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
serde_json.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true

# The combined fixture-adapter guest: one wasm32-wasip2 component
# exporting both `specify:adapter` axes through the additive `adapter`
# world, built by `cargo make guests`.
# The underscore name keeps the artifact filename deterministic;
# example targets always land under the target dir's examples/
# subdirectory (target/wasm32-wasip2/debug/examples/fixture_adapter.wasm).
[[example]]
name = "fixture_adapter"
path = "adapter.rs"
crate-type = ["cdylib"]
