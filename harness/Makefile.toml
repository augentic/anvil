# Manual entry points for the parked composed-deployment test rig.
# Run from inside harness/ (`cargo make <task>`); nothing here is wired
# into the root workspace's CI tasks.

[config]
default_to_workspace = false
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# Build guests
#
# wasm32-wasip2 guest components loaded by the composed runtime
# integration tests in runtime/tests/: the core `specify` guest (a
# root-workspace member, built from the repo root) plus the echo
# adapter fixtures (cdylib examples of the `fixtures` package, landing
# under target/wasm32-wasip2/debug/examples/). Two invocations:
# `--examples` narrows target selection to example targets only, so the
# core guest's lib needs its own build. Both land in the shared
# repo-root target/ (see .cargo/config.toml).
[tasks.build-guests]
script_runner = "bash"
script = '''
set -euo pipefail
(cd .. && cargo build -p specify --target wasm32-wasip2)
cargo build -p fixtures --examples --target wasm32-wasip2
'''

# Fetch adapters
#
# Populate the global adapter store with the pinned published adapter
# components the composed runtime tests resolve (store-first; the dev
# sibling checkout's release build is the fallback — see
# runtime/tests/common.rs `adapter_component_wasm`). The version pin is
# the single source of truth at runtime/tests/adapters.pin, shared with
# the test harness. Idempotent and offline-safe: an existing store
# entry is never re-fetched, so a warm store needs neither network nor
# `wkg`. On miss, requires `wkg` on PATH. The store root honours
# `$SPECIFY_ADAPTER_STORE` (else `$HOME/.specify/adapters`) and the
# registry host `$SPECIFY_REGISTRY` (else augentic.io), matching the
# release workflow. The sidecar written beside each entry is the
# verify-on-read record `schema::cache::verify_store_entry` checks.
[tasks.fetch-adapters]
script_runner = "bash"
script = '''
set -euo pipefail
pin="$(tr -d '[:space:]' < runtime/tests/adapters.pin)"
store="${SPECIFY_ADAPTER_STORE:-${HOME}/.specify/adapters}"
registry="${SPECIFY_REGISTRY:-augentic.io}"
mkdir -p "${store}"
config="$(mktemp)"
trap 'rm -f "${config}"' EXIT
printf '[namespace_registries]\nspecify = "%s"\n' "${registry}" > "${config}"
for name in intent omnia; do
    entry="${store}/${name}@${pin}.wasm"
    meta="${store}/${name}@${pin}.meta"
    if [ -f "${entry}" ]; then
        echo "${name}@${pin} already in store; skipping"
        continue
    fi
    echo "fetching specify:${name}@${pin} into ${entry}"
    wkg get "specify:${name}@${pin}" --output "${entry}" --config "${config}"
    if command -v sha256sum >/dev/null 2>&1; then
        digest="$(sha256sum "${entry}" | awk '{print $1}')"
    else
        digest="$(shasum -a 256 "${entry}" | awk '{print $1}')"
    fi
    printf 'tree_digest: sha256:%s\n' "${digest}" > "${meta}"
    chmod a-w "${entry}"
done
'''

# Test — the whole rig (the composed tests self-build the guests, so a
# bare run works; the explicit dependency keeps the build visible).
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--workspace", "--no-tests=pass"]
dependencies = ["build-guests"]

# Lint — the rig is not covered by the root workspace's clippy gate;
# run this before reviving or extending it.
[tasks.lint]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
