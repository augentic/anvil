# The Rust-native shim: `specify-dev` drives the same verb
# handlers as the wasm guest against a NativeProvider — in-process
# dispatch to the sibling adapter crates' operations plus a native
# Model backend. A workspace member kept out of `default-members`, so
# no root CI gate requires the ../specify-adapters checkout.
[package]
name = "specify-dev"
description = "Specify native dev shim — the Rust-native execution path"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "specify-dev"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }

artifacts.workspace = true
transport.workspace = true
error.workspace = true
schema.workspace = true
workflow.workspace = true

omnia.workspace = true
omnia-cursor.workspace = true
omnia-guest.workspace = true
omnia-testkit = { workspace = true, features = ["model", "replay"] }
omnia-wasi-model.workspace = true

# The sibling adapter crates, consumed as rlibs (the same crates whose
# cdylib halves ship as wasm components). `targets/omnia` is renamed to
# dodge the host `omnia` crate.
adapter = { path = "../../../specify-adapters/crates/adapter" }
captures = { path = "../../../specify-adapters/sources/captures" }
contracts = { path = "../../../specify-adapters/targets/contracts" }
documentation = { path = "../../../specify-adapters/sources/documentation" }
intent = { path = "../../../specify-adapters/sources/intent" }
omnia-target = { package = "omnia", path = "../../../specify-adapters/targets/omnia" }
screenshots = { path = "../../../specify-adapters/sources/screenshots" }
typescript = { path = "../../../specify-adapters/sources/typescript" }
vectis = { path = "../../../specify-adapters/targets/vectis" }

[dev-dependencies]
jiff.workspace = true
serde-saphyr.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
