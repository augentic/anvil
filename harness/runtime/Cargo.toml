[package]
name = "runtime"
description = "Parked test rig: replay runtime and composed-deployment test surface for Specify WASI components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The target guard in src/bin/replay.rs needs cfg-if on every target; a
# stray wasm32 build of the whole workspace then compiles to an empty main.
[dependencies]
cfg-if.workspace = true

# Host-only: the replay runtime never compiles for the guest wasm32 targets,
# so its dependencies live under the same target gate omnia itself uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd.workspace = true
clap.workspace = true
clap_complete.workspace = true
jiff.workspace = true
omnia-guest.workspace = true
omnia-testkit.workspace = true
serde_json.workspace = true
dispatch.workspace = true
artifacts.workspace = true
schema.workspace = true
workflow = { workspace = true, features = ["native"] }
tempfile.workspace = true

[lints]
workspace = true

# The replay sibling of the `specify` binary: the same `omnia::runtime!`
# macro over `WasiModel: ModelDefault` instead of the cursor backend, for
# component-level tests and CI — not an operational mode.
[[bin]]
name = "runtime-replay"
path = "src/bin/replay.rs"
