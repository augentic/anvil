# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "wasm", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "vet", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
command = "rustup"
args = ["run", "nightly", "cargo", "udeps", "--all-targets"]
install_crate = "cargo-udeps"

# Fmt — mutates; the gates use fmt
[tasks.fmt]
command = "rustup"
args = ["run", "nightly", "cargo", "fmt", "--all"]

# Lint — --workspace so the opt-in harness packages stay linted, matching CI
[tasks.lint]
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# Outdated
[tasks.outdated]
command = "cargo"
args = ["outdated", "--depth", "1"]
install_crate = "cargo-outdated"

# Check wasm core — the per-push WASM boundary gate: the shipped guest
# crates plus the adapter shim, so a WIT revision and its seam
# land (and break) in the same push without Wasmtime execution.
[tasks.wasm]
script_runner = "@shell"
script = '''
cargo check --locked --lib -p specify -p transport --target wasm32-wasip2
cargo check --locked -p adapter --examples --target wasm32-wasip2
'''
env = { RUSTFLAGS = "-Dwarnings" }

# Build guests — the workflow core plus the harness adapter
[tasks.guests]
script_runner = "@shell"
script = '''
cargo build --locked --lib -p specify --target wasm32-wasip2
cargo build --locked -p adapter --examples --target wasm32-wasip2
'''

# Test — the ordinary suite over the default workspace members
# (crates/*, harness/adapter, tests); the WASM boundary
# smoke is opt-in via test-wasm.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--locked", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# WASM boundary smoke — hosts the freshly built guests in one Omnia
# deployment. Matches the weekly/path-filtered wasm workflow; not part
# of check/ci.
[tasks.test-wasm]
command = "cargo"
args = ["nextest", "run", "--locked", "-p", "wasm-smoke", "--no-tests=pass"]
dependencies = ["guests"]

# Live-model workflow test — the single ignored native trial over the
# adversarial fixture lead set. Operator-invoked (release tagging,
# judgment-prompt or answer-schema changes); requires cursor-agent
# credentials; never CI. `--no-capture` keeps the repair-count report
# and the retained-project path visible; `--no-tests=fail` makes an
# empty run fail loudly — the operator invocation is this rung's only
# cadence, so a silently-skipped trial must not read as green.
[tasks.test-live]
command = "cargo"
args = [
    "nextest",
    "run",
    "--locked",
    "-p",
    "live-model",
    "--run-ignored",
    "all",
    "--no-capture",
    "--no-tests=fail",
]

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--workspace", "--all-features"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"
