# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt-check", "lint", "check-wasm-core", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["fmt-check", "lint", "check-wasm-core", "test", "test-docs", "doc", "vet", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt (mutating; local convenience)
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Fmt check (non-mutating; the gate `check` / `ci` run — a mutating
# `fmt` inside a gate silently rewrites violations instead of failing)
[tasks.fmt-check]
script = "cargo +nightly fmt --all -- --check"

# Lint
[tasks.lint]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
install_crate = { rustup_component_name = "clippy" }

# Outdated (advisory — never part of `ci`: any upstream release would
# fail the gate for unrelated changes; run it on demand or scheduled)
[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

# Check wasm core
#
# Keeper for the wasm32-cleanliness of the guest-facing crates: the
# guest shim depends on workflow (no `native` feature) and
# dispatch, so both must always compile for wasm32-wasip2.
[tasks.check-wasm-core]
command = "cargo"
args = [
    "check",
    "-p", "specify",
    "-p", "dispatch",
    "--target", "wasm32-wasip2",
]
env = { RUSTFLAGS = "-Dwarnings" }

# Build guests
#
# wasm32-wasip2 guest components loaded by the composed runtime
# integration tests in crates/runtime/tests/: the core `specify` guest
# plus the echo adapter fixtures (cdylib examples of the top-level
# `examples` package, landing under target/wasm32-wasip2/debug/examples/).
# Two invocations: `--examples` narrows target selection to example
# targets only, so the core guest's lib needs its own build.
[tasks.build-guests]
script_runner = "bash"
script = '''
set -euo pipefail
cargo build -p specify --target wasm32-wasip2
cargo build -p examples --examples --target wasm32-wasip2
'''

# Fetch adapters
#
# Populate the global adapter store with the pinned published adapter
# components the composed runtime tests resolve (store-first; the dev
# sibling checkout's release build is the fallback — see
# crates/runtime/tests/common.rs `adapter_component_wasm`). The version
# pin is the single source of truth at crates/runtime/tests/adapters.pin,
# shared with the test harness. Idempotent and offline-safe: an existing
# store entry is never re-fetched, so a warm store needs neither network
# nor `wkg`. On miss, requires `wkg` on PATH (CI pins
# `cargo install wkg@0.15.0 --locked`). The store root honours
# `$SPECIFY_ADAPTER_STORE` (else `$HOME/.specify/adapters`) and the
# registry host `$SPECIFY_REGISTRY` (else augentic.io), matching the
# release workflow. The sidecar written beside each entry is the
# verify-on-read record `schema::cache::verify_store_entry` checks.
[tasks.fetch-adapters]
script_runner = "bash"
script = '''
set -euo pipefail
pin="$(tr -d '[:space:]' < crates/runtime/tests/adapters.pin)"
store="${SPECIFY_ADAPTER_STORE:-${HOME}/.specify/adapters}"
registry="${SPECIFY_REGISTRY:-augentic.io}"
mkdir -p "${store}"
config="$(mktemp)"
trap 'rm -f "${config}"' EXIT
printf '[namespace_registries]\nspecify = "%s"\n' "${registry}" > "${config}"
for name in intent omnia; do
    entry="${store}/${name}@${pin}.wasm"
    meta="${store}/${name}@${pin}.meta"
    if [ -f "${entry}" ]; then
        echo "${name}@${pin} already in store; skipping"
        continue
    fi
    echo "fetching specify:${name}@${pin} into ${entry}"
    wkg get "specify:${name}@${pin}" --output "${entry}" --config "${config}"
    if command -v sha256sum >/dev/null 2>&1; then
        digest="$(sha256sum "${entry}" | awk '{print $1}')"
    else
        digest="$(shasum -a 256 "${entry}" | awk '{print $1}')"
    fi
    printf 'tree_digest: sha256:%s\n' "${digest}" > "${meta}"
    chmod a-w "${entry}"
done
'''

# Test
#
# `clean` is deliberately not in the dependency list: the
# `RUSTFLAGS=-Dwarnings` override already differs from the default
# profile, so cargo rebuilds the workspace under these flags regardless,
# making a `cargo clean` cold rebuild redundant cost on every run.
# Adapter extension wasm for host-dispatch fixture tests is checked in under
# `tests/fixtures/adapters/targets/dispatch-fixture/adapter.wasm` (rebuild
# via `scripts/regen-wasm-fixtures.sh` when the fixture source changes);
# the RFC-61 skeleton guests are NOT checked in — `build-guests` builds
# them fresh here, and the runtime crate's tests also self-build them so
# a bare `cargo nextest run` works.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }
dependencies = ["build-guests"]

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet (check only — regeneration before checking would auto-exempt
# anything unaudited and the gate could never fail)
[tasks.vet]
script = '''
cargo vet --locked
'''
install_crate = "cargo-vet"

# Vet regenerate (manual, on dependency add/update — refresh imports and
# exemptions, then review the `supply-chain/` diff before committing)
[tasks.vet-regenerate]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
'''
install_crate = "cargo-vet"

# Publish (dry-run to augentic registry)
[tasks.publish]
command = "cargo"
args = ["publish", "--registry=augentic", "--allow-dirty", "--dry-run"]

# Publish core guest
#
# Publish the release-built workflow component as
# `specify:core@<version>`, where <version> is the VERSION file — the
# published identity IS the binary version, one knob (VERSION and the
# workspace Cargo.toml version move together via release.yaml). This
# leg is load-bearing (standalone deployment): a released binary resolves its
# core from the store entry `specify init` / `specify adapters sync`
# hydrate from exactly this published identity. The probe-first
# idempotency (skip-if-present, abort when absent-vs-unreachable is
# undecidable) lives in scripts/wkg-publish-idempotent.sh, which builds
# the component only when the identity is definitively absent. Requires
# `wkg` on PATH and a wasm-pkg config mapping the `specify` namespace
# (the release workflow writes one; local emergency publishing supplies
# a developer token the same way).
[tasks.publish-core]
script_runner = "bash"
script = '''
set -euo pipefail
version="$(tr -d '[:space:]' < VERSION)"
scripts/wkg-publish-idempotent.sh "specify:core@${version}" \
    target/wasm32-wasip2/release/specify.wasm \
    cargo build -p specify --release --target wasm32-wasip2
'''

# Publish WIT contract
#
# Publish wit/specify.wit as `specify:adapter@<ver>`, parsing
# <ver> from the WIT `package` declaration — the single version
# declaration for the contract. The skip-if-present probe in
# scripts/wkg-publish-idempotent.sh IS the version-changed guard: a tag
# that did not bump the WIT package version finds the identity already
# published and no-ops. `wkg wit build` needs no --config here: the
# contract's `use` statements are all intra-package (omnia:model appears
# only in doc prose), so nothing external is fetched; the wkg.lock it
# drops in the cwd is empty scaffolding and is removed to keep the tree
# clean for local runs.
[tasks.publish-wit]
script_runner = "bash"
script = '''
set -euo pipefail
version="$(sed -n 's/^package specify:adapter@\(.*\);$/\1/p' wit/specify.wit)"
if [ -z "${version}" ]; then
    echo "error: no 'package specify:adapter@<ver>;' declaration in wit/specify.wit" >&2
    exit 1
fi
out_dir="$(mktemp -d)"
trap 'rm -rf "${out_dir}"' EXIT
scripts/wkg-publish-idempotent.sh "specify:adapter@${version}" \
    "${out_dir}/specify-adapter.wasm" \
    wkg wit build --wit-dir wit --output "${out_dir}/specify-adapter.wasm"
rm -f wkg.lock
'''


# -------------------------------------
# Auxiliary tasks
# -------------------------------------

