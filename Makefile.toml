# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "links", "vet", "deny"]

# -------------------------------------
# Actions
# -------------------------------------

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.audit]
command = "cargo"
args = ["audit"]

[tasks.deny]
command = "cargo"
args = ["deny", "check"]
install_crate = "cargo-deny"

[tasks.deps]
command = "rustup"
args = ["run", "nightly", "cargo", "udeps", "--workspace", "--all-targets"]
install_crate = "cargo-udeps"

[tasks.fmt]
script = "cargo +nightly fmt --all"

[tasks.lint]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
install_crate = { rustup_component_name = "clippy" }

[tasks.outdated]
command = "cargo"
args = ["outdated", "--depth", "1"]
install_crate = "cargo-outdated"

[tasks.test]
command = "cargo"
args = ["nextest", "run", "--workspace", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--workspace", "--all-features"]

[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Developer Guide link integrity (`mdbook-linkcheck2` via docs/book.toml).
# Part of `cargo make ci`; GitHub Actions also runs the same command in the `links` job.
[tasks.links]
command = "mdbook"
args = ["build", "docs"]

# The journey-test seam fixture (remediation Phase 2): the mock source
# adapter built as a wasm component, `target/wasm32-wasip2/release/
# examples/source.wasm`.
[tasks.source]
workspace = false
command = "cargo"
args = ["build", "--locked", "--example", "source", "--target", "wasm32-wasip2", "--release"]

# The dev-only journey host (ADR-0009 §5): the shipped runtime shape
# with a scripted `WasiModel` backend, embedding the engine guest
# built from the same sources. `EMERY_EMBED_DIR` stages the built mock
# component into the embedded first-party registry (ADR-0002 §2) so
# the journey exercises embedded resolution as a permanent rung.
[tasks.runtime]
workspace = false
script_runner = "bash"
script = '''
export EMERY_EMBED_DIR="${CARGO_TARGET_DIR:-$PWD/target}/wasm32-wasip2/release/examples"
cargo build --locked --example runtime
'''

# The walking-skeleton journey test (target-architecture §8) over the
# built seam fixture and the journey host — the Phase 3 exit
# criterion, green and required in CI in its own job, never inside
# `test` (excluded there by the nextest default-filter).
[tasks.journey]
workspace = false
dependencies = ["source", "runtime"]
command = "cargo"
args = ["nextest", "run", "-p", "emery", "-E", "binary(=journey)", "--ignore-default-filter"]
env = { RUSTFLAGS = "-Dwarnings" }

# Coverage brake for unit-test reductions (docs/standards/testing.md).
# Usage: CRATE=project cargo make cov
# Operator-invoked, never part of `ci`.
[tasks.cov]
workspace = false
script = "cargo llvm-cov nextest -p ${CRATE} --summary-only"
install_crate = "cargo-llvm-cov"

[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --workspace --no-tests=pass
'''

# Read-only gate: verification must never rewrite the audit inputs it
# verifies. Regeneration is the explicit maintenance act below.
[tasks.vet]
command = "cargo"
args = ["vet", "--locked"]
install_crate = "cargo-vet"

[tasks.vet-regenerate]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"
