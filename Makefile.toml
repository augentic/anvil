# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

extend = [{ path = "examples/Makefile.toml" }]

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "vet", "deny"]

# -------------------------------------
# Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
command = "rustup"
args = ["run", "nightly", "cargo", "udeps", "--workspace", "--all-targets"]
install_crate = "cargo-udeps"

# Eval — the live-model prompt-evaluation harness (operator-invoked, never CI)
[tasks.eval]
command = "cargo"
args = ["run", "--locked", "-p", "eval"]

# Fmt — mutates; the gates use fmt
[tasks.fmt]
command = "rustup"
args = ["run", "nightly", "cargo", "fmt", "--all"]

# Lint
[tasks.lint]
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# Outdated
[tasks.outdated]
command = "cargo"
args = ["outdated", "--depth", "1"]
install_crate = "cargo-outdated"

# Test
[tasks.test]
command = "cargo"
args = [
    "nextest",
    "run",
    "--locked",
    "--workspace",
    "--all-features",
    "--no-tests=pass",
]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--workspace", "--all-features"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --workspace --no-tests=pass
'''

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"
