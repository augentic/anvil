[package]
name = "testkit"
description = "Specify's single test-support crate: the fixture adapter core, the unified capability provider, scripted answers, and environment guards"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Host-side test support. The wasm32 build carries only the dependency-free
