[package]
name = "testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Dev-only shared test support for Specify test suites: the scripted Model mock"
publish = false

[lints]
workspace = true

# Dev-dependency-only: the testkit never compiles for the guest wasm32
# targets, so its dependencies live under the same target gate omnia
# itself uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnia-guest.workspace = true
