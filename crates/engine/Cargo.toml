[package]
name = "emery-engine"
description = "The spec-generator engine: extract, synthesise, emit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools"]
keywords = ["emery", "engine"]
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
emery-prose.workspace = true
emery-source.workspace = true
omnia-guest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
toml.workspace = true

[build-dependencies]
emery-prose = { workspace = true, features = ["emit"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-test = { workspace = true, features = ["guest"] }

[lints]
workspace = true
