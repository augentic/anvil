[package]
name = "fixture"
description = "Specify's canonical SDK-native fixture adapter: the deterministic behaviour core, the typed catalog registry, the scripted answer corpus, and the combined-world WIT bindings"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Dual-target: the behaviour core and trait implementors speak the SDK
# seam DTOs and compile for both native and wasm32 (the examples
# adapter guest links them).
[dependencies]
adapter.workspace = true
omnia-guest.workspace = true

# The `wit` module: the combined `adapter`-world export bindings the
# examples guest shims over.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

# Host-only support: the linked catalog registry, session helpers over
# the harness default layer, and the scripted answer corpus.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
harness.workspace = true
omnia-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
project.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
