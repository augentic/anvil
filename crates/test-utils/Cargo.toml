[package]
name = "test-utils"
description = "Fixture-component build pipeline and runtime harness for the root component suite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Native only: the build script compiles the mock adapter example to a
# `wasm32-wasip2` component and the harness overlays the shipped runtime's
# deployment through omnia-test.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
emery = { path = "../.." }
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }

[build-dependencies]
omnia-test = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
