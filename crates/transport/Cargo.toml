[package]
name = "emery-transport"
description = "Wasm-clean command and HTTP transport for `emery`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools"]
keywords = ["emery", "transport"]
readme = "../../README.md"

# Workspace code imports the short crate name; the package publishes as emery-transport.
[lib]
name = "transport"

[dependencies]
emery-adapter.workspace = true
emery-artifacts.workspace = true
clap.workspace = true
emery-diagnostics.workspace = true
emery-engine.workspace = true
emery-error.workspace = true
omnia-guest.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower.workspace = true

[lints]
workspace = true
