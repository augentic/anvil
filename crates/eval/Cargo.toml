[package]
name = "eval"
description = "Specify's live-model prompt-evaluation harness: the operator-invoked engine trial over the fixture adversarial lead set"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "eval"
path = "src/main.rs"

[lints]
workspace = true

# Live harness: native-only. The crate is a declarative binding over
# the shared `harness` crate — the fixture catalog plus the trial
# profile and deterministic fixture assertions.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
artifacts.workspace = true
change.workspace = true
harness.workspace = true
omnia-guest.workspace = true
project.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
