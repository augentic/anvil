[package]
name = "eval"
description = "Specify's live-model prompt-evaluation harness: the operator-invoked engine trial over the fixture adversarial lead set"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "eval"
path = "src/main.rs"

[lib]
name = "eval_binding"
path = "src/lib.rs"

[lints]
workspace = true

# Native-only adapter binding. Runtime and trial policy live in
# `harness`; this package declares only its linked adapters.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fixture.workspace = true
harness = { workspace = true, features = ["runtime"] }
