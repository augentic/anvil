[package]
name = "specify-runtime"
description = "Omnia composed-deployment host surface for Specify WASI components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# Integration tests compile to the single `it` binary (one binary per crate);
# the per-area hubs are pulled in via tests/it.rs `#[path]` includes.
autotests = false

# The target guard in src/bin/replay.rs needs cfg-if on every target; a
# stray wasm32 build of the whole workspace then compiles to an empty main
# (the lib guards itself with a crate-level #![cfg]).
[dependencies]
cfg-if.workspace = true

# Host-only: the runtime surface never compiles for the guest wasm32 targets,
# so its dependencies live under the same target gate omnia itself uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-cursor.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wasmparser.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd.workspace = true
clap.workspace = true
clap_complete.workspace = true
jiff.workspace = true
omnia-testkit.workspace = true
serde_json.workspace = true
specify-dispatch.workspace = true
specify-guest-model.workspace = true
specify-model.workspace = true
specify-schema.workspace = true
specify-workflow = { workspace = true, features = ["native"] }
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

# The generic Omnia host layer (RFC-65 move 2): the macro-generated
# command-mode runtime over the cursor-bound backends, spawned by the
# root `specify` binary's guest leg (`specify_runtime::drive`) as
# `specify-host run --config <manifest> -- <argv>`. Carries no Specify
# vocabulary; must ship beside `specify` in release layouts.
[[bin]]
name = "specify-host"
path = "src/bin/host.rs"

# The replay sibling over the same manifest surface: `WasiModel:
# ModelDefault` instead of the cursor backend, for component-level tests
# and examples (RFC-61 §target shape — not an operational mode). The
# cursor-bound host is the `specify-host` binary above (DECISIONS.md
# §"One `specify` binary").
[[bin]]
name = "specify-runtime-replay"
path = "src/bin/replay.rs"
