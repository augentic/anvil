[package]
name = "runtime"
description = "Replay runtime and composed-deployment test surface for Specify WASI components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# Integration tests compile to the single `it` binary (one binary per crate);
# the per-area hubs are pulled in via tests/it.rs `#[path]` includes.
autotests = false

# The target guard in src/bin/replay.rs needs cfg-if on every target; a
# stray wasm32 build of the whole workspace then compiles to an empty main.
[dependencies]
cfg-if.workspace = true

# Host-only: the replay runtime never compiles for the guest wasm32 targets,
# so its dependencies live under the same target gate omnia itself uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd.workspace = true
clap.workspace = true
clap_complete.workspace = true
jiff.workspace = true
omnia-guest.workspace = true
omnia-testkit.workspace = true
serde_json.workspace = true
dispatch.workspace = true
artifacts.workspace = true
schema.workspace = true
workflow = { workspace = true, features = ["native"] }
tempfile.workspace = true

# Guest-only: the echo example components compile solely for wasm32, so
# their dependencies live under the same target gate omnia's guests use.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
serde_json.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

# The echo adapter guests: skeleton wasm32-wasip2 components loaded by
# the composed runtime tests (`cargo make build-guests` builds them, and
# the tests self-build on first use). Examples rather than workspace
# crates — they are fixtures with exactly one consumer.
[[example]]
name = "echo_source"
crate-type = ["cdylib"]

[[example]]
name = "echo_target"
crate-type = ["cdylib"]

# The replay sibling of the `specify` binary: the same `omnia::runtime!`
# macro over `WasiModel: ModelDefault` instead of the cursor backend, for
# component-level tests and CI — not an operational mode.
[[bin]]
name = "runtime-replay"
path = "src/bin/replay.rs"
