[package]
name = "specify-echo-target-guest"
description = "Echo target-adapter WASI guest component for the Specify Omnia runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# Guest-only: the component body compiles solely for wasm32, so its
# dependencies live under the same target gate omnia's guests use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
serde_json.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
