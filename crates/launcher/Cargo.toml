publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Workspace code imports the short crate name.
[lib]
name = "launcher"

[dependencies]
anyhow.workspace = true
emery-artifacts.workspace = true
emery-diagnostics.workspace = true
emery-error.workspace = true
oci-client.workspace = true
oci-wasm.workspace = true
omnia.workspace = true
emery-project.workspace = true
emery-transport.workspace = true
emery-wasi-workspaces.workspace = true
semver.workspace = true

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
