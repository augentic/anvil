[package]
name = "emery-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Emery adapter SDK: the source operations trait, WIT types, judgment scaffolding, embedded prose registry, and the wasm export macro"
categories = ["development-tools"]
keywords = ["emery", "adapter", "sdk"]
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
omnia-guest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-test = { workspace = true, features = ["guest"] }
