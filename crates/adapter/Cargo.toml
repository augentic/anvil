[package]
name = "emery-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Emery adapter SDK: the source operations trait, the typed evidence question over omnia's model capability, the reference-tool closure, and the wasm export macro over the emery-source contract"
categories = ["development-tools"]
keywords = ["emery", "adapter", "sdk"]
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
emery-prose.workspace = true
emery-source.workspace = true
omnia-guest.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-test = { workspace = true, features = ["guest"] }
