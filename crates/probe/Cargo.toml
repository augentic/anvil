# Lab-only live-model probe library (the typed eval case runner over
# the native host). The `client` feature adds the shared cursor
# composition (`probe::client`) consumed by each repository's
# composition example (`examples/eval/` here and in
# `augentic/emery-adapters`). Never an install or release artifact.
[package]
name = "emery-probe"
description = "Lab-only live-model probe library over the native host"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
client = [
    "dep:omnia",
    "dep:omnia-cursor",
    "dep:omnia-wasi-model",
    "dep:tokio",
    "dep:tracing-subscriber",
]

# Workspace code imports the short crate name.
[lib]
name = "probe"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
emery-artifacts.workspace = true
clap.workspace = true
emery-mock.workspace = true
emery-native = { workspace = true, features = ["cli"] }
emery-slice.workspace = true
jiff.workspace = true
omnia-guest.workspace = true
emery-project.workspace = true
emery-system.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
toml.workspace = true
tracing.workspace = true
omnia = { workspace = true, optional = true }
omnia-cursor = { workspace = true, optional = true }
omnia-wasi-model = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
emery-artifacts.workspace = true
omnia-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
