# Lab-only live-model probe library (the typed eval case runner over
# the native host). The `client` feature adds the shared cursor
# composition (`probe::client`) consumed by each repository's
# composition example (`examples/eval/` here and in
# `augentic/specify-adapters`). Never an install or release artifact.
[package]
name = "probe"
description = "Lab-only live-model probe library over the native host"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
client = ["dep:omnia", "dep:omnia-cursor", "dep:omnia-wasi-model", "dep:tokio"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
artifacts.workspace = true
clap.workspace = true
native = { workspace = true, features = ["cli"] }
omnia-guest.workspace = true
project.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
# Client-only (feature = "client").
omnia = { workspace = true, optional = true }
omnia-cursor = { workspace = true, optional = true }
omnia-wasi-model = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
mock.workspace = true
omnia-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
