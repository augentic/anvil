# The Emery-owned Omnia host capability backing the engine guest's
# `emery:origins` import. Owns the package WIT under `wit/`. The lib
# name is fixed by `omnia::runtime!`'s hosts codegen, which derives the
# crate path `omnia_wasi_origins` from the `WasiOrigins` host type.
[package]
name = "emery-wasi-origins"
description = "Emery-owned Omnia host capability: origin locator fetch (Git/HTTPS) for system survey"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "omnia_wasi_origins"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
omnia.workspace = true
tokio.workspace = true
# The bindgen `tracing` imports mode instruments every generated
# host-side trampoline.
tracing.workspace = true
wasmtime.workspace = true
