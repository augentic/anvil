[dependencies]
thiserror.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
strum.workspace = true
jiff.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
