[package]
name = "specify-error"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Unified error types for the Specify CLI"
categories = ["development-tools"]
keywords = ["specify", "errors"]
readme = "../../README.md"
# Integration tests link through the single `it` binary (tests/it.rs);
# per-area files are pulled in via `#[path]` submodules.
autotests = false

[lints]
