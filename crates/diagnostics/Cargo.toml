[package]
name = "diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Specify neutral diagnostic substrate: the Diagnostic currency, fingerprint algorithm, validators, and renderers shared by the lint and validate surfaces"
categories = ["development-tools"]
keywords = ["specify", "diagnostic", "lint"]
readme = "../../README.md"
# Integration tests link through the single `it` binary (tests/it.rs);
# per-area files are pulled in via `#[path]` submodules.
autotests = false

[lints]
workspace = true

[dependencies]
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
error.workspace = true
schema.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"
