# The Emery-owned Omnia host capability backing the engine guest's
# `emery:ingest` import. Owns the package WIT under `wit/`. The lib
# name is fixed by `omnia::runtime!`'s hosts codegen, which derives the
# crate path `omnia_wasi_ingest` from the `WasiIngest` host type.
[package]
name = "emery-wasi-ingest"
description = "Emery-owned Omnia host capability: Git/HTTPS locator ingest for wave binding"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "omnia_wasi_ingest"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
omnia.workspace = true
tokio.workspace = true
tracing.workspace = true
wasmtime.workspace = true
