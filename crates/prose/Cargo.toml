[package]
name = "emery-prose"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded prompt corpora: the runtime Doc registry, plus (feature `emit`) build-time codegen that walks a markdown tree, link-checks it, and emits the DOCS table"
categories = ["development-tools::build-utils"]
keywords = ["emery", "prose", "codegen"]
readme = "../../README.md"

[lints]
workspace = true

[features]
# Build-time walker + link check; enable from `[build-dependencies]` only.
emit = ["dep:anyhow"]

[dependencies]
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
