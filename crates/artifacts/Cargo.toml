[package]
name = "artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Artifact types and parsers (spec, task, evidence, discovery) plus the shared atomic writer"
categories = ["development-tools"]
keywords = ["specify", "model", "workflow"]
readme = "../../README.md"
# Integration tests compile to the single `it` binary (one binary per crate);
# the per-area files are pulled in via tests/it.rs `#[path]` includes.
autotests = false

[lints]
workspace = true

[dependencies]
glob.workspace = true
regex.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
diagnostics.workspace = true
error.workspace = true
strum.workspace = true
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
