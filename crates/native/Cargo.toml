[package]
name = "emery-native"
description = "Emery native host: statically composed adapter catalog, provider, references, and command execution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools"]
keywords = ["emery", "workflow", "native"]
readme = "../../README.md"

# Workspace code imports the short crate name; the package publishes as emery-native.
[lib]
name = "native"

[lints]
workspace = true

[features]
default = []
cli = [
    "dep:axum",
    "dep:tokio",
    "dep:emery-transport",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
]

[dependencies]
emery-adapter.workspace = true
emery-artifacts.workspace = true
axum = { workspace = true, optional = true }
emery-diagnostics.workspace = true
emery-error.workspace = true
omnia-guest.workspace = true
emery-project.workspace = true
semver.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
emery-transport = { workspace = true, optional = true }

[dev-dependencies]
omnia-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "command"
required-features = ["cli"]

[[test]]
name = "references"
required-features = ["cli"]
