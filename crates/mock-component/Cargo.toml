[package]
name = "emery-mock-component"
description = "Mock source-adapter component: the journey-test seam fixture"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Component-only crate: nothing imports it natively.
[lib]
name = "mock_component"
crate-type = ["cdylib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
emery-adapter.workspace = true
# Path, not workspace: cargo-deny's unused-workspace-dependency lint
# cannot see wasm32-gated usage, and this is the only consumer.
emery-mock = { path = "../mock" }
