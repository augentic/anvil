# The Emery-owned Omnia host capability backing the engine guest's
# `emery:exec-bits` import. Owns the package WIT under `wit/`. The lib
# name is fixed by `omnia::runtime!`'s hosts codegen, which derives the
# crate path `omnia_wasi_execbits` from the `WasiExecBits` host type.
[package]
name = "emery-wasi-exec-bits"
description = "Emery-owned Omnia host capability: executable-bit round-tripping for snapshot trees"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "omnia_wasi_execbits"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
omnia.workspace = true
tokio.workspace = true
# The bindgen `tracing` imports mode instruments every generated
# host-side trampoline.
tracing.workspace = true
wasmtime.workspace = true
