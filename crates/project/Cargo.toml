[package]
name = "emery-project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Emery project foundation: init, adapter resolution, config, journal, registry, the plan and slice data models, seam capability traits, and the judgment kernel"
categories = ["development-tools"]
keywords = ["emery", "workflow", "foundation"]
readme = "../../README.md"

# Workspace code imports the short crate name; the package publishes as emery-project.
[lib]
name = "project"

[lints]
workspace = true

[dependencies]
emery-artifacts.workspace = true
emery-diagnostics.workspace = true
emery-error.workspace = true
jiff.workspace = true
omnia-guest.workspace = true
petgraph.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

# The workspace kernel's symlink shim: `std::os::wasi::fs` is
# unstable, so symlink creation goes through the preopens directly.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wasip2.workspace = true

[dev-dependencies]
emery-mock.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
