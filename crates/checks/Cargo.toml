# Repo-local checks as a lightweight package: architecture boundary
# and plugin authoring shape. Kept as its own crate (not root-package
# tests) so the Wasmtime-heavy runtime graph stays out of the ordinary
# test build. Docs/plugin link integrity is lychee's job (`cargo make
# links`). Cross-crate test support lives in `crates/linked` and
# `crates/mock`; fixtures are crate-local under
# `crates/<name>/tests/fixtures/`.
[package]
name = "checks"
description = "Repo architecture boundary and plugin authoring checks"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false
autobenches = false
autoexamples = false

[[test]]
name = "boundaries"
path = "boundaries.rs"

[[test]]
name = "authoring"
path = "authoring.rs"

[dev-dependencies]
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
