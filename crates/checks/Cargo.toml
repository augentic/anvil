# Repo-local checks as a lightweight package: architecture boundary,
# docs/plugin link integrity, and plugin authoring shape. Kept as its
# own crate (not root-package tests) so the Wasmtime-heavy runtime
# graph stays out of the ordinary test build. Cross-crate test support
# lives in `crates/harness` and `crates/fixture`; fixtures are
# crate-local under `crates/<name>/tests/fixtures/`.
[package]
name = "checks"
description = "Repo architecture boundary and docs link integrity checks"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false
autobenches = false
autoexamples = false

[[test]]
name = "boundaries"
path = "boundaries.rs"

[[test]]
name = "links"
path = "links.rs"

[[test]]
name = "authoring"
path = "authoring.rs"

[dev-dependencies]
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
