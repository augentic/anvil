# The Emery-owned Omnia host capability backing the engine guest's
# `emery:exec-mode` import. Owns the package WIT under `wit/`. The lib
# name is fixed by `omnia::runtime!`'s hosts codegen, which derives the
# crate path `omnia_wasi_exec` from the `WasiExec` host type.
[package]
name = "emery-wasi-exec"
description = "Emery-owned Omnia host capability: executable-mode round-tripping for snapshot trees"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "omnia_wasi_exec"
path = "src/lib.rs"

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
emery-project.workspace = true
futures.workspace = true
omnia.workspace = true
tokio.workspace = true
# The bindgen `tracing` imports mode instruments every generated
# host-side trampoline.
tracing.workspace = true
wasmtime.workspace = true
