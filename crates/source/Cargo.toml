[package]
name = "emery-source"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The emery:adapter/source contract, both sides: WIT bindings, the Evidence DTOs, the import-side Source capability, and the claim gate (id grammar + required extras)"
categories = ["development-tools"]
keywords = ["emery", "adapter", "wit"]
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
# `schema` carries the `schemars` the Evidence DTOs derive against, so the
# guest and the engine share one schema crate.
omnia-guest = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true
