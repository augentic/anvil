[package]
name = "specify-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Specify workflow crate: slice, change, adapter, registry, config, merge, init lifecycle authority"
categories = ["development-tools"]
keywords = ["specify", "workflow", "lifecycle"]
readme = "../../README.md"
# Integration tests compile to the single `it` binary (one binary per crate);
# the per-area hubs are pulled in via tests/it.rs `#[path]` includes.
autotests = false

[lints]
workspace = true

# The `native` feature (default-on) carries the host-binary-only surface:
# the bootstrap lifecycle (`upgrade`, `plugins`) and its `ureq` release
# probe. Guest builds (`wasm32-wasip2`) depend on this crate with
# `default-features = false`; everything outside the gate stays
# wasm32-clean (`cargo make check-wasm-core` is the keeper). The gate is
# a workflow-crate concern only: the root `specify` binary always builds
# with defaults and references the gated modules unconditionally.
[features]
default = ["native"]
native = ["dep:ureq"]

[dependencies]
glob.workspace = true
jiff.workspace = true
jsonschema.workspace = true
petgraph.workspace = true
regex.workspace = true
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
specify-diagnostics.workspace = true
specify-error.workspace = true
specify-guest-model.workspace = true
specify-model.workspace = true
specify-schema.workspace = true
specify-extension.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
regex.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "it"
path = "tests/it.rs"
