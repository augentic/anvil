name: ADR required paths

# CONSTITUTION.md invariant 5 (remediation Phase 2): a pull request
# touching a gate/authority/verb/artifact path, or raising a ratchet
# ceiling, must carry a decision record under rfcs/decisions/ in the
# same diff. The gated prefixes live in scripts/adr-required-paths.txt.

on:
  pull_request:

permissions:
  contents: read

jobs:
  adr-required:
    name: Gated paths carry a decision record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check gated paths against the diff
        run: scripts/adr-required.sh "${{ github.event.pull_request.base.sha }}"
