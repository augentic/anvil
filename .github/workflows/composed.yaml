# The deterministic shipped-guest boundary: build the workflow core and
# both echo adapter fixtures, then host them in one Omnia command-mode
# deployment. This proves WIT linking, dispatch, writable preopens, and
# the replay-backed full loop without a sibling checkout or credentials.
#
# Scheduled/manual rather than per-push: the Wasmtime execution path is
# too slow for the ordinary commit gate, and per-push CI already checks
# the guest crates compile for wasm32-wasip2. Clippy over the harness is
# owned by the shared CI workflow's --workspace lint. Not a required
# status; run it manually before releases or after WIT/runtime changes.
name: Composed

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed:
    name: Composed workflow core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build workflow guest
        run: cargo build --locked -p specify --lib --target wasm32-wasip2

      - name: Build adapter fixtures
        run: cargo build --locked -p fixtures --examples --target wasm32-wasip2

      - name: Composed workflow smoke
        run: cargo nextest run --locked -p specify-composed-tests --no-tests=pass
