name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-d2
            ~/.cargo/bin/mdbook-linkcheck
            ~/.cargo/bin/mdbook-pagetoc
            ~/.cargo/bin/mdbook-template
          key: docs-tools-mdbook-0.4.52-d2-0.3.4-lc-0.7.7-pt-0.2.0-tpl-1.1.1

      - name: Install mdbook tool chain
        env:
          MDBOOK_VERSION: "0.4.52"
          MDBOOK_D2_VERSION: "0.3.4"
          MDBOOK_LINKCHECK_VERSION: "0.7.7"
          MDBOOK_PAGETOC_VERSION: "0.2.0"
          MDBOOK_TEMPLATE_VERSION: "1.1.1"
        run: |
          set -euo pipefail
          cargo install --force --locked --version "$MDBOOK_VERSION" mdbook
          cargo install --force --locked --version "$MDBOOK_D2_VERSION" mdbook-d2
          cargo install --force --locked --version "$MDBOOK_LINKCHECK_VERSION" mdbook-linkcheck
          cargo install --force --locked --version "$MDBOOK_PAGETOC_VERSION" mdbook-pagetoc
          cargo install --force --locked --version "$MDBOOK_TEMPLATE_VERSION" mdbook-template
          if ! command -v d2 >/dev/null 2>&1; then
            curl -fsSL https://d2lang.com/install.sh | sh -s --
          fi

      - name: Build book (HTML + linkcheck)
        run: make docs

      - name: Set release date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> ${GITHUB_OUTPUT}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ./docs/book/html --name specify-docs --compatibility-date ${{ steps.date.outputs.today }}
