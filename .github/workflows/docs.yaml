name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mdbook toolchain
        uses: taiki-e/install-action@v2
        with:
          # mdbook-linkcheck2 is not in the install-action manifest; falls back to cargo-binstall.
          tool: mdbook,mdbook-linkcheck2

      - name: Build book
        run: mdbook build docs

      # docs/wrangler.jsonc owns the worker name, assets directory, and the
      # emery.augentic.io custom-domain route, so every deploy (re)attaches
      # the domain. Requires the `augentic.io` zone in the same Cloudflare
      # account as the API token.
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config docs/wrangler.jsonc
