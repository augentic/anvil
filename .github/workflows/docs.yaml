name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-d2
            ~/.cargo/bin/mdbook-linkcheck
            ~/.cargo/bin/mdbook-pagetoc
            ~/.cargo/bin/mdbook-template
          key: docs-tools-mdbook

      - name: Install mdbook tool chain
        run: |
          set -euo pipefail
          cargo install --locked mdbook
          cargo install --locked mdbook-d2
          cargo install --locked mdbook-linkcheck
          cargo install --locked mdbook-pagetoc
          cargo install --locked mdbook-template
          if ! command -v d2 >/dev/null 2>&1; then
            curl -fsSL https://d2lang.com/install.sh | sh -s --
          fi

      - name: Build book (HTML + linkcheck)
        run: make docs

      - name: Set release date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> ${GITHUB_OUTPUT}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ./docs/book/html --name specify-docs --compatibility-date ${{ steps.date.outputs.today }}
