# The deterministic WASM boundary: build the workflow core and the
# combined harness adapter, then host them in one Omnia command-mode
# deployment. Proves WIT linking, dispatch on both axes, writable
# preopens, model-host wiring, and the typed error lift — without a
# sibling checkout or credentials. Not a second workflow matrix.
#
# Weekly / path-filtered / manual rather than per-push: the Wasmtime
# execution path is too slow for the ordinary commit gate, and per-push
# CI already checks the guest crates compile for wasm32-wasip2. Required
# before release tags; run it manually after WIT/runtime/preopen changes.
# Clippy over the harness is owned by the shared CI workflow's
# --workspace lint.
name: WASM

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "wit/**"
      - "src/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wasm.yaml"

permissions:
  contents: read

jobs:
  wasm:
    name: WASM boundary smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build workflow guest
        run: cargo build --locked -p specify --lib --target wasm32-wasip2

      - name: Build examples adapter
        run: cargo build --locked -p examples --example adapter-wasm --target wasm32-wasip2

      - name: WASM boundary smoke
        run: cargo run --locked -p examples --example wasm-smoke --features host
