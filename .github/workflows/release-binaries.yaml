name: Release binaries

# Cross-platform `specify` binary build. Triggered by the `v*.*.*` tag
# that publish.yaml pushes on a merged release PR; publish.yaml creates
# the GitHub Release (curated notes) and this workflow attaches the
# built binary archives to it. The Cargo workspace lives at the repo root.
#
# The same tag also publishes the wasm-shaped artifacts (DECISIONS.md
# §"Publishing and distribution: one transport, idempotent legs"): the
# core guest as `specify:core@<version>` and the WIT contract as
# `specify:adapter@<wit version>`, each through an idempotent
# `cargo make publish-*` task — this workflow is a thin caller. Keeping
# the publish jobs inside this workflow (not a separate one) is what
# lets job dependencies enforce the binary↔core-guest lockstep below.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Canonical first-party registry host: `wkg` resolves it through
  # https://augentic.io/.well-known/wasm-pkg/registry.json to the OCI
  # backend. Must match the `specify` namespace mapping
  # `specify:<name>@<ver>` package references resolve against. Override
  # via repository variable for a mirror.
  REGISTRY: ${{ vars.SPECIFY_REGISTRY || 'augentic.io' }}
  REGISTRY_NAMESPACE: specify

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          # aarch64 Linux uses `cross` for its portable glibc toolchain.
          # Rationale: avoids hand-rolling apt-installed gcc-aarch64-linux-gnu
          # env wiring in every step, and matches rustup's own release workflow.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin specify

      - name: Build (cross)
        if: matrix.use_cross
        shell: bash
        run: cross build --release --locked --target ${{ matrix.target }} --bin specify

      - name: Compute version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="specify-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" specify
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $archive = "specify-$version-${{ matrix.target }}.zip"
          7z a $archive "target\${{ matrix.target }}\release\specify.exe"
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() + "  " + $archive | Out-File -FilePath "$archive.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: specify-${{ matrix.target }}
          path: |
            specify-*.tar.gz
            specify-*.zip
            specify-*.sha256
          if-no-files-found: error
          retention-days: 7

  # Publish the core guest as `specify:core@<VERSION>`. The
  # publish leg lives in `cargo make publish-core`; this job only
  # supplies toolchain, credentials, and the tag↔VERSION guard. The
  # task's probe-first idempotency makes re-running this workflow
  # against an already-published tag a safe no-op.
  publish-core:
    name: Publish specify:core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-core

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Install wkg
        run: cargo install wkg@0.15.0 --locked # pinned: the idempotency probe fingerprints are validated against this version

      # The published core identity always equals the binary version:
      # the tag being released must match the VERSION file the
      # publish-core task reads, or the lockstep below would pin the
      # binaries to a core that was never published under their version.
      - name: Verify VERSION matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/}"
          tag_version="${tag_version#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${tag_version}" != "${file_version}" ]; then
            echo "::error::tag version ${tag_version} does not match VERSION file ${file_version}"
            exit 1
          fi

      # `wkg` resolves the `specify` namespace through this config.
      # Auth is GITHUB_TOKEN only (the registry username/password
      # secrets are retired): `permissions: packages: write`
      # above is the whole credential story.
      - name: Write wkg config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/wasm-pkg"
          cat > "${XDG_CONFIG_HOME:-$HOME/.config}/wasm-pkg/config.toml" <<EOF
          [namespace_registries]
          ${REGISTRY_NAMESPACE} = "${REGISTRY}"

          [registry."${REGISTRY}".oci]
          auth = { username = "${{ github.actor }}", password = "${{ secrets.GITHUB_TOKEN }}" }
          EOF

      - name: Publish core guest
        run: cargo make publish-core

  # Publish the WIT contract as `specify:adapter@<wit version>`.
  # The skip-if-present probe inside `cargo make publish-wit`
  # is the version-changed guard: a tag that did not bump the WIT
  # `package` declaration finds the version already published and
  # no-ops. No wasm32 Rust target needed — `wkg wit build` encodes the
  # WIT directory directly.
  publish-wit:
    name: Publish specify:adapter (WIT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-wit

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Install wkg
        run: cargo install wkg@0.15.0 --locked # pinned: the idempotency probe fingerprints are validated against this version

      # Same GITHUB_TOKEN-only credential story as publish-core.
      - name: Write wkg config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/wasm-pkg"
          cat > "${XDG_CONFIG_HOME:-$HOME/.config}/wasm-pkg/config.toml" <<EOF
          [namespace_registries]
          ${REGISTRY_NAMESPACE} = "${REGISTRY}"

          [registry."${REGISTRY}".oci]
          auth = { username = "${{ github.actor }}", password = "${{ secrets.GITHUB_TOKEN }}" }
          EOF

      - name: Publish WIT contract
        run: cargo make publish-wit

  release:
    name: Attach binaries to release
    # The binary↔core-guest lockstep is a release invariant
    # (DECISIONS.md §"Publishing and distribution: one transport,
    # idempotent legs"): a binary version whose `specify:core`
    # publish failed is a broken release, so the binaries are never
    # attached until publish-core succeeds. publish-wit deliberately
    # does NOT gate the release — the WIT contract versions
    # independently of the binary, and most tags no-op that leg; a WIT
    # publish failure is visible on the workflow run without holding
    # the binaries hostage.
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: specify-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # The binary archives are the only release artifacts. The workspace
      # crates are not published to crates.io — there are no external crate
      # consumers, and the path-only workspace deps are deliberate. Notes
      # are owned by publish.yaml; this step only attaches files to the
      # already-created release for the tag.
      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
