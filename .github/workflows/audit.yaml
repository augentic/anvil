name: Audit

# Daily advisory-DB audit of the Rust workspace at the repo root.
# Advisory findings are surfaced here rather than on the per-push CI gate so a
# fresh upstream advisory never blocks an unrelated change.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  audit:
    uses: augentic/.github/.github/workflows/audit.yaml@main
    secrets: inherit
