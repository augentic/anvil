# Acceptance workflow for the direct RM-01 cross-repo proof. The make
# target remains the source of truth; this workflow just builds a fresh
# `specify` binary and runs it in CI.

name: Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Makefile"
      - "scripts/**"
      - "tests/**"
      - "capabilities/**"
      - "plugins/**"
      - ".github/workflows/acceptance.yml"

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the specify-cli ref the acceptance suite is validated against.
  # Keep this in lockstep with the local development binary referenced
  # by SPECIFY_BIN in docs/contributing/acceptance.md; bump together.
  SPECIFY_CLI_REF: main
  SPECIFY_CLI_REPO: augentic/specify-cli

jobs:
  rm01:
    name: RM-01 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout specify
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Checkout specify-cli
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SPECIFY_CLI_REPO }}
          ref: ${{ env.SPECIFY_CLI_REF }}
          path: specify-cli

      - name: Build specify-cli (release)
        working-directory: specify-cli
        run: cargo build --release --bin specify

      - name: Export SPECIFY_BIN
        run: echo "SPECIFY_BIN=${GITHUB_WORKSPACE}/specify-cli/target/release/specify" >> "$GITHUB_ENV"

      - name: Static checks
        run: make checks

      - name: RM-01 cross-repo acceptance
        run: make test

      - name: Upload preserved fixture on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rm01-acceptance-fixture
          path: /tmp/specify-rm01-*
          if-no-files-found: ignore
          retention-days: 7
