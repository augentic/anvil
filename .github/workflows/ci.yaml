name: CI

on:
  push:
    paths:
      - "plugins/**"
      - "adapters/**"
      - "schemas/**"
      - "scripts/**"
      - "docs/**"
      - "tests/**"
      - "tooling/**"
      - ".cursor/rules/**"
      - ".cursor-plugin/**"
      - ".github/workflows/ci.yaml"
      - "AGENTS.md"
      - "Makefile"
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Documentation and consistency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Choose specify-cli ref
        id: specify-cli-ref
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --exit-code --heads https://github.com/augentic/specify-cli.git "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout specify-cli schemas
        uses: actions/checkout@v6
        with:
          repository: augentic/specify-cli
          path: specify-cli
          ref: ${{ steps.specify-cli-ref.outputs.ref }}
          sparse-checkout: |
            schemas
          sparse-checkout-cone-mode: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tooling

      - name: Run acceptance tests
        run: cargo test --manifest-path tooling/Cargo.toml
        env:
          SPECIFY_CLI_DIR: specify-cli

      - name: Run framework checks
        run: cargo run --release --manifest-path tooling/Cargo.toml -- check
        env:
          SPECIFY_CLI_DIR: specify-cli
