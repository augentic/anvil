name: CI

on:
  push:
    paths:
      - "plugins/**"
      - "schemas/**"
      - "scripts/**"
      - "docs/**"
      - ".cursor/rules/**"
      - ".cursor-plugin/**"
      - ".github/workflows/ci.yaml"
      - "AGENTS.md"
      - "Makefile"
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Documentation and consistency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout specify-cli schemas
        uses: actions/checkout@v6
        with:
          repository: augentic/specify-cli
          path: specify-cli
          ref: ${{ github.head_ref || github.ref_name }}
          sparse-checkout: |
            schemas
          sparse-checkout-cone-mode: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Run checks
        run: make check
        env:
          SPECIFY_CLI_DIR: specify-cli
