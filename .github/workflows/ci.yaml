name: CI

on:
  push:

permissions:
  contents: read

jobs:
  ci:
    uses: augentic/.github/.github/workflows/ci.yaml@main
    secrets: inherit

  # The non-Rust checks: the framework-quality suite — prose/manifest
  # invariants (links, skills, scenarios, docs) as plain cargo tests at
  # tests/framework/. The test target lives on the root package
  # (no `workflow` crate in its graph), so no specify-adapters checkout
  # is needed here.
  framework:
    name: Framework quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Framework quality checks
        run: cargo test --test framework

  # The deterministic shipped-guest boundary: build the workflow core and
  # both echo adapter fixtures, then host them in one Omnia command-mode
  # deployment. This proves WIT linking, dispatch, writable preopens, and
  # the replay-backed full loop without a sibling checkout or credentials.
  composed:
    name: Composed workflow core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build workflow guest
        run: cargo build --locked -p specify --lib --target wasm32-wasip2

      - name: Build adapter fixtures
        run: cargo build --locked -p fixtures --examples --target wasm32-wasip2

      - name: Composed workflow smoke
        run: cargo nextest run --locked -p specify-composed-tests --no-tests=pass

      - name: Composed harness clippy
        run: cargo clippy --locked -p specify-composed-tests --all-targets -- -D warnings
