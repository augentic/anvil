name: CI

on:
  push:

# Superseded pushes to the same ref stop consuming runners; main always
# runs to completion so its caches and required checks stay warm.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The full Rust gate via the shared org workflow. Its test job runs
  # nextest over the workspace default members (crates/* plus
  # tests/framework), so crate integration and the framework-quality
  # suite execute here without a separate job. Clippy runs --workspace,
  # which also lints the opt-in composed harness.
  ci:
    uses: augentic/.github/.github/workflows/ci.yaml@main
    secrets: inherit

  # The per-push WASM boundary: prove the guest-facing crates still
  # compile for wasm32-wasip2. Composed runtime execution (WIT linking,
  # dispatch, preopens, the replay-backed loop) runs on the scheduled
  # composed workflow, not per push.
  wasm:
    name: WASM guest check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check wasm guests
        run: cargo check --locked --lib -p specify -p transport --target wasm32-wasip2
        env:
          RUSTFLAGS: -Dwarnings
