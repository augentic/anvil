name: CI

on:
  push:

permissions:
  contents: read

jobs:
  # Full Rust workspace gate (clippy, fmt, test, doctests, doc, vet, deny)
  # via the shared org workflow. The workspace lives at the repo root.
  rust:
    uses: augentic/.github/.github/workflows/ci.yaml@main
    with:
      working-directory: .
    secrets: inherit

  # Repo-specific prose gate: the framework lint over the in-tree prose
  # surface (plugins/, docs/, codex/), built from the in-tree binary.
  # Not part of the generic Rust workspace CI, so it stays a
  # first-class job here.
  framework-lint:
    name: Framework lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Verify framework
        run: make lint
