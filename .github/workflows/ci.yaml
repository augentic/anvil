name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # cargo-script (scripts/specify.rs) is still nightly-only (-Zscript); move
      # this to a stable pin once cargo-script stabilizes (rust-lang/cargo#16569).
      # rust-toolchain.toml pins nightly; this action makes it available + cacheable.
      - uses: dtolnay/rust-toolchain@nightly
        id: toolchain
        with:
          toolchain: nightly

      # Resolve the committed `cli` pin to a concrete specify-cli commit SHA so the
      # build cache is keyed on the exact source (and busts when the pin moves).
      # Best-effort: a miss just rebuilds, so a thin extractor is fine here.
      - name: Resolve specify-cli pin
        id: pin
        shell: bash
        run: |
          line="$(grep -E '^cli[[:space:]]*=' Specify.toml || true)"
          url="$(sed -nE 's/.*git[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' <<<"$line")"
          url="${url:-https://github.com/augentic/specify-cli}"
          ref=""
          for k in rev branch tag; do
            v="$(sed -nE "s/.*$k[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p" <<<"$line")"
            [ -n "$v" ] && { ref="$v"; break; }
          done
          if [ -z "$ref" ]; then
            ver="$(sed -nE 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' <<<"$line")"
            [ -n "$ver" ] && ref="v$ver"
          fi
          sha=""
          [ -n "$ref" ] && sha="$(git ls-remote "$url" "$ref" | awk 'NR==1{print $1}')"
          [ -n "$sha" ] || sha="$(sha256sum Specify.toml | cut -c1-16)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache built CLI + cargo home
        uses: actions/cache@v4
        with:
          path: |
            .bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/build
          key: specify-cli-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ steps.pin.outputs.sha }}

      - name: Verify spec-runtime symlinks resolve
        run: |
          status=0
          for d in adapters/sources/*/references/spec-runtime adapters/targets/*/references/spec-runtime; do
            if [ ! -L "$d" ]; then
              echo "error: $d must be a symlink to ../../../shared/references/runtime (no materialised copies)" >&2
              status=1
            elif [ ! -e "$d" ]; then
              echo "error: $d is a broken symlink" >&2
              status=1
            fi
          done
          exit $status

      # Builds the committed `cli` source pin from scratch and runs lint framework.
      - name: Verify framework
        run: make lint
