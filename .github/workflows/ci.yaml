name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # -------------------------------------------------------------
      # The specify-cli version to use — sibling branch or main
      # -------------------------------------------------------------
      - id: specify-cli
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --exit-code --heads https://github.com/augentic/specify-cli.git "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          repository: augentic/specify-cli
          path: specify-cli
          ref: ${{ steps.specify-cli.outputs.ref }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specify-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # -------------------------------------------------------------
      # CI Checks
      # -------------------------------------------------------------
      - name: Verify symlinks
        run: |
          status=0
          for d in adapters/sources/*/references/spec-runtime adapters/targets/*/references/spec-runtime; do
            if [ ! -L "$d" ]; then
              echo "error: $d must be a symlink to ../../../shared/references/runtime (no materialised copies)" >&2
              status=1
            elif [ ! -e "$d" ]; then
              echo "error: $d is a broken symlink" >&2
              status=1
            fi
          done
          exit $status

      # Release build: a debug lint binary is many times slower and not
      # representative (DIAGNOSTICS.md performance posture); build once,
      # then run the binary directly.
      - name: Build lint binary
        run: cargo build --release --locked --manifest-path specify-cli/Cargo.toml --bin specify

      - name: Verify framework
        run: |
          specify-cli/target/release/specify lint framework --framework-root .
