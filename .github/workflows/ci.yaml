name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # - uses: dtolnay/rust-toolchain@nightly

      # - name: Resolve specify-cli pin
      #   id: pin
      #   run: echo "sha=$(cargo +nightly -Zscript scripts/specify.rs --resolved-ref)" >> "$GITHUB_OUTPUT"

      # - uses: actions/checkout@v6
      #   with:
      #     repository: augentic/specify-cli
      #     ref: ${{ steps.pin.outputs.sha }}
      #     path: specify-cli
      #     fetch-depth: 1

      # - name: Use local specify-cli checkout
      #   run: echo 'cli = { path = "specify-cli" }' > Specify.local.toml

      - name: specify-cli branch
        id: specify-cli
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --exit-code --heads https://github.com/augentic/specify-cli.git "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          repository: augentic/specify-cli
          path: specify-cli
          ref: ${{ steps.specify-cli.outputs.ref }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specify-cli
          cache-on-failure: true

      - name: Verify symlinks
        run: |
          status=0
          for d in adapters/sources/*/references/spec-runtime adapters/targets/*/references/spec-runtime; do
            if [ ! -L "$d" ]; then
              echo "error: $d must be a symlink to ../../../shared/references/runtime (no materialised copies)" >&2
              status=1
            elif [ ! -e "$d" ]; then
              echo "error: $d is a broken symlink" >&2
              status=1
            fi
          done
          exit $status

      # - name: Verify framework
      #   run: make lint

      - name: Verify framework
        run: |
          cargo run --locked --manifest-path specify-cli/Cargo.toml --bin specify -- lint framework --framework-root .
