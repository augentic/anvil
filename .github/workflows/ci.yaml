name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Full-parallelism nextest profile; local runs keep the bounded
      # default so macOS does not choke on the integration subprocesses.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Symlink integrity — fail early if a spec-runtime link is missing
      # or broken (no materialised copies allowed). First-party adapter
      # trees now live in augentic/specify-adapters, so `nullglob` lets
      # this guard no-op cleanly until/unless an adapter tree returns to
      # this repo (the adapters/shared/ rule pack carries no such links).
      - name: Verify symlinks
        run: |
          shopt -s nullglob
          status=0
          for d in adapters/sources/*/references/spec-runtime adapters/targets/*/references/spec-runtime; do
            if [ ! -L "$d" ]; then
              echo "error: $d must be a symlink to ../../../shared/references/runtime (no materialised copies)" >&2
              status=1
            elif [ ! -e "$d" ]; then
              echo "error: $d is a broken symlink" >&2
              status=1
            fi
          done
          exit $status

      # The stable toolchain is pinned by engine/rust-toolchain.toml; nightly
      # rustfmt is additionally needed for the `fmt-check` gate, which runs
      # `cargo +nightly fmt --all -- --check`.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-src, rustfmt
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-nextest,cargo-deny,cargo-vet

      # Framework lint over the in-tree prose surface (plugins/, docs/,
      # adapters/), built from the same in-tree binary.
      - name: Verify framework
        run: make lint
