name: CI

on:
  push:

permissions:
  contents: read

jobs:
  ci:
    uses: augentic/.github/.github/workflows/ci.yaml@main
    secrets: inherit

  # The non-Rust checks: the framework-quality suite — prose/manifest
  # invariants (links, skills, scenarios, docs) as plain cargo tests at
  # tests/framework_quality/. The test target lives on the root package
  # (no `workflow` crate in its graph), so no specify-adapters checkout
  # is needed here.
  framework:
    name: Framework quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Framework quality checks
        run: cargo test --test framework_quality
