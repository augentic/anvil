name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve SPECIFY_VERSION
        id: specify-version
        shell: bash
        run: |
          if [ -n "${SPECIFY_VERSION:-}" ]; then
            resolved="${SPECIFY_VERSION}"
          else
            resolved="$(./scripts/specify.sh --mode config-key version)"
          fi
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "SPECIFY_VERSION=$resolved" >> "$GITHUB_ENV"

      - name: Cache acquired binary
        uses: actions/cache@v4
        with:
          path: .bin
          key: specify-${{ runner.os }}-${{ steps.specify-version.outputs.resolved }}

      # Minimal Rust for scripts/specify.sh acquisition when the cache misses.
      # Remove once release assets or install.sh cover the pinned version.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: minimal

      - name: Verify spec-runtime symlinks resolve
        run: |
          status=0
          for d in adapters/sources/*/references/spec-runtime adapters/targets/*/references/spec-runtime; do
            if [ ! -L "$d" ]; then
              echo "error: $d must be a symlink to ../../../shared/references/runtime (no materialised copies)" >&2
              status=1
            elif [ ! -e "$d" ]; then
              echo "error: $d is a broken symlink" >&2
              status=1
            fi
          done
          exit $status

      - name: Verify framework
        run: make lint
